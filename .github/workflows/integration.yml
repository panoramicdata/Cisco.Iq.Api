name: Live Cisco IQ integration

# Manual only: integration tests need live credentials and must not run in CI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Live Cisco IQ integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build --configuration Release
      - name: Test live authentication and assets
        env:
          CiscoIq__Token: ${{ secrets.CISCO_IQ_TOKEN }}
          CiscoIq__AccountId: ${{ secrets.CISCO_IQ_ACCOUNT_ID }}
          CiscoIq__AccountRegion: ${{ secrets.CISCO_IQ_ACCOUNT_REGION }}
        run: dotnet test --configuration Release --no-build --filter "Category=Integration" --fail-skips on
