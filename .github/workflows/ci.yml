name: CI

on:
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test and collect standard coverage
        run: dotnet test --configuration Release --no-build --filter "Category!=Integration" --fail-skips on --coverage --coverage-output-format cobertura --coverage-settings coverage.config --coverage-output standard.cobertura.xml --results-directory artifacts/coverage

      - name: Collect coverage including async method bodies
        run: dotnet test --configuration Release --no-build --filter "Category!=Integration" --fail-skips on --coverage --coverage-output-format cobertura --coverage-settings coverage.settings.xml --coverage-output extended.cobertura.xml --results-directory artifacts/coverage

      - name: Enforce coverage
        shell: pwsh
        run: |
          ./tools/Assert-Coverage.ps1 -Path artifacts/coverage/standard.cobertura.xml -MinimumBranchCoverage 100
          ./tools/Assert-Coverage.ps1 -Path artifacts/coverage/extended.cobertura.xml -MinimumBranchCoverage 100

      - name: Upload coverage to Codacy
        if: github.event_name == 'push'
        # A reporting service outage must not prevent package releases.
        continue-on-error: true
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: artifacts/coverage/standard.cobertura.xml

      - name: Test live authentication and assets
        if: github.event_name == 'push'
        env:
          CiscoIq__Token: ${{ secrets.CISCO_IQ_TOKEN }}
          CiscoIq__AccountId: ${{ secrets.CISCO_IQ_ACCOUNT_ID }}
          CiscoIq__AccountRegion: ${{ secrets.CISCO_IQ_ACCOUNT_REGION }}
        run: dotnet test --configuration Release --no-build --filter "Category=Integration" --fail-skips on

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: artifacts/coverage/*.cobertura.xml

      - name: Pack
        run: dotnet pack Cisco.Iq.Api/Cisco.Iq.Api.csproj --no-build --configuration Release --output ./artifacts

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget
          path: ./artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: david_n_m_bond

      - name: Publish to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
