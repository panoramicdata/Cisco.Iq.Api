openapi: 3.2.0
$self: https://iq.cisco.com/api/system/openapi/iq-system.openapi-en.yaml
info:
  title: System API
  summary: Structured queries, bulk changes, schemas, resource groups, and feedback
  description: Run structured queries; submit bulk changes; inspect schema metadata; manage resource groups; and submit feedback.
  termsOfService: https://www.cisco.com/c/en/us/about/legal/cloud-and-software.html
  contact:
    name: Cisco IQ Team
    url: https://iq.cisco.com
  license:
    name: Cisco Proprietary
    url: https://www.cisco.com/c/en/us/about/legal.html
  version: 0.1.0
servers:
- url: https://iq.cisco.com/api/system
  name: cisco-iq
  description: >-
    Global entry point for the Cisco IQ API.
- url: https://us-east-1.iq.cisco.com/api/system
  name: cisco-iq-us-east-1
  description: >-
    Cisco IQ API hosted in the United States (us-east-1).
- url: https://eu-frankfurt-1.iq.cisco.com/api/system
  name: cisco-iq-eu-frankfurt-1
  description: >-
    Cisco IQ API hosted in Europe (eu-frankfurt-1).
security:
- bearerAuth: []
tags:
- name: Authorization
  kind: nav
- name: Data Operations
  description: Read, search, suggest, and change data.
  kind: nav
- name: Feedback
  description: Submit and manage feedback.
  kind: nav
- name: Procedures
  description: Browse reusable definitions for data collection, transformation, assessment, and automation.
  kind: nav
- name: Resource Groups
  description: Manage account-scoped resource groups.
  kind: nav
- name: Schema
  description: Query metadata that describes the data model.
  kind: nav
- name: User Preference
  kind: nav
- name: deprecated
  description: Deprecated — scheduled for removal in a future release.
  kind: badge
- name: preview
  description: Preview API — subject to breaking changes without notice.
  kind: badge
paths:
  /v1/bulk:
    summary: Make multiple changes to resources in one request
    description: Make multiple changes to resources you can access in one request. Apply all changes together, or let each change succeed or fail independently.
    post:
      operationId: bulk
      summary: Make multiple changes to resources in one request
      description: Make multiple changes to resources you can access in one request. Apply all changes together, or let each change succeed or fail independently.
      tags:
      - Data Operations
      x-actions:
      - invoke:system.bulk
      parameters:
      - name: Prefer
        in: header
        description: States a preference for how the request is processed, per RFC 7240. Use respond-async to skip the inline attempt, wait to bound it to fewer seconds, or respond-sync to decline a job handle entirely. Preferences are hints. The server may disregard any of them and answer either way.
        schema:
          type: string
      - $ref: "#/components/parameters/traceparent"
      requestBody:
        description: Payload containing input fields for the bulk operation.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/system.BulkRequest"
      responses:
        "200":
          description: The request was processed. The body reports the outcome of every operation in the order submitted, including any that failed when the operations were committed independently.
