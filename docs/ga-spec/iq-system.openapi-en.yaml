  parameters:
    If-Match:
      name: If-Match
      in: header
      summary: Optimistic-concurrency precondition
      description: ETag value from the most recent GET response for this resource. The server rejects the mutation with 412 Precondition Failed if the resource has changed since then, preventing a write against stale state. Use the verbatim value returned in the ETag response header (RFC 9110 §13.1.1).
      schema:
        type: string
    If-Modified-Since:
      name: If-Modified-Since
      in: header
      summary: Conditional retrieval date
      description: Supply the verbatim value from the Last-Modified response header. The server returns 304 Not Modified if nothing has changed since that date; otherwise it returns the current response. The comparison is against the resource's own last-modification timestamp. Prefer If-None-Match when ETag is available (RFC 9110 §13.1.3).
      schema:
        type: string
    If-None-Match:
      name: If-None-Match
      in: header
      summary: Conditional retrieval validator
      description: ETag value from the most recent GET response for this resource. Returns the resource only if its current ETag differs; otherwise returns 304 Not Modified, allowing the client to reuse its cached copy. Supply the verbatim value returned in the ETag response header (RFC 9110 §13.1.2).
      schema:
        type: string
    If-Unmodified-Since:
      name: If-Unmodified-Since
      in: header
      summary: Date-based concurrency precondition
      description: Last-Modified date from the most recent GET response for this resource. The server rejects the mutation with 412 Precondition Failed if the resource has been modified since then, preventing a write against stale state. Use when ETag is unavailable. If the request also carries If-Match, the server evaluates If-Match and ignores this header (RFC 9110 §13.1.4).
      schema:
        type: string
    after:
      name: after
      in: query
      summary: Pagination cursor
      description: Opaque cursor from a previous response's Link header. Continue from the next page without interpreting or modifying the token.
      schema:
        type: string
    count:
      name: count
      in: query
      summary: Include total count
      description: When true, includes a `count` field in the response equal to the total number of matching rows, regardless of page size. Cannot be combined with a pagination cursor (`after`); only valid on the first page.
      schema:
        type: boolean
    filter:
      name: filter
      in: query
      summary: Filter expression
      description: "Filter expression applied to the collection before pagination. UUID fields and to-one reference comparisons require UUID literals, not resource paths; invalid UUID literals return HTTP 400 BAD_USER_INPUT before execution. Supported: field equality (`status == \"ACTIVE\"`, where the value must match the field's declared enum value), `tier != 0`, nullable stored relationship checks (`account == null`, `account != null`), ordered comparison (`<`, `<=`, `>`, `>=`), boolean combination (`&&`, `||`, `!`) with parentheses for grouping, case-sensitive substring match (`name.contains(\"acme\")`), case-insensitive substring, prefix, and suffix match (`name.icontains(\"ACME\")`, `name.istartsWith(\"ac\")`, `name.iendsWith(\"me\")`), element membership in array fields (`3 in flags`, `\"prod\" in scopes`), key existence in map fields (`\"env\" in tags`), constant string-key lookup (`tags[\"地域 / 環境\"] == \"本番\"`, with single- or double-quoted keys), literal string-list membership for scalar string-compatible fields and tag entries (`product.productId in [\"A\", \"B\"]`, `tags.env in [\"prod\", \"stage\"]`), nested value-type field access (`address.city == \"x\"`), array value-type sub-field predicates (`tags.value == \"x\"`), and many-to-one or one-to-one (owner-side) relationship traversal using a natural key, including a multi-hop chain and a chain that passes through a polymorphic relationship shared identically by every concrete type (`product.manufacturer.name == \"Cisco\"`, `owner.effectiveEntitlementTier.ordinal >= 3`). Literal string lists follow each field's equality validation, including enum values and UUID syntax. An empty list matches no row but still validates the field and retains referenced target readability checks. A chain longer than the configured hop limit, a polymorphic relationship immediately followed by another polymorphic relationship, one-to-many and many-to-many entity relationships, lists of numbers (`tier in [1, 2, 3]`), nonliteral list elements, lists on whole maps or ordinary map entries, dynamic map keys, numeric indexing, arithmetic, and other functions (such as plain `startsWith`, `endsWith`, and `matches`) are not supported. See https://iq.cisco.com/api/help#filtering. Tag values in `tags`, including relationship paths, reject `contains()`, `icontains()`, `startsWith()`, `istartsWith()`, `endsWith()`, `iendsWith()`, `matches()`. Use == to compare a specific tag key with its complete value, for example `tags.env == \"prod\"`; key existence remains supported. Tag string-search violations return HTTP 422 VALIDATION_FAILED."
      schema:
        type: string
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    inline.count:
      name: inline.count
      in: query
      summary: Include relationship totals
      description: When true, each selected relationship includes its exact authorized total in `count`. Requires `inline`. Omit or use false to return no relationship totals.
      schema:
        type: boolean
        default: false
    inline.max:
      name: inline.max
      in: query
      summary: Inline relationship page size
      description: Maximum references per selected relationship and parent. Requires `inline` and a positive value. To continue, pass the relationship's opaque `next` cursor as `after` to its member endpoint.
      schema:
        type: integer
        default: 25
        minimum: 1
        maximum: 100
    max:
      name: max
      in: query
      summary: Page size
      description: "Caps the number of items returned in one page. Use 0 only with `count=true` to return the exact count and an empty `items` array. Smaller positive values reduce response size. Larger positive values return results in fewer pages. Default: 25."
      schema:
        type: integer
        default: 25
        minimum: 0
        maximum: 50000
    offset:
      name: offset
      in: query
      summary: Pagination offset
      description: Zero-based index of the first item to return. Use with page size for direct page access when offset pagination is enabled.
      schema:
        type: integer
    select:
      name: select
      in: query
      summary: Sparse fieldset
      description: Comma-separated list of field names to include in the response. Omit to return the default field set. The `id` identifier and `_type` type discriminator are always included even when not listed. Unknown field names are rejected.
      schema:
        type: string
    system.schemaEntity.inline:
      name: inline
      in: query
      summary: Inline relationship references
      description: Comma-separated non-owning collection names. Each selected relationship returns bounded reference `items` with an optional opaque `next` cursor. With `select`, include each inline relationship in the selected fields.
      schema:
        type: array
        minItems: 1
        items:
          $ref: "#/components/schemas/system.SchemaEntityInlineMember"
      style: form
      explode: false
    system.schemaNamespace.inline:
      name: inline
      in: query
      summary: Inline relationship references
      description: Comma-separated non-owning collection names. Each selected relationship returns bounded reference `items` with an optional opaque `next` cursor. With `select`, include each inline relationship in the selected fields.
      schema:
        type: array
        minItems: 1
        items:
          $ref: "#/components/schemas/system.SchemaNamespaceInlineMember"
      style: form
      explode: false
    traceparent:
      name: traceparent
      in: header
      summary: Trace context
      description: "Optional W3C Trace Context propagation header (RFC format: `00-{trace-id}-{parent-id}-{flags}`). When present, the server creates a child span within the caller's trace; `parent-id` must identify the caller's current span."
      schema:
        type: string
        pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
  headers:
    Cache-Control:
      summary: Cache directive
      description: Directives that control caching behavior for this response. Authenticated responses carry `no-store` to prevent storage in HTTP caches or shared proxies (RFC 9111).
      schema:
        type: string
    Content-Disposition:
      summary: Export file name
      description: Sent only when the response is a CSV or Excel file. It marks the body as an attachment and gives the file name, which has the form <resource>_<UTC date>_<UTC time> and the file extension.
      schema:
        type: string
    Content-Encoding:
      summary: Content coding
      description: "Content coding that the server applied to the response body: `br` (RFC 7932) or `gzip` (RFC 9110 §8.4.1.3). The server compresses `application/json`, `application/*+json`, `application/yaml`, `application/*+yaml`, `text/csv`, and `text/plain` responses when the request `Accept-Encoding` header accepts `br` or `gzip` (RFC 9110 §12.5.3). It uses the coding with the higher quality value, and `br` wins a tie. A small body is not compressed unless the server streams it. Absent when the body is not compressed. Decode the body before you parse it. The `ETag` identifies the decoded body, so it is the same for every coding."
      schema:
        type: string
        enum:
        - br
        - gzip
    Date:
      summary: Response date
      description: Date and time at which the server generated the response, in IMF-fixdate format (RFC 9110 §6.6.1). Useful for detecting clock skew and correlating audit logs.
      schema:
        type: string
    ETag:
      summary: Entity tag
      description: Opaque identifier for the current state of the resource. Use with `If-None-Match` for conditional GETs and with `If-Match` for optimistic-concurrency on updates (RFC 9110 §8.8.3).
      schema:
        type: string
    Last-Modified:
      summary: Last-modified date
      description: Date and time at which the resource was last modified, in IMF-fixdate format. Send it back in `If-Modified-Since` to revalidate a cache, or in `If-Unmodified-Since` to make a subsequent write conditional (RFC 9110 §8.8.2).
      schema:
        type: string
    RateLimit:
      summary: Rate limit
      description: Current rate-limit quota state for the request, including remaining quota and reset time.
      schema:
        type: string
    RateLimit-Policy:
      summary: Rate-limit policy
      description: Published rate-limit policy describing the quota windows and units that apply to the request.
      schema:
        type: string
    Retry-After:
      summary: Retry delay
      description: Time to wait before retrying the request, expressed as delay-seconds or an HTTP date.
      schema:
        type: string
    Server-Timing:
      summary: Server timing
      description: "Time the server spent on this request, as a comma-separated list of metrics in the form `name;dur=<milliseconds>`, each optionally followed by `;desc=\"<text>\"`. The `total` metric covers the request up to the point the server began sending the response; any other metric names a phase within it. Browsers show these entries in the network timing panel. The set of metrics can change between releases. Read entries by name, not by position. Only `total` is guaranteed: the server drops metrics from the end of the list when the full set would not fit in the header."
      schema:
        type: string
    Vary:
      summary: Vary
      description: Lists the request headers used to select the response representation. Caches must store a separate entry for each combination of their values (RFC 9110 §12.5.5). `Accept-Encoding` and `Sec-Fetch-Site` select the content coding of the body. `Accept-Language` signals that the response body is localized.
      schema:
        type: string
    WWW-Authenticate:
      summary: Authentication challenge
      description: Authentication challenge issued by the server when the request lacks valid credentials (RFC 9110 §11.6.1). For Bearer tokens the value is `Bearer realm="<service>"`.
      schema:
        type: string
    X-Total-Count:
      summary: Export total count
      description: Sent only when the response is a CSV or Excel file. It gives the number of rows that match the read; the file holds at most `max` of them. The file is streamed, so the response has no Content-Length.
      schema:
        type: integer
        minimum: 0
    traceparent:
      summary: Trace context
      description: "W3C Trace Context identifier (RFC format: `00-{trace-id}-{parent-id}-{flags}`) returned with this response. The `trace-id` segment uniquely identifies the distributed trace; `parent-id` identifies the server span that produced this response. Clients can use `trace-id` to correlate log entries and spans across services."
      schema:
        type: string
        pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
  responses:
    BadRequest:
      description: Returned when the server cannot parse the request or when a header, query parameter, path parameter, or request body is missing, malformed, or uses an invalid format.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/std.ProblemDetail"
    Conflict:
      description: Returned when the request conflicts with the current state of the target resource, such as a uniqueness collision, concurrent modification, or invalid state transition.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/std.ProblemDetail"
    DefaultError:
      description: Returned when the server rejects the request with an undocumented error response.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/std.ProblemDetail"
    Forbidden:
      description: Returned when the caller is authenticated but is not allowed to perform this operation on the target resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/std.ProblemDetail"
    InternalServerError:
      description: Returned when the server encounters an unexpected condition while processing the request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/std.ProblemDetail"
    NotAcceptable:
      description: Returned when the client sends an Accept header requesting media types that this operation does not provide.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/std.ProblemDetail"
    NotFound:
      description: Returned when the target resource identified by the request does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/std.ProblemDetail"
    NotModified:
      description: Returned when the resource has not changed since the validator supplied in the conditional request header (If-None-Match or If-Modified-Since). The response body is empty; use the previously cached representation (RFC 9110 §15.4.5).
    PayloadTooLarge:
      description: Returned when the request body is too large or contains too many items. Reduce the request size and try again.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/std.ProblemDetail"
    PreconditionFailed:
      description: Returned when a conditional request precondition (If-Match or If-Unmodified-Since) evaluated to false, indicating the resource was modified after the client last retrieved it. Resubmit with a fresh ETag or Last-Modified value from a new GET request (RFC 9110 §15.5.9).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/std.ProblemDetail"
    ServiceUnavailable:
      description: Returned when the service is temporarily unable to process the request because of overload, maintenance, or a transient dependency failure.
      headers:
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/std.ProblemDetail"
    TooManyRequests:
      description: Returned when the client exceeds a request-rate or quota limit enforced by the service.
      headers:
        RateLimit:
          $ref: "#/components/headers/RateLimit"
        RateLimit-Policy:
          $ref: "#/components/headers/RateLimit-Policy"
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/std.ProblemDetail"
    Unauthorized:
      description: Returned when the request does not include valid authentication credentials, such as a missing, expired, or invalid access token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/std.ProblemDetail"
    UnprocessableEntity:
      description: Returned when the request is well-formed but rejected because the submitted values violate validation rules, business rules, or resource state constraints.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/std.ProblemDetail"
  securitySchemes:
    bearerAuth:
      type: http
      description: Long-lived API key or personal access token (PAT) transmitted as a Bearer token in the Authorization header. Per the OpenAPI 3.x specification, the Authorization header is not listed as an explicit parameter — it is implied by this security scheme.
      scheme: bearer
