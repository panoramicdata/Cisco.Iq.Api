    system.GroupByDimension:
      type: object
      description: One characteristic that separates a grouped query's buckets. Each distinct value of the characteristic opens a bucket, and the value is reported on every result row that belongs to it. An optional `fn` collapses a list-valued `source` to one scalar per resource before those scalars are bucketed.
      properties:
        fn:
          description: Function that collapses a list-valued `source` to one scalar per `from` resource before the request buckets on that scalar. Omit it to bucket on the field as a single value, or to unwind a collection element. On a collection, `COUNT` names the collection and `MIN` or `MAX` names an element field. A scalar `source` with `fn` is refused. `apply.fn` still aggregates the bucket.
          examples:
          - COUNT
          - MAX
          anyOf:
          - $ref: "#/components/schemas/system.AggregateFunction"
          - type: "null"
        source:
          type:
          - string
          - "null"
          description: "What the characteristic is read from, named relative to the query's `from` entity type: a field, or the key of a `compute` entry to bucket on the computed value. Set it to report the value under a name other than the source's own; when null, the field named by this entry's key is read. A collection element without `fn` unwinds to pair rows; a collection field with `fn` is collapsed per resource first. For a string-valued map, name one entry with a constant CEL string key, such as `tags[\"地域 / 環境\"]` or `tags['customer\\'s key']`. Dotted keys and backtick identifiers also work for their supported spellings. Tag keys use the same Unicode normalization as filters. Related map sources require their relationship in `expand`. Grouping by a map entry through a polymorphic relationship is not supported. Missing entries and null values share a null bucket; an empty string has its own bucket."
          examples:
          - model
          - severity
          - complianceMappings.frameworkName
          - complianceMappings
          - _openRecommendations
          - tags["地域 / 環境"]
    system.ProcedureDef:
