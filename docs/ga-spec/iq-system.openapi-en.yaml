    system.QueryRequest:
      type: object
      description: Read resources of one entity type with a CEL filter, selected fields, ordering, and paging. Each result row contains the selected fields of one matching resource.
      properties:
        after:
          type:
          - string
          - "null"
          description: Opaque cursor from a previous response. Pass this value to retrieve the next page of result rows, or of buckets on a grouped request. It is positional over `orderby`, so a cursor is only usable with the request that produced it. A grouped request with no `groupby` returns its single bucket on the first page and issues no cursor, so it reports a null `after` and refuses one sent to it.
        apply:
          type:
          - object
          - "null"
          description: "Optional per-bucket aggregations, keyed by the name each takes in a result row. Every bucket in the response carries a value for every entry. This member makes the request a grouped aggregation whether or not `groupby` is present: without it, the whole matched set is one bucket."
          additionalProperties:
            $ref: "#/components/schemas/system.AggregateSpec"
        compute:
          type:
          - object
          - "null"
          description: Optional computed values, keyed by the name each takes. Each entry reduces a collection that belongs to a resource to one scalar, for example the count of related items. On a structured read the scalar is added to every result row; on a grouped aggregation a `groupby` dimension may name the entry's key as its `source` to bucket resources by the computed value.
          additionalProperties:
            $ref: "#/components/schemas/system.ComputeSpec"
        count:
          type:
          - boolean
          - "null"
          description: "When true, the response includes a total beside the page: the number of resources matching `filter`, or on a grouped request (`groupby`/`apply`) the number of buckets the grouping produced that `having` keeps, or all of them when the request names no `having`. Either way it is the whole matched set, so a `max` smaller than it still reports the true figure. A grouped request with no `groupby` produces one bucket and so reports 1, or 0 when `having` drops that bucket. On a structured read it is rejected together with `after`, because the total is only valid for the first page; a grouped request accepts the pair, because its total is counted where the buckets are formed rather than where the page is cut. Required to be true when `max` is 0, which returns the count alone with no result rows. A grouped request has no such form and refuses `max: 0`. Default: false."
        expand:
          type:
          - object
          - "null"
          description: Related resources to include as nested results, keyed by alias. On a structured read the alias is a nested object for a to-one relationship or a nested array for a to-many relationship. Nested `expand` on an entry names a relationship of that related type. On a grouped request the alias is a join so a dimension or aggregation can name a related field. When null, no related results are nested and no extra join is added.
          additionalProperties:
            $ref: "#/components/schemas/system.ExpandRelationship"
        filter:
          type:
          - string
          - "null"
          description: CEL expression deciding which resources match, using the same grammar as the `filter` query parameter on an entity collection. When null, every resource the caller may read is returned.
          examples:
          - vendor == 'Cisco'
          - severity == 'CRITICAL' && status != 'RESOLVED'
        from:
          $ref: "#/components/schemas/std.ResourceUrn"
          description: Entity type to read, as an `entity:<namespace>.<entityName>` URN. Every `select` and `filter` field names a field of this type, as does every `orderby` field on a structured read. A grouped request orders by its own `groupby` and `apply` keys instead.
          examples:
          - entity:asset.physicalAsset
          - entity:assessment.finding
        groupby:
          type:
          - object
          - "null"
          description: "Optional grouping. When present, resources are bucketed by these characteristics, keyed by the name each takes in a result row, and the response returns one item per bucket instead of one per matching resource. Resources sharing the same value for every entry share a bucket, so adding an entry divides the buckets more finely.\nNaming no characteristic is a grouping, not the absence of one: with `apply` alone, every resource that `filter` admits falls in a single bucket and the response is one item. Because each `apply` entry carries its own `filter`, that one bucket still reports several differently scoped values, such as a count for each of a set of named ranges, in one request. A request naming neither `groupby` nor `apply` is a plain structured read (see `select`)."
          additionalProperties:
            $ref: "#/components/schemas/system.GroupByDimension"
        having:
          type:
          - string
          - "null"
          description: "Optional test that keeps only the buckets whose `apply` values satisfy it, written as a CEL expression over `apply` names. For example, with `apply` of `_failed` counting the results that failed, `_failed > 0` keeps the buckets with at least one failure and drops the rest. `having` acts after the grouping, so it narrows buckets by what they hold, where `filter` narrows the resources before they are grouped. `count` reports the buckets that remain, and `orderby`, `max`, and `after` page through them.\nAn expression may name only `apply` entries, never a `groupby` entry or a field of the `from` type; to narrow by a `groupby` value, use `filter`. It must be a true or false test built from comparisons joined with `&&`, `||`, and `!`; a function call or an `in` test is refused. A number is compared with a number of the same kind: a count with a whole number such as `0`, an average with a decimal such as `2.0`. A request that names neither `groupby` nor `apply` has no buckets, so it refuses `having`. When `from` is an interface or abstract type, a bucket holds the matching resources of every concrete type, and the test reads that combined bucket."
          examples:
          - _failed > 0
          - _assetCount >= 10 && _assetCount < 100
        max:
          type:
          - integer
          - "null"
          format: int32
          description: "Maximum number of result rows to return per page, or of buckets on a grouped request. The default and maximum match entity collection endpoints. Both apply to a grouped request whether or not it names this member, because how many buckets a grouping produces follows from the data: a dimension over a high-cardinality field is one bucket per distinct value. A grouped request with no `groupby` is the exception: it produces one bucket, so any value of 1 or more leaves the single item it returns unchanged. Use 0 only together with `count: true`, to return the exact count and an empty `items` array without fetching any result rows; a grouped request has no such form and refuses `max: 0`."
          minimum: 0
          maximum: 50000
        orderby:
          type:
          - string
          - "null"
          description: "Result order, as a comma-separated list of `field direction` terms using the same convention as entity collection endpoints. Each term names a direction of `asc` or `desc` and a field of the `from` entity type, or, on a grouped request, a key of the result row: a `groupby` or `apply` name. Ordering by a field of a source resource is rejected there, because a bucket carries only the keys the request named. When null, the result still comes back in a stable order, by the resource identifier, or on a grouped request by the values that form each bucket, so paging reaches every item either way. Name a term to choose the order instead. A grouped request with no `groupby` returns a single bucket, so a term there names an `apply` key and changes nothing about the one item returned."
          examples:
          - model asc
          - severity desc, status asc
          - _assetCount desc, _model asc
        select:
          type:
          - array
          - "null"
          description: Fields to return for each matching resource, each named relative to the `from` entity type. When null or empty, a default projection is returned. A result row carries one value per selected field. Rejected on a grouped request (`groupby`/`apply`), which projects only its own `groupby` and `apply` keys.
          examples:
          - - vendor
            - model
          - - severity
            - status
          items:
            type: string
      required:
      - from
    system.QueryResponse:
      type: object
      description: What a query returned. A structured read returns one row per matching resource; a grouped request (`apply`) returns one item per bucket, which is one item in total when it names no `groupby`. Either way the page carries a cursor to the next one, until the last.
      properties:
        after:
          type:
          - string
          - "null"
          description: Opaque cursor for retrieving the next page, of result rows, or of buckets on a query with `groupby`. Null when the current page is the last.
        count:
          type:
          - integer
          - "null"
          format: int64
          description: "Total matching `filter`, present only when the request set `count` to true: matching resources for a structured read, and buckets for a grouped request, matching what `items` holds either way. Reflects the full filtered total regardless of `max`. A `max` smaller than the total still reports the true total, not the page size, and on a grouped request it stays the same figure on every page."
        items:
          type: array
          description: >-
            The result rows, in the requested order. On a structured read each row contains the selected fields of one matching resource. On a grouped request each row represents a bucket, and its keys are the names the request gave to its dimensions and aggregations. Empty when nothing matched the filter, except on a grouped request naming no `groupby`, whose single bucket is formed by the grouping rather than by the data, so it is still reported with a `COUNT` or `COUNT_DISTINCT` of 0 and a null for every other aggregation.
            A `MIN` or `MAX` carries the type of the field it read, and a `COUNT` or `COUNT_DISTINCT` is a number. A `SUM` or `AVG` that cannot be held exactly by a JSON number is a decimal string instead, the same convention large integer and decimal fields follow. This covers every `AVG` but one over a floating-point field, and a `SUM` over a large integer or a decimal field.
          items: {}
      required:
      - after
      - items
