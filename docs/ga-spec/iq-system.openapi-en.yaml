components:
  schemas:
    RelationshipActionRequest:
      type: object
      description: Named members to add or remove, with optional exact conditions on the member resources.
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            properties:
              expectedEtag:
                type: string
                description: Expected stored token of the referenced member. A stale token fails the complete action, including a membership change that would be a no-op.
                minLength: 1
              ref:
                $ref: "#/components/schemas/std.EntityRef"
            required:
            - ref
            additionalProperties: false
      required:
      - items
      additionalProperties: false
    RelationshipActionResponse:
      type: object
      description: Actual added and removed links and current tokens for resources whose owned state changed.
      properties:
        added:
          type: array
          description: References to links added by this action. Existing links are omitted.
          maxItems: 100
          items:
            $ref: "#/components/schemas/std.EntityRef"
        changed:
          type: array
          description: References and stored tokens of resources whose owned state changed. Unchanged resources are omitted.
          maxItems: 100
          items:
            type: object
            properties:
              etag:
                type: string
                minLength: 1
              ref:
                $ref: "#/components/schemas/std.EntityRef"
            required:
            - ref
            - etag
            additionalProperties: false
        removed:
          type: array
          description: References to links removed by this action. Absent links are omitted.
          maxItems: 100
          items:
            $ref: "#/components/schemas/std.EntityRef"
      required:
      - added
      - removed
      - changed
      additionalProperties: false
    std.CaseInsensitiveText:
      type: string
      description: Character string whose comparisons and sorting fold case (e.g. 'Cisco' and 'cisco' compare as the same value). Storage preserves the original case for display. A unique constraint on this scalar rejects case-only duplicates; fields without such a constraint can contain both values.
      maxLength: 256
      examples:
      - Cisco
      - cisco
    std.ConcreteType:
      type: string
      pattern: "^[a-z][a-z0-9-]*\\.[a-z][A-Za-z0-9]*$"
      description: "Namespace-qualified name of a concrete, instantiable model type, either an entity or a value type. Uniquely identifies the concrete type of a polymorphic payload using the format 'namespace.typeName'. Use [entityType](#/components/schemas/std.entityType) when the reference is restricted to entities, and [qualifiedName](#/components/schemas/std.qualifiedName) for any data-model type including interfaces, enums, and scalars."
      maxLength: 128
      examples:
      - asset.asset
      - std.schemaVersionedSys
      - iam.account
      - std.geoCoordinates
    std.EntityRef:
      type: string
      format: uri-reference
      pattern: "^/[a-z][a-z0-9-]*/v[0-9]+/[a-z][a-zA-Z0-9]*/([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|by-[a-zA-Z][a-zA-Z0-9]*(/[^\\s/]+)+)$"
      description: API-relative URI reference pointing to a related resource. Addresses the target either by its server-assigned id or by one of the target's declared identity schemes.
      examples:
      - /asset/v1/assets/4ecc4f86-891e-4816-a4e0-d8138be01865
      - /iam/v1/users/a3b2c1d0-e5f6-4a7b-8c9d-0e1f2a3b4c5d
      - /product/v1/products/by-productId/isr4331
      - /asset/v1/assets/by-serial/cisco/isr4331/FDO12345678
    std.EntityType:
      type: string
      pattern: "^[a-z][a-z0-9-]*\\.[A-Z][A-Za-z0-9]+$"
      description: Namespace-qualified name of an entity type. Uniquely identifies an entity definition across namespaces using the format 'namespace.Entity'.
      maxLength: 128
      examples:
      - asset.Asset
      - asset.SecurityAdvisory
      - iam.Account
      - system.ResourceGroup
    std.ErrorCode:
      type: string
      enum:
      - ALREADY_EXISTS
      - BAD_USER_INPUT
      - CONFLICT
      - DATA_FETCH_ERROR
      - FORBIDDEN
      - GONE
      - GRAPHQL_PARSE_FAILED
      - GRAPHQL_VALIDATION_FAILED
      - INTERNAL_SERVER_ERROR
      - INVALID_FORMAT
      - METHOD_NOT_ALLOWED
      - NOT_ACCEPTABLE
      - NOT_FOUND
      - NOT_IMPLEMENTED
      - PAYLOAD_TOO_LARGE
      - PRECONDITION_FAILED
      - RATE_LIMITED
      - REQUIRED_FIELD
      - SERVICE_UNAVAILABLE
      - TIMEOUT
      - UNAUTHENTICATED
      - UNSUPPORTED_MEDIA_TYPE
      - VALIDATION_FAILED
      description: Machine-readable code that classifies an API error.
    std.ErrorDetail:
      type: object
      description: Describes a specific error in an API response. Use the code, message, description, and field to identify and resolve the issue.
      properties:
        code:
          $ref: "#/components/schemas/std.ErrorCode"
          description: Machine-readable code that classifies the error.
          examples:
          - REQUIRED_FIELD
          - INVALID_FORMAT
        description:
          type:
          - string
          - "null"
          description: Detailed explanation with hints for resolution.
          examples:
          - Provide a non-empty value for the name field.
          - "Ensure the email follows the format: user@domain.com"
        field:
          type:
          - string
          - "null"
          description: Path to the field that caused the error, using dot-notation (e.g., "address.postalCode", "items[0].quantity"). Null for errors not associated with a specific field.
          examples:
          - name
          - address.postalCode
          - items[0].quantity
        message:
          type: string
          description: Human-readable error message suitable for display.
          examples:
          - The 'name' field is required.
          - Email address format is invalid.
    std.GroupableRefListResponse:
      type: object
      description: A to-many relationship member, holding a bounded set of references to groupable resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources this member holds, independent of how many items are present in this response. Present only when the request asked for a total.
        items:
          type: array
          description: References to the groupable resources in this member. A bounded preview of the member when next is present.
          items:
            $ref: "#/components/schemas/std.EntityRef"
            x-relationship-targets:
            - asset.PhysicalAsset
            - asset.VirtualAsset
        next:
          type: string
          format: uri-reference
          description: Opaque cursor to pass as `after` to the member endpoint to resume after the last element in items. Absent when items holds the whole member.
      required:
      - items
    std.NamespaceName:
      type: string
      pattern: ^[a-z][a-z0-9-]*$
      description: Lowercase identifier for a data-model namespace. Consists of lowercase letters, digits, and hyphens. Used wherever a field records the namespace that owns a schema element.
      maxLength: 64
      examples:
      - iam
      - asset
      - std
      - system
      - assessment
    std.Ownership:
      type: string
      enum:
      - CUSTOM
      - SYSTEM
      description: Identifies who owns and manages an instance, determining its editability and visibility.
    std.ProblemDetail:
      type: object
      description: Describes an HTTP API error. Use the type, title, status, detail, and errors fields to diagnose the problem and determine next steps.
      properties:
        detail:
          type:
          - string
          - "null"
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
          - Asset with ID 'asset-12345' not found in the system.
          - The field 'name' must not be empty.
        errors:
          type:
          - array
          - "null"
          description: Field-level validation errors. Each entry identifies the specific field and error condition.
          items:
            $ref: "#/components/schemas/std.ErrorDetail"
        instance:
          description: A URI reference identifying the specific occurrence of the problem. May or may not be dereferenceable.
          examples:
          - /api/assets/asset-12345
          - /assets?filter=invalid
          anyOf:
          - $ref: "#/components/schemas/std.Uri"
          - type: "null"
        status:
          type:
          - integer
          - "null"
          format: int32
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          examples:
          - 404
          - 400
        title:
          type:
          - string
          - "null"
          description: A short, human-readable summary of the problem type. Should not change from occurrence to occurrence of the same problem.
          examples:
          - Not Found
          - Validation Failed
        type:
          description: URI that identifies the problem type and may link to documentation that helps resolve it.
          examples:
          - https://iq.cisco.com/api/problems/not-found
          - https://iq.cisco.com/api/problems/validation-failed
          anyOf:
          - $ref: "#/components/schemas/std.Uri"
          - type: "null"
    std.ProvisionedSys:
      type: object
      description: System metadata that records instance ownership.
      properties:
        ownership:
          $ref: "#/components/schemas/std.Ownership"
          description: Who owns this instance. SYSTEM instances require an explicit platform role exception for updates by account principals and cannot be deleted by them. CUSTOM instances are created by an account.
          readOnly: true
    std.QualifiedName:
      type: string
      pattern: "^[a-z][a-z0-9-]*\\.[A-Z][A-Za-z0-9]*$"
      description: Namespace-qualified name of a data-model type. Identifies a scalar, enum, interface, or value type across namespaces using the format 'namespace.TypeName'. Use std.EntityType for qualified entity names. Use std.NamespaceName for bare namespace identifiers.
      maxLength: 128
      examples:
      - std.String
      - iam.accountStatus
      - std.geoCoordinates
      - assessment.findingSeverity
    std.ResourceUrn:
      type: string
      pattern: ^[a-z][a-z0-9-]*:[A-Za-z0-9_./-]+$
      description: "URN-style name for a single modeled resource matcher. A resource URN is a `<kind>:<spec>` string where the kind establishes the resource family and the spec identifies one resource matcher within that family.\nBuilt-in kinds:\n- `entity:<namespace>.<entityName>`: instances of the named\n  entity type.\n- `interface:<namespace>.<interfaceName>`: instances of every\n  entity type implementing the named interface.\nThe kind prefix is open-ended so that future resource families can introduce their own kinds without schema churn."
      maxLength: 256
      examples:
      - entity:asset.physicalAsset
      - interface:iam.accountScoped
      - interface:std.provisioned
    std.StandardSys:
      type: object
      description: "System metadata for change-tracked entities: schema version (inherited from [schemaVersionedSys](#/components/schemas/std.schemaVersionedSys)) plus creation and last-modification timestamps. Mutable entities use [mutableSys](#/components/schemas/std.mutableSys), which extends this type and adds ETag support."
      properties:
        createdAt:
          type: string
          format: date-time
          description: When this entity was created. Set automatically by the server and never updated after that. Always UTC.
          readOnly: true
          examples:
          - "2024-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: When this entity was last modified. Updated automatically on every write operation. Always UTC.
          readOnly: true
          examples:
          - "2024-01-15T10:30:00Z"
    std.Title:
      type: string
      description: Short human-readable heading for a document, advisory, bulletin, or other content item. Suitable for display in lists, dashboards, and notification subjects. It is not a searchable identifier. Use named.name for that purpose.
      maxLength: 512
      examples:
      - End-of-Sale Announcement for the Catalyst 3650 Series
      - Cisco IOS XE Software Web UI Privilege Escalation Vulnerability
      - Clock Signal Component Issue on Various Products
    std.Uri:
      type: string
      format: uri
      pattern: "^[a-zA-Z][a-zA-Z0-9+\\-.]*:[^\\s]*$"
      description: "Uniform Resource Identifier matching the RFC 3986 URI syntax rule: scheme ':' hier-part [ '?' query ] [ '#' fragment ]. Must include a scheme such as https:, mailto:, or urn:, and may also include a query or fragment. A Uri identifies a resource but does not, by itself, imply that the resource is dereferenceable or retrievable. Use [[UriReference]] when a field must also accept relative references such as /ui/dashboard, ../reports/summary, //cdn.example.com/assets/app.js, or #section-2. Use Uri for scheme-based identifiers such as XML namespace URIs, OIDC issuer identifiers, RDF subject URIs, and other absolute references. Use [[Url]] only when the field specifically means a dereferenceable locator. Use [[Urn]] only when the field must use the urn scheme and URN namespace rules. Conforms to RFC 3986, with usage guidance updated by RFC 8820."
      maxLength: 2048
      examples:
      - https://api.example.com/users/42
      - urn:isbn:978-0-306-40615-7
      - mailto:user@example.com
      - urn:uuid:6e8bc430-9c3a-11d9-9669-0800200c9a66
    std.UriReference:
      type: string
      format: uri-reference
      pattern: "^[^\\s]*$"
      description: "URI-reference per RFC 3986 §4.1: either a URI or a relative-ref. Accepts absolute scheme-based identifiers and relative references interpreted against a base URI, including path-only references such as /ui/dashboard, network-path references such as //cdn.example.com/asset.js, relative-path references such as ../reports/summary, and same-document references such as #section-2. Use UriReference when a field accepts links or references, including both scheme-based and relative forms. Use [[Uri]] instead when the field requires a scheme and does not allow relative references. Conforms to RFC 3986 §4.1 and the relative resolution model in RFC 3986 §5."
      maxLength: 2048
      examples:
      - /ui/dashboard
      - /api/v1/users?filter=active
      - //cdn.example.com/assets/app.js
      - https://api.example.com/v1/users/42
      - ../reports/summary
    std.Url:
      type: string
      format: uri
      pattern: "^[a-zA-Z][a-zA-Z0-9+\\-.]*://\\S+$"
      description: "Uniform Resource Locator in the common locator-focused sense from RFC 3986 §1.1.3. RFC 3986 recommends the general term URI for most specifications, but this scalar is for fields that specifically carry a dereferenceable network address. Must use a scheme followed by \"://\" and therefore includes an authority component, such as https://, http://, or ftp://. Use Url for external links, API endpoints, documentation pages, and downloadable resources whose primary purpose is retrieval. Do not use Url for generic scheme-based identifiers such as mailto: or urn:..., and do not use it when relative references are allowed; use [[Uri]] or [[UriReference]] instead. Aligns with RFC 3986 URL subset terminology and RFC 8820 guidance to avoid inventing ad hoc URI structure outside scheme or owner control."
      maxLength: 2048
      examples:
      - https://iq.cisco.com/api/v1/auth/refresh
      - https://api.example.com/users/42
      - ftp://files.example.com/report.pdf
    std.Verb:
      type: string
      enum:
      - ABORT_MULTIPART_UPLOAD
      - ACTIVATE
      - ADD
      - APPROVE
      - ARCHIVE
      - ASSIGN
      - AUTHORIZE
      - BACKUP
      - CANCEL
      - COMPLETE_MULTIPART_UPLOAD
      - COPY_OBJECT
      - CREATE
      - CREATE_BUCKET
      - CREATE_MULTIPART_UPLOAD
      - DEACTIVATE
      - DELETE
      - DELETE_BUCKET
      - DELETE_OBJECT
      - DELETE_OBJECTS
      - DELETE_OBJECT_TAGGING
      - DEPLOY
      - EXCHANGE
      - EXPORT
      - GET_BUCKET_LOCATION
      - GET_OBJECT
      - GET_OBJECT_TAGGING
      - HEAD_BUCKET
      - HEAD_OBJECT
      - IMPORT
      - INVOKE
      - LIST
      - LIST_BUCKETS
      - LIST_MULTIPART_UPLOADS
      - LIST_OBJECTS
      - LIST_OBJECTS_V2
      - LIST_PARTS
      - PUBLISH
      - PURGE
      - PUT_OBJECT
      - PUT_OBJECT_TAGGING
      - QUERY
      - READ
      - REJECT
      - REMOVE
      - RESTORE
      - RESUME
      - REVOKE
      - ROTATE
      - SEARCH
      - SEND
      - SUBMIT
      - SUSPEND
      - UNASSIGN
      - UPDATE
      - UPLOAD_PART
      description: The set of verbs that describe operations on a resource. Each value represents a distinct operation, such as creating, reading, updating, or deleting, that an action can reference. Domain namespaces may register additional verbs below when no standard verb captures the semantics (see engNotes for guidance).
    system.AggregateFunction:
      type: string
      enum:
      - AVG
      - COUNT
      - COUNT_DISTINCT
      - MAX
      - MIN
      - SUM
      description: Aggregate function a grouped query applies to the resources of a bucket to produce one value.
    system.AggregateSpec:
      type: object
      description: One aggregate function a grouped query computes for each bucket that `groupby` produces. The computation sees only the resources that reached the bucket, so a `filter` that excludes resources lowers the value.
      properties:
        filter:
          type:
          - string
          - "null"
          description: "CEL predicate deciding which of a bucket's resources this computation reads, named relative to the query's `from` resource and using the same grammar as the request's own `filter`. It lets one request return several differently scoped values for each bucket, such as a total beside a count per status. It can only narrow: the request's own `filter` decides which resources exist and so which buckets exist, while this one selects within a bucket. A bucket whose resources all fail it reports 0 for `COUNT` or `COUNT_DISTINCT` and null for every other computation. When null, the computation reads every resource of the bucket."
          examples:
          - status == 'OPEN'
          - severity == 'CRITICAL' && resolvedAt == null
        fn:
          $ref: "#/components/schemas/system.AggregateFunction"
          description: Aggregate function producing this value.
        source:
          type:
          - string
          - "null"
          description: Field the computation reads, named relative to the query's `from` resource. Every computation but `COUNT` needs one, and the field's type must suit the computation. `COUNT` reads a field only to skip the resources holding a null for it; when null, `COUNT` counts every resource of the bucket.
          examples:
          - listPrice
          - lastSeenAt
      required:
      - fn
    system.BugProcedureDetails:
      type: object
      description: Details of a procedure that evaluates whether a device is exposed to a known software bug.
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          const: system.bugProcedureDetails
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        bug:
          $ref: "#/components/schemas/std.EntityRef"
          description: Software bug this procedure evaluates exposure to. The bug identifier remains available even when its details are not yet known.
          examples:
          - /product/v1/bugs/75f85f3a-88ed-886e-be07-bb84d8fce6d5
          x-relationship-targets:
          - product.Bug
      required:
      - bug
    system.BulkMethod:
      type: string
      enum:
      - DELETE
      - PATCH
      - POST
      - PUT
      description: The HTTP method of the single-resource write that a bulk operation performs. The method decides whether the write merges the supplied fields or replaces the resource in full; the shape of the target href decides whether a write that matches no existing resource creates one.
    system.BulkOperation:
      type: object
      description: A single write within a bulk request, expressed as the HTTP method and target URL of the equivalent single-resource call. The target, both its type and its identity, comes entirely from the href; no part of it is inferred from the supplied data.
      properties:
        data:
          description: The field values to write, as they would appear in the body of the equivalent single-resource call. Omitted when removing a resource.
        headers:
          description: The request headers qualifying this one operation, as the equivalent single-resource call would carry them. An operation cannot carry its own credentials, so one request never spans callers.
          anyOf:
          - $ref: "#/components/schemas/system.BulkOperationHeaders"
          - type: "null"
        href:
          $ref: "#/components/schemas/std.UriReference"
          description: The URL identifying what to write to. A collection URL creates a resource. An item URL addressed by identifier modifies or removes one that already exists, while an item URL addressed by a natural key the caller owns also creates the resource when the key matches none. The entity type is taken from the path.
          examples:
          - /api/asset/v1/physicalAssets
          - /api/asset/v1/physicalAssets/0199c4d2-5f3a-7b21-9c84-6f1d2e3a4b5c
          - /api/asset/v1/physicalAssets/by-vendorModelSerial/cisco/isr4331/FDO10000001
        method:
          $ref: "#/components/schemas/system.BulkMethod"
          description: The HTTP method of the write to perform against the target.
    system.BulkOperationHeaders:
      type: object
      description: The request headers qualifying one operation, each the header the equivalent single-resource call would carry. A header outside this set is refused rather than ignored.
      properties:
        if-match:
          type:
          - string
          - "null"
          description: Writes only while the resource is unchanged since the caller last read it, carrying the etag they were given. "*" requires only that the resource exists, which demands update-only semantics on an address that would otherwise create.
          examples:
          - "\"7d3f\""
          - "*"
        if-unmodified-since:
          type:
          - string
          - "null"
          description: Writes only while the resource has not changed since the given date, carrying the last-modified date the caller was given. Use when the resource carries no etag. Evaluated only when the operation carries no ifMatch, matching the single-resource behavior (RFC 9110 §13.2.2).
          examples:
          - Wed, 04 Mar 2026 05:06:07 GMT
    system.BulkOperationResult:
      type: object
      description: The outcome of one operation within a bulk request, reported with the status the equivalent single-resource call would have returned. A result is identified by its position, which is the position of the operation that produced it.
      properties:
        body:
          description: What the equivalent single-resource call would have returned on success, for a write, the resource as written. Absent when the operation failed or removed the resource.
        error:
          description: Why the operation failed. Absent when it succeeded.
          anyOf:
          - $ref: "#/components/schemas/std.ProblemDetail"
          - type: "null"
        headers:
          description: The response headers the equivalent single-resource call would have returned for this operation. Absent when the operation failed or removed the resource, neither of which returns a header describing a resource.
          anyOf:
          - $ref: "#/components/schemas/system.BulkResultHeaders"
          - type: "null"
        href:
          $ref: "#/components/schemas/std.UriReference"
          description: The target of the originating operation, echoed from the request.
          examples:
          - /api/asset/v1/physicalAssets
          - /api/asset/v1/physicalAssets/by-vendorModelSerial/cisco/isr4331/FDO10000001
        method:
          $ref: "#/components/schemas/system.BulkMethod"
          description: The method of the originating operation, echoed from the request.
        status:
          type: integer
          format: int32
          description: The HTTP status the equivalent single-resource call would have returned, so a failure reports whether the resource was absent, conflicting, or modified since the caller last read it.
          examples:
          - 200
          - 201
          - 409
          - 412
    system.BulkRequest:
      type: object
      description: A set of writes submitted as one request, committing either as a single unit or independently of one another. Operations may target different entity types in different namespaces, and each is authorized individually against the caller's permissions in the namespace it targets.
      properties:
        atomic:
          type:
          - boolean
          - "null"
          description: Whether the request commits as one unit. When true, a single failure rolls back every write in the request and nothing persists. When false, each operation succeeds or fails on its own and reports its own outcome. Defaults to true when omitted, so a caller gets a partial write only by asking for one.
        operations:
          type: array
          description: The writes to perform. A resource may be named at most once per request; two operations targeting the same resource are rejected before any of them runs.
          items:
            $ref: "#/components/schemas/system.BulkOperation"
    system.BulkResponse:
      type: object
      description: The outcome of a bulk request, reporting every operation in the order it was submitted.
      properties:
        results:
          type: array
          description: One result per submitted operation, in the order submitted.
          items:
            $ref: "#/components/schemas/system.BulkOperationResult"
        summary:
          $ref: "#/components/schemas/system.BulkResultSummary"
          description: Counts of how the request's operations resolved.
    system.BulkResultHeaders:
      type: object
      description: The response headers describing the resource one operation affected, carrying the values the equivalent single-resource call would have returned in its own headers. Headers describing a response as a whole (rate-limit state, trace context, caching directives) belong to the bulk response and are not repeated per operation.
      properties:
        etag:
          type:
          - string
          - "null"
          description: The entity tag of the resource as written, the value the equivalent single-resource call would have returned in its ETag header. Send it back as If-Match on a later operation to write only while the resource is still unchanged.
          examples:
          - "\"7d3f\""
        location:
          description: The canonical URL of a resource this operation created, so a caller that let the server assign an identifier learns it here. Absent when the operation modified a resource that already existed, whose identifier the returned body carries.
          examples:
          - /api/asset/v1/physicalAssets/0199c4d2-5f3a-7b21-9c84-6f1d2e3a4b5c
          anyOf:
          - $ref: "#/components/schemas/std.UriReference"
          - type: "null"
    system.BulkResultSummary:
      type: object
      description: Counts of how the request's operations resolved, so a caller can detect a partial failure without scanning every result.
      properties:
        failed:
          type: integer
          format: int32
          description: The number of operations that failed. Always zero when the request commits as one unit, because such a request either applies in full or not at all.
        succeeded:
          type: integer
          format: int32
          description: The number of operations that completed successfully.
        total:
          type: integer
          format: int32
          description: The number of operations the request carried.
    system.CapabilityActionResult:
      type: object
      description: Policy preflight for one exact action for the current caller.
      properties:
        action:
          type: string
          description: Exact action name that was checked.
        decision:
          $ref: "#/components/schemas/system.CapabilityDecisionStatus"
          description: Whether policy permits the action in this request context. A conditional decision requires a later resource-level check.
      required:
      - action
      - decision
    system.CapabilityCheck:
      type: object
      description: An entity and the operations whose availability the caller wants to inspect. When operations is omitted, the request checks every public operation declared for the entity.
      properties:
        entity:
          type: string
          description: Namespace-qualified entity name, such as asset.physicalAsset.
        memberPaths:
          type: array
          description: Exact field or relationship paths whose read and query access is requested. This selection takes precedence over includeAllMemberAccess and does not require that flag. Paths can cross value types and related entities. Unknown or internal paths return DENY. Omit this field to discover public members only when includeAllMemberAccess is true. An empty array is invalid. The server bounds path length, depth, and selection size. Duplicate paths appear once in path order.
          minItems: 1
          items:
            type: string
        operations:
          type: array
          description: Names of operations declared for the entity. Omit this field to inspect all public operations. An empty array is invalid.
          minItems: 1
          items:
            type: string
      required:
      - entity
    system.CapabilityDecision:
      type: object
      description: The availability of one operation on one entity for the current caller.
      properties:
        decision:
          $ref: "#/components/schemas/system.CapabilityDecisionStatus"
          description: Whether the caller may use the operation. A conditional decision requires authorization against a specific resource before use.
        members:
          type: array
          description: Field and relationship decisions in path order. Present for public entity read and list operations when memberPaths is provided or includeAllMemberAccess is true. A denied operation returns DENY for every selected member. These decisions describe member access within separately authorized resources and do not grant access to any resource.
          items:
            $ref: "#/components/schemas/system.CapabilityMemberDecision"
        operation:
          type: string
          description: Name of the operation that was checked.
      required:
      - decision
      - operation
    system.CapabilityDecisionStatus:
      type: string
      enum:
      - ALLOW
      - CONDITIONAL
      - DENY
      description: Result of a capability check before an operation runs.
    system.CapabilityMemberDecision:
      type: object
      description: Read and query access to an exact field or relationship path for the current caller and operation. These decisions guide query construction; each data request enforces access again.
      properties:
        path:
          type: string
          description: Exact field or relationship path relative to the checked entity. Permission for this path does not grant permission for descendants. Automatically returned protocol metadata, such as the _type discriminator, does not imply permission to select or query it.
        query:
          $ref: "#/components/schemas/system.CapabilityDecisionStatus"
          description: ALLOW permits this member in query expressions, subject to the operators supported by the model and query API. DENY excludes it from general query expressions. A member that a resource-dependent policy can hide returns DENY. Supported filters and scalar grouping can still use that member with server-enforced readable subsets; other query expressions retain the denial. This decision never returns CONDITIONAL and does not grant access to resources.
        read:
          $ref: "#/components/schemas/system.CapabilityDecisionStatus"
          description: ALLOW permits the member on authorized resources. DENY excludes the member. CONDITIONAL permits selection, but a resource-dependent policy can omit the member from individual responses. An omitted member is unavailable, not an empty value.
      required:
      - path
      - query
      - read
    system.CapabilityRequest:
      type: object
      description: Inspect capabilities for the current caller. Checks provide a convenient way to select entity operations. Actions select exact catalog names directly, including entity and namespace operations and tool or service actions. Specify checks, actions, or both. Set allCapabilities to true to inspect every public entity operation and every public catalog action. It can be combined with actions but not with checks.
      properties:
        actions:
          type: array
          description: Exact action catalog names to inspect, including entity actions, namespace operations, and tool or service actions, such as read:iam.user, invoke:system.query, or invoke:mcp.Tool.web-search. A name that is unknown or unavailable to external callers returns DENY. An empty array is invalid. Selected action results preserve request order when allCapabilities is omitted.
          minItems: 1
          items:
            type: string
        allCapabilities:
          type: boolean
          description: Set to true to inspect every public operation on every public, concrete entity and every public catalog action. Omit checks when this field is true. Entity results are ordered by entity and operation name; action results are ordered by action name. An explicit action name not in the public catalog is appended and returns DENY.
        checks:
          type: array
          description: Convenient selection for entity operations, the common case. Use actions to check any exact catalog action directly, including entity and namespace operations. Provide checks, actions, or allCapabilities. The server bounds the total number of selected checks, including operations added when a check omits its operations field.
          items:
            $ref: "#/components/schemas/system.CapabilityCheck"
        includeAllMemberAccess:
          type: boolean
          description: Set to true to discover public entity members and nested value-type members for checks that omit memberPaths. Discovery stops at relationship edges. Explicit memberPaths request only those paths, whether this flag is omitted, false, or true. Omit this flag or set it to false to omit member decisions for checks without memberPaths. Member decisions apply only to public entity read and list operations and share the operation's policy snapshot and request context. Named action results do not include members.
    system.CapabilityResponse:
      type: object
      description: Capability decisions from one policy snapshot. These decisions guide user interfaces but do not authorize a later operation.
      properties:
        actionResults:
          type: array
          description: Decisions for exact action names in request order, or for all public catalog actions in name order when allCapabilities is true. Explicit names not already in the public catalog follow in request order. Omitted when no actions were selected.
          items:
            $ref: "#/components/schemas/system.CapabilityActionResult"
        policyRevision:
          type: string
          description: Opaque identifier of the policy snapshot used for every decision in this response. A changed identifier means cached decisions must be refreshed.
        results:
          type: array
          description: Results in request order for selected checks, or in entity and operation name order for all entities.
          items:
            $ref: "#/components/schemas/system.CapabilityResult"
      required:
      - policyRevision
      - results
    system.CapabilityResult:
      type: object
      description: Operation decisions for one entity.
      properties:
        decisions:
          type: array
          description: Decisions in request order for selected checks, or in operation name order when allCapabilities is true.
          items:
            $ref: "#/components/schemas/system.CapabilityDecision"
        entity:
          type: string
          description: Namespace-qualified entity name that was checked.
      required:
      - decisions
      - entity
    system.CertificateProcedureDetails:
      type: object
      description: Details of a procedure that evaluates certificates held by a device, covering expiry, cryptographic strength, and identity or usage policy.
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          const: system.certificateProcedureDetails
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
    system.ComputeAggregate:
      type: object
      description: "The aggregate form of a compute entry: reduce a collection to one value, either one the resource declares or one reached through an opened inverse direction. On a structured read the value reads like a selected field; on a grouped aggregation a `groupby` dimension can name the entry to bucket resources by the value."
      properties:
        filter:
          type:
          - string
          - "null"
          description: CEL expression deciding which instances enter the computation. For a declared collection, it is evaluated against each collection element. For an inverse reduction, it is evaluated against instances of the referencing entity. When null, every instance is included. Supported only for a relationship or value-type collection source; a filter on a scalar-array source is rejected. An inverse reduction reads a relationship, so it supports a filter.
          examples:
          - status in ['OPEN', 'IN_PROGRESS']
        fn:
          $ref: "#/components/schemas/system.AggregateFunction"
          description: Aggregate function that reduces instances to one value. `COUNT` reduces rows; `MIN`, `MAX`, `SUM`, and `AVG` reduce the scalar values named by `source`. For a declared collection, use `collection.field` to reduce an element field, or a bare scalar array name to reduce its elements. For an inverse reduction, `source` names a field on the referencing entity.
        inverse:
          description: The resources that reference this one, reduced as though this entity type declared the relationship back. An asset counts the findings that apply to it even though `asset.item` names no findings of its own. The relationship must open its inverse direction in the model; one that does not, or one this entity type is not the target of, is reported as a member that is not available. Reading it needs the related-read action on the referencing entity, `read:<namespace>.<entityName>`, which is the action a declared collection's target needs, and that entity's own policy row filter is applied inside the reduction. When set, `source` names a field of the referencing entity, and `COUNT` needs none. When null, the entry reduces a collection this resource declares, named by `source`.
          anyOf:
          - $ref: "#/components/schemas/system.ComputeInverse"
          - type: "null"
        source:
          type:
          - string
          - "null"
          description: "What the value is reduced from. Without `inverse` it names a member of the query's `from` entity type: `COUNT` names a bare collection, which is a one-to-many or many-to-many relationship, a value-type collection, or a scalar array, while `MIN`, `MAX`, `SUM`, and `AVG` name `collection.field`, the scalar element field to reduce over a one-to-many relationship or a value-type collection, or name a bare scalar array whose own elements they reduce. With `inverse` it names a scalar field of the referencing entity instead, because `inverse` already carries which collection is reduced, and `COUNT` then needs no `source` at all. Required in every other case."
          examples:
          - recommendations
          - complianceMappings
          - labels
          - coverages.endDate
          - severity
      required:
      - fn
    system.ComputeInverse:
      type: object
      description: "The inverse direction of a relationship the query's `from` entity type does not declare: the entity that declares the relationship, and the relationship on it that references this one. Both are needed, because one entity can reference this type through more than one relationship."
      properties:
        from:
          $ref: "#/components/schemas/std.ResourceUrn"
          description: Entity type that declares the relationship, as an `entity:<namespace>.<entityName>` URN. Its records are what the entry reduces, and `source` and `filter` name members of this type.
          examples:
          - entity:assessment.finding
        via:
          type: string
          description: Relationship on the `from` entity type that references the query's own `from` entity type. The reduction reads the records whose relationship of this name points at each matching resource.
          examples:
          - asset
      required:
      - from
      - via
    system.ComputeSpec:
      type: object
      description: One scalar a structured read computes for each matching resource. The entry names which form computes the value; `aggregate` reduces a collection the resource declares or one reached through an opened inverse direction, and `expression` computes a formula from the resource's own fields. The value is reported under the name this entry takes in the request, which must begin with an underscore, and reads like a selected field in the result row.
      properties:
        aggregate:
          description: The aggregate form reduces a collection to one value. Exactly one form must be present on each entry.
          anyOf:
          - $ref: "#/components/schemas/system.ComputeAggregate"
          - type: "null"
        expression:
          type:
          - string
          - "null"
          description: "The expression form, a formula over the resource's own fields, computed for each resource without reading any collection. Written in the same CEL the filter uses, narrowed to arithmetic over the resource's own scalar fields: `+`, `-`, `*`, `/`, parentheses, and numeric literals. Walking a relationship is refused. Exactly one form must be present on each entry."
          examples:
          - "listPrice - discount"
          - "100 - progressPercent"
    system.ConfigProcedureDetails:
      type: object
      description: Details of a procedure that evaluates device configuration against a recommended practice.
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          const: system.configProcedureDetails
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
    system.ContactRequest:
      type: object
      description: A request from a user to be contacted by Cisco about IQ. A request records the page and the session from which the user sent it.
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - system.contactRequest
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        account:
          $ref: "#/components/schemas/std.EntityRef"
          description: The account this entity belongs to. Determines the authorization scope and data partitioning boundary. Every instance of this entity is scoped to exactly one account.
          readOnly: true
          examples:
          - /iam/v1/accounts/5124b04c-4ea0-8811-9055-ba2969895e8e
          x-relationship-targets:
          - iam.Account
        createdBy:
          $ref: "#/components/schemas/std.EntityRef"
          description: The user or service account that created this entity. Null when the create named no principal row, such as an ingestion write or a seed, or after the principal is deleted.
          readOnly: true
          examples:
          - /iam/v1/serviceAccounts/00964b6c-d1c7-815c-b094-ddd0ac876c2c
          - /iam/v1/users/2bde4094-0439-8b9f-8653-da15ed0bba5f
          x-relationship-targets:
          - iam.ServiceAccount
          - iam.User
        pagePath:
          description: URI-reference of the page from which the request was sent.
          anyOf:
          - $ref: "#/components/schemas/std.UriReference"
          - type: "null"
        sessionUrl:
          description: URL to a session recording or reference associated with this request, for additional context.
          anyOf:
          - $ref: "#/components/schemas/std.Url"
          - type: "null"
        sys:
          description: System metadata for schema versioning, change-tracking timestamps, and optimistic-locking token.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.StandardSys"
          - type: "null"
        tags:
          type: object
