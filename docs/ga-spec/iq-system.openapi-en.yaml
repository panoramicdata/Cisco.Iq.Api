    system.ExpandRelationship:
      type: object
      description: One relationship this query expands. The map key is the alias. On a structured read it is the JSON member that holds the nested data from related resources. On a grouped request it is the join alias a dotted source names.
      properties:
        after:
          type:
          - string
          - "null"
          description: Opaque cursor from a previous response's `next`. Resumes the nested results after the last one the caller already has. It is positional over the order the page was read in, so use it only with the same expand and the same `orderby` terms that produced it. To-many relationships only. A grouped request does not read this member.
        count:
          type:
          - boolean
          - "null"
          description: "When true, the response includes a total beside the nested related resources: how many the relationship holds, independent of how many this expand returns. Rejected together with `after`, because the total is only valid for the first page. Default: false. To-many relationships only. A grouped request does not read this member."
        expand:
          type:
          - object
          - "null"
          description: Further related resources to include on each result of this hop, keyed by alias. Each alias names a relationship of this hop's related type, not of `from`. When null, this hop is a leaf. A grouped request does not read this member.
          additionalProperties:
            $ref: "#/components/schemas/system.ExpandRelationship"
        filter:
          type:
          - string
          - "null"
          description: CEL predicate on the related entity. On a grouped request it is applied at join time. On a structured to-many expand it chooses which related rows appear in the nested array.
          examples:
          - physicalType == 'CHASSIS'
          - status == 'ACTIVE'
        max:
          type:
          - integer
          - "null"
          format: int32
          description: Maximum number of related results to nest for this relationship, from 1 to 100. Only this relationship is affected; every other expanded relationship keeps the default, so one request can read a wide relationship and a narrow one at different sizes. To-many relationships only. When null, the default applies.
          minimum: 1
          maximum: 100
          examples:
          - 3
          - 10
        orderby:
          type:
          - string
          - "null"
          description: "Order of the nested results: up to 8 comma-separated `field direction` terms, each `asc` or `desc` and each naming a different field of the related resource. Orders nested results only. The request-level `orderby` orders the returned result rows. When a relationship returns more than one type of resource, name a field they all share. To-many relationships only. When null, nested results keep a stable, repeatable order."
          examples:
          - status asc
          - endDate desc, id asc
        relationship:
          type:
          - string
          - "null"
          description: Relationship on the enclosing type. On a root expand entry that is the `from` entity type. On a nested expand entry that is the related type of the enclosing expand. When null, the map key is the relationship name.
          examples:
          - product
          - coverages
        select:
          type:
          - array
          - "null"
          description: Fields of the related entity to return on each nested instance. When null or empty, the related type's default projection is used. Root `select` still names fields of `from` only. A grouped request does not read this member.
          examples:
          - - id
            - family
          - - id
            - type
            - status
          items:
            type: string
