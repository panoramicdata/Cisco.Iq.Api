            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
            Server-Timing:
              $ref: "#/components/headers/Server-Timing"
            Vary:
              $ref: "#/components/headers/Vary"
            traceparent:
              $ref: "#/components/headers/traceparent"
          content:
