          description: Client-defined version of the shape stored in `preferences`. Discarded and re-defaulted on mismatch; the server does not migrate it.
        viewKey:
          type: string
          description: Client-defined identifier for the specific instance within the feature. For a list view, typically forge model plus view. For a dashboard, the dashboard id. For MISC or DIALOG, a stable constant or per-dialog key.
          maxLength: 256
