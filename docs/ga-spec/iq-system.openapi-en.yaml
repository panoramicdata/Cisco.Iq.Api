  /v1/capabilities:
    summary: Check caller capabilities
    description: "Check which entity operations and named actions the current caller may\nuse. Select entity types, request all public entity operations, or name\nexact actions such as namespace operations and tool access. A\nconditional decision requires a separate resource-level check.\n\nExample request for entity operations and a namespace operation:\n```json\n{\n  \"checks\": [{\"entity\": \"iam.user\", \"operations\": [\"list\", \"read\"]}],\n  \"actions\": [\"invoke:system.query\"]\n}\n```\n\nExample response (decisions depend on the caller and policy):\n```json\n{\n  \"policyRevision\": \"opaque-revision\",\n  \"results\": [{\n    \"entity\": \"iam.user\",\n    \"decisions\": [\n      {\"operation\": \"list\", \"decision\": \"ALLOW\"},\n      {\"operation\": \"read\", \"decision\": \"CONDITIONAL\"}\n    ]\n  }],\n  \"actionResults\": [\n    {\"action\": \"invoke:system.query\", \"decision\": \"DENY\"}\n  ]\n}\n```\n\nSelect exact field or relationship paths in each check's memberPaths\nto request read and query access under its public entity read or list\ndecisions. No discovery flag is required:\n```json\n{\n  \"checks\": [{\n    \"entity\": \"iam.userGroup\",\n    \"operations\": [\"list\"],\n    \"memberPaths\": [\"name\", \"description\", \"roleAssignments\", \"sys.updatedAt\"]\n  }]\n}\n```\n\nMember decisions use the same policy snapshot and operation context.\nRead access can be ALLOW, DENY, or CONDITIONAL. A conditional member\ncan be selected but can be omitted from individual resource responses.\nQuery access is ALLOW or DENY and reports access for general query\nexpressions. A resource-dependent exclusion returns DENY. Supported\nfilters and scalar grouping can still use the member with\nserver-enforced readable subsets. Other query expressions retain the\ndenial.\nMember access does not grant access to resources or promise that a\nparticular query operator is supported.\n\nSet includeAllMemberAccess to true to discover public entity members\nand nested value-type members for checks that omit memberPaths.\nExplicit memberPaths take precedence, whether the discovery flag is\nomitted, false, or true. Omit both options to receive operation\ndecisions only. An empty memberPaths array is invalid.\nDiscovery stops at relationship edges. Request\npaths through relationship targets explicitly. A parent path's\npermission does not grant access to its descendants. Named action\nresults do not contain members."
    post:
      operationId: capabilities
      summary: Check caller capabilities
      description: "Check which entity operations and named actions the current caller may\nuse. Select entity types, request all public entity operations, or name\nexact actions such as namespace operations and tool access. A\nconditional decision requires a separate resource-level check.\n\nExample request for entity operations and a namespace operation:\n```json\n{\n  \"checks\": [{\"entity\": \"iam.user\", \"operations\": [\"list\", \"read\"]}],\n  \"actions\": [\"invoke:system.query\"]\n}\n```\n\nExample response (decisions depend on the caller and policy):\n```json\n{\n  \"policyRevision\": \"opaque-revision\",\n  \"results\": [{\n    \"entity\": \"iam.user\",\n    \"decisions\": [\n      {\"operation\": \"list\", \"decision\": \"ALLOW\"},\n      {\"operation\": \"read\", \"decision\": \"CONDITIONAL\"}\n    ]\n  }],\n  \"actionResults\": [\n    {\"action\": \"invoke:system.query\", \"decision\": \"DENY\"}\n  ]\n}\n```\n\nSelect exact field or relationship paths in each check's memberPaths\nto request read and query access under its public entity read or list\ndecisions. No discovery flag is required:\n```json\n{\n  \"checks\": [{\n    \"entity\": \"iam.userGroup\",\n    \"operations\": [\"list\"],\n    \"memberPaths\": [\"name\", \"description\", \"roleAssignments\", \"sys.updatedAt\"]\n  }]\n}\n```\n\nMember decisions use the same policy snapshot and operation context.\nRead access can be ALLOW, DENY, or CONDITIONAL. A conditional member\ncan be selected but can be omitted from individual resource responses.\nQuery access is ALLOW or DENY and reports access for general query\nexpressions. A resource-dependent exclusion returns DENY. Supported\nfilters and scalar grouping can still use the member with\nserver-enforced readable subsets. Other query expressions retain the\ndenial.\nMember access does not grant access to resources or promise that a\nparticular query operator is supported.\n\nSet includeAllMemberAccess to true to discover public entity members\nand nested value-type members for checks that omit memberPaths.\nExplicit memberPaths take precedence, whether the discovery flag is\nomitted, false, or true. Omit both options to receive operation\ndecisions only. An empty memberPaths array is invalid.\nDiscovery stops at relationship edges. Request\npaths through relationship targets explicitly. A parent path's\npermission does not grant access to its descendants. Named action\nresults do not contain members."
      tags:
      - Authorization
      parameters:
      - $ref: "#/components/parameters/traceparent"
      requestBody:
        description: Payload containing input fields for the capabilities operation.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/system.CapabilityRequest"
      responses:
        "200":
          description: capabilities completed successfully.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
            Content-Encoding:
              $ref: "#/components/headers/Content-Encoding"
            Date:
