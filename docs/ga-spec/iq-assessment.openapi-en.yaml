          items:
            type: string
        requiredSkills:
          type:
          - array
          - "null"
          description: Skills or knowledge required for implementation.
          uniqueItems: true
          items:
            type: string
        requiredTools:
          type:
          - array
          - "null"
          description: Tools or access required for implementation.
          uniqueItems: true
          items:
            type: string
        rollbackProcedure:
          type:
          - string
          - "null"
          description: Procedure to rollback changes if implementation fails.
        steps:
          type:
          - array
          - "null"
          description: Ordered list of implementation steps.
          items:
            $ref: "#/components/schemas/assessment.ImplementationStep"
        summary:
          type:
          - string
          - "null"
          description: Overview of the implementation approach.
          maxLength: 1024
        verificationSteps:
          type:
          - array
          - "null"
          description: Steps to verify successful implementation.
          items:
            type: string
    assessment.ImplementationStep:
      type: object
      description: A single step in the implementation guidance for a recommendation. Steps are ordered and may have dependencies on other steps.
      properties:
        description:
          type: string
          description: Detailed instructions for completing this step.
          maxLength: 16384
        estimatedMinutes:
          type:
          - integer
          - "null"
          format: int32
          description: Estimated time to complete this step in minutes.
        isOptional:
          type:
          - boolean
          - "null"
          description: Whether this step can be skipped without invalidating the implementation. Steps are required by default.
        number:
          type: integer
          format: int32
          description: Sequence number for this step (1-based).
        prerequisiteSteps:
          type:
          - array
          - "null"
          description: The `number` values of any steps that must finish before this step can begin. Use to express ordering constraints between non-sequential steps.
          items:
            type: integer
            format: int32
        title:
          type: string
          description: Brief title describing this step.
    assessment.Insight:
      type: object
      description: "A higher-level analytical conclusion derived from patterns, trends, summarization, or aggregated analysis of multiple [finding](#/components/schemas/assessment.finding) instances. Insights represent 'what this means' rather than 'what was observed', providing business context and strategic understanding. Insights capture the full spectrum of analytical conclusions, problems, positive outcomes, opportunities, trends, and neutral observations, to inform decision-making. The key distinction from findings is that insights answer 'what this means' or 'why it matters' beyond raw observations."
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - assessment.insight
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        account:
          $ref: "#/components/schemas/std.EntityRef"
          description: The account this entity belongs to. Determines the authorization scope and data partitioning boundary. Every instance of this entity is scoped to exactly one account.
          readOnly: true
          examples:
          - /iam/v1/accounts/5124b04c-4ea0-8811-9055-ba2969895e8e
          x-relationship-targets:
          - iam.Account
        category:
          $ref: "#/components/schemas/assessment.InsightCategory"
          description: Nature of the insight, whether it identifies a problem, positive state, opportunity, trend, prediction, or neutral observation.
          readOnly: true
        description:
          type: string
          description: Human-readable detailed explanation of what this insight represents and why it matters beyond the raw observations.
          readOnly: true
          maxLength: 8192
        evaluationKey:
          type: string
          description: Stable identifier of the specific analytical conclusion this insight represents. Scoped to the owning account it forms the insight's natural key, so re-deriving the same conclusion updates the same insight instead of creating a duplicate. The producer computes this value and sends it as the upsert address segment.
          readOnly: true
          minLength: 1
          maxLength: 1024
        identifiedAt:
          type: string
          format: date-time
          description: When this insight was generated or identified.
          readOnly: true
        name:
          $ref: "#/components/schemas/std.CaseInsensitiveText"
          description: Brief, descriptive name of the insight.
          readOnly: true
          minLength: 1
        recommendations:
          $ref: "#/components/schemas/assessment.InsightRecommendationNavigation"
          description: "[insightRecommendation](#/components/schemas/assessment.insightRecommendation) entities that address this insight. An insight may be addressed by many recommendations; each recommendation belongs to exactly one insight."
          readOnly: true
          examples:
          - href: /api/assessment/v1/insights/f8e807dd-2f5d-8e10-af43-2ee81b226353/recommendations
          x-relationship-targets:
          - assessment.InsightRecommendation
        supportingFindings:
          $ref: "#/components/schemas/assessment.FindingRefListResponse"
          description: "The [finding](#/components/schemas/assessment.finding) instances whose patterns this insight interprets. An insight may rest on many findings, and the same finding may support many insights. Empty when the insight was produced by direct analytics or cross-domain analysis rather than derived from findings."
          readOnly: true
          examples:
          - items:
            - /assessment/v1/findings/ba0b82b6-3d67-8255-8bbf-d61d925e5e24
          x-relationship-targets:
          - assessment.Finding
        sys:
          description: System metadata for soft-deletion and purge lifecycle state.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.StandardSys"
          - type: "null"
        tags:
          type: object
          description: Tags assigned to this insight by the assessment engine that generates it. Each tag key starts with cisco.assessment. and names an assessment that includes the insight, such as cisco.assessment.configuration. Cisco platform callers own the cisco. entries and customers own the other entries. A write keeps the stored entries of the other side.
          readOnly: true
          maxProperties: 60
          additionalProperties:
            type: string
        type:
          $ref: "#/components/schemas/assessment.InsightType"
          description: Domain classification indicating whether this insight relates to technical patterns, process observations, human factors, or business implications.
          readOnly: true
    assessment.InsightCategory:
      type: string
      enum:
      - NEUTRAL
      - OPPORTUNITY
      - POSITIVE
      - PREDICTION
      - PROBLEM
      - TREND
      description: Nature of the insight. Indicates whether the insight identifies a problem, positive state, opportunity, or neutral observation.
    assessment.InsightInlineMember:
      type: string
