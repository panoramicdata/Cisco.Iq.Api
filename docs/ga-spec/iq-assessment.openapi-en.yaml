    assessment.QuantumCategoryStatus:
      type: string
      enum:
      - NOT_READY
      - READY
      description: Readiness of an assessed asset for a quantum readiness pillar. Indicates whether the asset meets the pillar's quantum-safe requirements.
    assessment.QuantumDetails:
      type: object
      description: "Quantum readiness details for a finding, describing how the assessed asset stands against quantum-era threats across three pillars: Quantum Safe Communications (the extent to which data-in-transit is protected by quantum-resistant cryptographic standards), Quantum Safe Products (whether the hardware and software foundations meet Cisco recommendations), and Crypto Agility (the capacity to adapt to evolving cryptographic standards). Present on quantum findings and absent on findings of other categories."
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          const: assessment.quantumDetails
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        category:
          description: The quantum readiness pillar this finding relates to, Crypto Agility, Quantum Safe Communications, or Quantum Safe Products.
          anyOf:
          - $ref: "#/components/schemas/assessment.FindingCategory"
          - type: "null"
        quantumCategoryStatus:
          description: Readiness of the assessed asset for this finding's category. For Crypto Agility, whether the asset can adopt and adapt to evolving cryptographic standards. For Quantum Safe Products, whether the asset's hardware and software foundations meet Cisco recommendations, guarding against forged or tampered integrity (Trust Now, Forge Later). For Quantum Safe Communications, the extent to which the asset's data-in-transit is protected by quantum-resistant cryptographic standards, guarding against the Harvest Now, Decrypt Later risk.
          anyOf:
          - $ref: "#/components/schemas/assessment.QuantumCategoryStatus"
          - type: "null"
        quantumSafeStatus:
          description: Overall quantum-safe readiness of the assessed asset, summarizing the action needed to reach a quantum-safe state.
          anyOf:
          - $ref: "#/components/schemas/assessment.QuantumSafeStatus"
          - type: "null"
    assessment.QuantumSafeStatus:
      type: string
      enum:
      - HARDWARE_REFRESH_REQUIRED
      - MISSING_DEVICE_INFORMATION
      - QUANTUM_READY
      - SOFTWARE_UPGRADE_REQUIRED
      - TO_BE_DETERMINED
      description: Overall quantum-safe readiness of an assessed asset, summarizing the action needed to move it toward a quantum-safe state.
    assessment.RecommendationType:
      type: string
      enum:
      - COMPLIANCE
      - LEARNING
      - OPTIMIZATION
      - PROCESS_IMPROVEMENT
      - REMEDIATION
      - STRATEGIC
      description: Category of recommended action. Indicates the nature of work required to implement the recommendation.
    assessment.SecurityAdvisoryDetails:
      type: object
      description: "Marks a finding as a security advisory finding. Present on security advisory findings and absent on findings of other categories. The advisory  identifier and the vulnerabilities it covers are reachable through the finding's linked [procedureDef](#/components/schemas/system.procedureDef)."
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          const: assessment.securityAdvisoryDetails
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
    assessment.SecurityHardeningDetails:
      type: object
      description: Security hardening details for a finding, identifying the security hardening domain it relates to. Present on security hardening findings and absent on findings of other categories.
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          const: assessment.securityHardeningDetails
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        category:
          description: The network configuration domain this finding relates to, such as Access Control, Logging, Routing, Security, or VPN.
          anyOf:
          - $ref: "#/components/schemas/assessment.FindingCategory"
          - type: "null"
    assessment.SoftwareConformanceDetails:
      type: object
      description: Software conformance and upgrade guidance for a finding, including the Cisco suggested releases and the first fixed version that addresses the security advisories. Present on software conformance findings and absent on findings of other categories.
      properties:
