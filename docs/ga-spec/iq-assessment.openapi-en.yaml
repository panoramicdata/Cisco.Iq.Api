              $ref: "#/components/headers/Vary"
            traceparent:
              $ref: "#/components/headers/traceparent"
        "500":
          $ref: "#/components/responses/InternalServerError"
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
            Content-Encoding:
              $ref: "#/components/headers/Content-Encoding"
            Date:
              $ref: "#/components/headers/Date"
            Server-Timing:
              $ref: "#/components/headers/Server-Timing"
            Vary:
              $ref: "#/components/headers/Vary"
            traceparent:
              $ref: "#/components/headers/traceparent"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
            Content-Encoding:
              $ref: "#/components/headers/Content-Encoding"
            Date:
              $ref: "#/components/headers/Date"
            Server-Timing:
              $ref: "#/components/headers/Server-Timing"
            Vary:
              $ref: "#/components/headers/Vary"
            traceparent:
              $ref: "#/components/headers/traceparent"
        default:
          $ref: "#/components/responses/DefaultError"
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
            Content-Encoding:
              $ref: "#/components/headers/Content-Encoding"
            Date:
              $ref: "#/components/headers/Date"
            Server-Timing:
              $ref: "#/components/headers/Server-Timing"
            Vary:
              $ref: "#/components/headers/Vary"
            traceparent:
              $ref: "#/components/headers/traceparent"
components:
  schemas:
    assessment.Assessment:
      type: object
      description: "A catalog definition of one assessment type the assessment engine can run, such as Configuration, Security Hardening, Certificates, Quantum Readiness, Software Release Conformance, Field Notice, or Security Advisories. Each definition carries the overview shown to customers and the applicability preconditions an account must meet for the assessment to apply: the support tiers it covers, the software types it supports, and the telemetry sources it needs. Definitions are seeded catalog data. Accounts read and list them to render the assessment overview but cannot change them."
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - assessment.assessment
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        description:
          type: string
          description: Overview copy shown in the assessment's 'About Assessment' section. Explains what the assessment evaluates, how findings are produced, and the outcomes it helps drive.
          readOnly: true
          maxLength: 8192
        isActive:
          type: boolean
          description: Whether this assessment is currently available to run. When active, the assessment can be executed to evaluate assets and their components and to generate findings, recommendations, and insights.
          readOnly: true
        name:
          $ref: "#/components/schemas/std.CaseInsensitiveText"
          description: Title of the assessment shown as the overview heading (e.g., 'Configuration Assessment', 'Quantum Readiness Assessment').
          readOnly: true
          minLength: 1
        slug:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*[a-zA-Z0-9]$
          description: "Stable programmatic identifier for this assessment definition. Immutable after creation. Used in API references and deep links. Format: lowerCamelCase."
          readOnly: true
          minLength: 2
          maxLength: 256
          examples:
          - configuration
          - securityHardening
          - quantumReadiness
        softwareTypes:
          type: array
          description: Software types this assessment supports. Only assets whose software type is listed are evaluated.
          readOnly: true
          examples:
          - - IOS
            - IOS-XE
            - IOS-XR
          - - AireOS
            - ASA
          items:
            $ref: "#/components/schemas/std.SoftwareType"
        supportTiers:
          $ref: "#/components/schemas/iam.EntitlementTierRefListResponse"
          description: "Support tiers that permit access to this assessment's findings. A finding qualifies when its asset's effective entitlement matches a linked [entitlementTier](#/components/schemas/iam.entitlementTier). A finding that belongs to several assessments qualifies when any one assessment accepts the tier."
          readOnly: true
          examples:
          - items:
            - /iam/v1/entitlementTiers/904e671c-856c-84c6-a2fa-d8a61e2b89cb
          x-relationship-targets:
          - iam.EntitlementTier
        sys:
          type: object
          description: System metadata for provisioning state.
          readOnly: true
          properties:
            createdAt:
              type: string
              format: date-time
              description: When this entity was created. Set automatically by the server and never updated after that. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
            ownership:
              $ref: "#/components/schemas/std.Ownership"
              description: Who owns this instance. SYSTEM instances require an explicit platform role exception for updates by account principals and cannot be deleted by them. CUSTOM instances are created by an account.
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              description: When this entity was last modified. Updated automatically on every write operation. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
        telemetrySources:
          type: array
          description: Telemetry sources this assessment draws on to collect the data it evaluates. At least one listed source must be connected for the assessment to produce results.
          readOnly: true
          items:
            $ref: "#/components/schemas/assessment.TelemetrySource"
    assessment.AssessmentListResponse:
      type: object
      description: Collection response containing one page of assessment resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources matching the request, ignoring pagination. Present only when `?count=true` was requested and the request had no pagination cursor.
        items:
          type: array
          description: Array of assessment resources in this paginated response.
          items:
            $ref: "#/components/schemas/assessment.Assessment"
      required:
      - items
    assessment.AutomationLevel:
      type: string
      enum:
      - DETECTION_ONLY
      - FULL_AUTONOMOUS
      - FULL_WITH_APPROVAL
      - NONE
      - PARTIAL
      description: Level of automation available for implementing a recommendation. Indicates how much manual effort is required.
    assessment.BugDetails:
      type: object
      description: "Marks a finding as a priority bug finding. Present on priority bug findings and absent on findings of other categories. The software bug identifier is reachable through the finding's linked [procedureDef](#/components/schemas/system.procedureDef)."
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          const: assessment.bugDetails
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
    assessment.CertificateDetails:
      type: object
      description: Details of a certificate a finding relates to, including its subject, issuer, validity window, and key properties. Present on certificate findings and absent on findings of other categories.
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          const: assessment.certificateDetails
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        commonName:
          type:
          - string
          - "null"
          description: Common name (CN) from the certificate subject, typically the primary host or entity the certificate identifies. Absent when the certificate does not include a common name.
          maxLength: 500
        extendedKeyUsage:
          type:
          - string
          - "null"
          description: Extended key usage (EKU) purposes the certificate is authorized for (for example 'serverAuth', 'clientAuth', 'codeSigning'). Absent when the certificate declares no extended key usage.
          maxLength: 1024
        issuer:
          type:
          - string
          - "null"
          description: Distinguished name of the certificate authority that issued this certificate. Absent when the certificate could not be fully evaluated, so this detail was not extracted.
          maxLength: 2048
        keyIdentifier:
          type:
          - string
          - "null"
          description: Subject key identifier (SKI) of the certificate, the hash that identifies its public key and links it to certificates issued from the same key. Absent when the certificate does not include a key identifier.
          maxLength: 512
        notValidAfter:
          type:
          - string
          - "null"
          format: date-time
          description: End of the certificate's validity window, its expiry. The certificate is not trusted after this instant, and this is the anchor for expiry and renewal reporting. Absent when the certificate could not be fully evaluated, so this detail was not extracted.
        notValidBefore:
          type:
          - string
          - "null"
          format: date-time
          description: Start of the certificate's validity window. The certificate is not trusted before this instant. Absent when the certificate could not be fully evaluated, so this detail was not extracted.
        publicKeyType:
          type:
          - string
          - "null"
          description: Type of the certificate's public key (for example 'RSA', 'EC'). Absent when the certificate does not specify a public key type.
          maxLength: 50
        serialNumber:
          type:
          - string
          - "null"
          description: Serial number of this certificate, unique within the issuing authority. Absent when the certificate could not be fully evaluated, so this detail was not extracted.
          maxLength: 255
        signatureAlgorithm:
          type:
          - string
          - "null"
          description: Algorithm used to sign the certificate (for example 'sha256WithRSAEncryption'). Useful for identifying weak or deprecated signature algorithms. Absent when the certificate does not specify a signature algorithm.
          maxLength: 255
        subjectAltNames:
          type:
          - array
          - "null"
          description: Subject alternative names (SAN) the certificate is valid for, the DNS names, IP addresses, or URIs it covers beyond the common name. Empty when the certificate declares no alternative names.
          items:
            type: string
            maxLength: 2048
        subjectName:
          type:
          - string
          - "null"
          description: Full distinguished name of the certificate subject, carrying every relative distinguished name component (for example CN, O, OU, C). Absent when the certificate does not include a subject name.
          maxLength: 2048
        version:
          type:
          - string
          - "null"
          description: X.509 version of the certificate (for example 'v3'). Absent when the certificate does not specify a version.
          maxLength: 10
    assessment.ConfigurationDetails:
      type: object
      description: Configuration details for a finding, identifying the network configuration domain it relates to. Present on configuration findings and absent on findings of other categories.
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          const: assessment.configurationDetails
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        category:
          description: The network configuration domain this finding relates to, such as Routing, Security, or VPN.
          anyOf:
          - $ref: "#/components/schemas/assessment.FindingCategory"
          - type: "null"
    assessment.EvidenceContentFormat:
      type: string
      enum:
      - BASE64
      - JSON
      - TEXT
      - XML
      description: The serialization format of the evidence content field. Lets consumers parse and render the content appropriately.
    assessment.EvidenceLog:
      type: object
      description: Supporting evidence documenting a finding. Contains structured data from the evaluation that produced the finding, such as configuration snippets, command outputs, or metric values.
      properties:
        component:
          type:
          - string
          - "null"
          description: The specific component within an asset that this evidence relates to (e.g., interface name, module slot, process name).
        content:
          type:
          - string
          - "null"
          description: The actual evidence data. May be a configuration block, command output, metric value, or structured JSON depending on evidenceType.
          maxLength: 16384
        contentFormat:
          description: Format of the content field. Helps consumers parse and render the evidence appropriately.
          anyOf:
          - $ref: "#/components/schemas/assessment.EvidenceContentFormat"
          - type: "null"
        contentSha256:
          description: SHA-256 digest of the content field, encoded as a 64-character lowercase hex string. Used for integrity verification and deduplication. Optional but recommended for audit scenarios.
          anyOf:
          - $ref: "#/components/schemas/std.Sha256Digest"
          - type: "null"
        evidenceType:
          description: Classification of the evidence format.
          anyOf:
          - $ref: "#/components/schemas/assessment.EvidenceType"
          - type: "null"
        source:
          description: The data source or system that provided this evidence.
          anyOf:
          - $ref: "#/components/schemas/assessment.EvidenceSource"
          - type: "null"
        timestamp:
          type:
          - string
          - "null"
          format: date-time
          description: When this evidence was collected. May differ from finding identification time if evidence is collected in batches.
    assessment.EvidenceSource:
      type: string
      enum:
      - API_RESPONSE
      - CLI_OUTPUT
      - SNMP_POLL
      - SYSLOG
      description: The data source or system that produced a piece of evidence supporting a finding. Identifies where the evidence originated so consumers can gauge its provenance and reliability.
    assessment.EvidenceType:
      type: string
      enum:
      - COMMAND_OUTPUT
      - CONFIGURATION
      - LOG_ENTRY
      - METRIC
      - SCREENSHOT
      description: Classification of the format and nature of a piece of evidence. Guides how consumers interpret and render the evidence content.
    assessment.ExternalReference:
      type: object
      description: Reference to external resources such as vendor documentation, hardening guides, configuration guides, and knowledge base articles
      properties:
        identifier:
          type:
          - string
          - "null"
          description: Identifier of the external reference if any (e.g., KB article number, bug ID).
        title:
          type:
          - string
          - "null"
          description: Title or brief description of the external reference.
        type:
          type:
          - string
          - "null"
          description: Type of external reference.
          examples:
          - KB_ARTICLE
          - DOCUMENTATION
          - BUG_ID
        url:
          description: URL to the external resource for additional information.
          anyOf:
          - $ref: "#/components/schemas/std.Url"
          - type: "null"
    assessment.FieldNoticeDetails:
      type: object
      description: "Marks a finding as a field notice finding. Present on field notice findings and absent on findings of other categories. The field notice  identifier is reachable through the finding's linked [procedureDef](#/components/schemas/system.procedureDef)."
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          const: assessment.fieldNoticeDetails
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
    assessment.Finding:
      type: object
      description: "A qualified, actionable observation produced by an evaluation (rule-based or analytical) that meets defined reporting criteria. Findings identify gaps, risks, issues, opportunities for improvement, or noteworthy states worthy of attention or action. Each finding is atomic and references a specific [item](#/components/schemas/asset.item) or component. Both compliant and non-compliant states can be captured to enable comprehensive tracking and trend analysis. Findings serve as the foundational building blocks for [insight](#/components/schemas/assessment.insight) generation and [findingRecommendation](#/components/schemas/assessment.findingRecommendation) creation."
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - assessment.finding
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        account:
          $ref: "#/components/schemas/std.EntityRef"
          description: The account this entity belongs to. Determines the authorization scope and data partitioning boundary. Every instance of this entity is scoped to exactly one account.
          readOnly: true
          examples:
          - /iam/v1/accounts/5124b04c-4ea0-8811-9055-ba2969895e8e
          x-relationship-targets:
          - iam.Account
        asset:
          $ref: "#/components/schemas/std.EntityRef"
          description: "The [item](#/components/schemas/asset.item) to which this finding applies. Findings are atomic and reference a specific asset. Required for all findings related to physical or virtual infrastructure."
          readOnly: true
          examples:
          - /asset/v1/physicalAssets/f8760922-9d26-8d3b-8ab9-de5b18681336
          - /asset/v1/virtualAssets/036c11bb-30a0-8772-a9a9-bdd54cf0e744
          x-relationship-targets:
          - asset.PhysicalAsset
          - asset.VirtualAsset
        description:
          type: string
          description: Human-readable detailed explanation of what this finding represents and what was found on an evaluated entity
          readOnly: true
          maxLength: 8192
          examples:
          - VTY line '0 4' permits insecure protocols via transport input (telnet or 'all' is allowed).
          - Checks that console access uses a named authentication method list and has an inactivity timeout when centralized management is not in use.
          - Certificate serial SERIAL_NUMBER with issuer ISSUER_DN is present and has expiry date 2022-11-14T06:05:02+00:00.
        detail:
          type: array
          description: The category-specific detail this finding carries. A finding can belong to several categories at once, for example, the same rule may classify as both Configuration and Security Hardening for one asset, and this collection holds one entry for each, mirroring the finding's `tags`. Every entry describes the attributes unique to its category, such as certificate properties for a certificate finding or upgrade guidance for a software conformance finding.
          readOnly: true
          minItems: 1
          items:
            $ref: "#/components/schemas/assessment.FindingDetails"
        evaluationKey:
          type: string
          description: Stable identifier of the specific thing this finding is about on its asset, for example a procedureId, certificate serial number, issuer. Together with the asset it forms the finding's natural key, so re-evaluating the same thing updates the same finding instead of creating a duplicate. The producer computes this value and sends it as the upsert address segment.
          readOnly: true
          minLength: 1
          maxLength: 1024
        evidenceLogs:
          type: array
          description: Supporting data documenting this finding, configuration blocks, command outputs/snippets, metric values. Provides concrete proof of the observed condition.
          readOnly: true
          items:
            $ref: "#/components/schemas/assessment.EvidenceLog"
        externalReferences:
          type:
          - array
          - "null"
          description: References to external resources such as knowledge base articles, hardening guides, configuration guides or vendor documentation.
          readOnly: true
          items:
            $ref: "#/components/schemas/assessment.ExternalReference"
        identifiedAt:
          type: string
          format: date-time
          description: When this finding was identified or discovered.
          readOnly: true
        procedure:
          $ref: "#/components/schemas/std.EntityRef"
          description: "The [procedureDef](#/components/schemas/system.procedureDef) this finding was produced by, the published catalog entry (the rules catalog) that defines the rule or check evaluated against the asset. Every finding is produced by exactly one catalogued procedure."
          readOnly: true
          examples:
          - /system/v1/procedureDefs/113c11d1-cd33-82e7-8fa6-2d0e978a6aa6
          x-relationship-targets:
          - system.ProcedureDef
        recommendations:
          $ref: "#/components/schemas/assessment.FindingRecommendationNavigation"
          description: "[findingRecommendation](#/components/schemas/assessment.findingRecommendation) entities that address this finding. A finding may be addressed by many recommendations; each recommendation belongs to exactly one finding."
          readOnly: true
          examples:
          - href: /api/assessment/v1/findings/ba0b82b6-3d67-8255-8bbf-d61d925e5e24/recommendations
          x-relationship-targets:
          - assessment.FindingRecommendation
        result:
          $ref: "#/components/schemas/assessment.FindingResult"
          description: The evaluation outcome from assessment execution, whether the assessed condition passed, failed, generated a warning, or is in an exceptional state. Applications may present results using domain-specific terminology.
          readOnly: true
        severity:
          description: Impact severity classification. Determines priority for remediation and reporting escalation.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/assessment.FindingSeverity"
          - type: "null"
        sys:
          description: System metadata for soft-deletion and purge lifecycle state.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.StandardSys"
          - type: "null"
        tags:
          type: object
          description: Tags assigned to this finding by the assessment engines. Each tag key starts with cisco.assessment. and names an assessment that includes the finding, such as cisco.assessment.configuration, cisco.assessment.securityHardening, cisco.assessment.certificates, cisco.assessment.softwareReleaseConformance, or cisco.assessment.zeroTrust. A finding can have several tags. Cisco platform callers own the cisco. entries and customers own the other entries. A write keeps the stored entries of the other side. The fieldNotice assessment uses cisco.assessment.fieldNotices. The string value "true" marks assessment membership. The asset's effective support tier must qualify for at least one member assessment to permit access to the finding.
          readOnly: true
          maxProperties: 60
          additionalProperties:
            type: string
        title:
          description: Short, human-readable heading for this finding.
          readOnly: true
          examples:
          - VTY Transport Protocol
          - Certificate expired
          - Certificate expires in < X days
          - Console And VTY Exec Timeout
          - Cisco IOS XE Software Privilege Escalation Vulnerabilities
          anyOf:
          - $ref: "#/components/schemas/std.Title"
          - type: "null"
        type:
          $ref: "#/components/schemas/assessment.FindingType"
          description: Domain classification indicating whether this finding relates to technical infrastructure, organizational processes, human factors, or business operations. Shared by every finding regardless of category.
          readOnly: true
    assessment.FindingCategory:
      type: string
      enum:
      - ACCESS_CONTROL
      - AVAILABILITY
      - COLLABORATION
      - CRYPTO_AGILITY
      - DATA_CENTER
      - HIGH_AVAILABILITY
      - IP_SERVICES
      - LAN_SWITCHING
      - LOGGING
      - MANAGEMENT
      - MPLS
      - MULTICAST
      - NETWORK
      - NETWORK_MANAGEMENT
      - PLATFORM
      - QOS
      - QUANTUM_SAFE_COMMUNICATIONS
      - QUANTUM_SAFE_GLOBAL_ROLLUP
      - QUANTUM_SAFE_PRODUCTS
      - ROUTING
      - SECURITY
      - SEGMENT_ROUTING
      - SWITCHING
      - TRANSPORT
      - VOICE
      - VPN
      - WAN
      - WIRELESS
      description: The category a finding falls under, determined by the rule evaluated against the asset. It identifies the specific domain the finding addresses, spanning quantum readiness pillars and network configuration domains.
    assessment.FindingDetails:
      type: object
      description: The category-specific detail a finding carries. Each variant adds the attributes unique to one finding category, such as certificate properties, software upgrade guidance, or quantum readiness.
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
      oneOf:
      - $ref: "#/components/schemas/assessment.BugDetails"
      - $ref: "#/components/schemas/assessment.CertificateDetails"
      - $ref: "#/components/schemas/assessment.ConfigurationDetails"
      - $ref: "#/components/schemas/assessment.FieldNoticeDetails"
      - $ref: "#/components/schemas/assessment.QuantumDetails"
      - $ref: "#/components/schemas/assessment.SecurityAdvisoryDetails"
      - $ref: "#/components/schemas/assessment.SecurityHardeningDetails"
      - $ref: "#/components/schemas/assessment.SoftwareConformanceDetails"
      - $ref: "#/components/schemas/assessment.ZeroTrustDetails"
      discriminator:
        propertyName: _type
        mapping:
          assessment.bugDetails: "#/components/schemas/assessment.BugDetails"
          assessment.certificateDetails: "#/components/schemas/assessment.CertificateDetails"
          assessment.configurationDetails: "#/components/schemas/assessment.ConfigurationDetails"
          assessment.fieldNoticeDetails: "#/components/schemas/assessment.FieldNoticeDetails"
          assessment.quantumDetails: "#/components/schemas/assessment.QuantumDetails"
          assessment.securityAdvisoryDetails: "#/components/schemas/assessment.SecurityAdvisoryDetails"
          assessment.securityHardeningDetails: "#/components/schemas/assessment.SecurityHardeningDetails"
          assessment.softwareConformanceDetails: "#/components/schemas/assessment.SoftwareConformanceDetails"
          assessment.zeroTrustDetails: "#/components/schemas/assessment.ZeroTrustDetails"
    assessment.FindingInlineMember:
      type: string
      enum:
      - recommendations
    assessment.FindingListResponse:
      type: object
      description: Collection response containing one page of finding resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources matching the request, ignoring pagination. Present only when `?count=true` was requested and the request had no pagination cursor.
        items:
          type: array
          description: Array of finding resources in this paginated response.
          items:
            $ref: "#/components/schemas/assessment.Finding"
      required:
      - items
    assessment.FindingRecommendation:
      type: object
      description: "A specific, actionable prescription that addresses a single [finding](#/components/schemas/assessment.finding), guidance for remediating the observed condition the finding reports. A finding may be addressed by many finding recommendations; each recommendation belongs to exactly one finding."
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - assessment.findingRecommendation
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        account:
          $ref: "#/components/schemas/std.EntityRef"
          description: The account this entity belongs to. Determines the authorization scope and data partitioning boundary. Every instance of this entity is scoped to exactly one account.
          readOnly: true
          examples:
          - /iam/v1/accounts/5124b04c-4ea0-8811-9055-ba2969895e8e
          x-relationship-targets:
          - iam.Account
        description:
          type: string
          description: Human-readable explanation of what this recommendation suggests and why it is relevant for the addressed finding.
          readOnly: true
          maxLength: 8192
          examples:
          - Upgrade the device to Cisco suggested release 17.9.x to remediate the reported security advisories.
          - Cisco recommends configuring vty (and tty/console when used for reverse-console) transport input and transport output to permit only secure encrypted protocols (for example, SSH) and removing clear-text protocols such as Telnet.
        evaluationKey:
          type: string
          description: Finding-local key that, together with the finding, forms the recommendation's natural key. Defaults to the constant `DEFAULT` today, giving one recommendation per finding; the engine will compute a distinct value per sibling recommendation in future. The producer sends it as the upsert address segment.
          readOnly: true
          minLength: 1
          maxLength: 1024
        finding:
          $ref: "#/components/schemas/std.EntityRef"
          description: "The [finding](#/components/schemas/assessment.finding) this recommendation addresses. First member of the natural key, so it is required; the producer sets it at creation and does not change it afterward. Deleting the finding deletes its recommendations (`onTargetDelete: CASCADE`) because a recommendation for a removed finding has no residual value."
          readOnly: true
          examples:
          - /assessment/v1/findings/ba0b82b6-3d67-8255-8bbf-d61d925e5e24
          x-relationship-targets:
          - assessment.Finding
        implementationGuidance:
          $ref: "#/components/schemas/assessment.ImplementationGuidance"
