          maxLength: 64
        suggestedReleases:
          type:
          - array
          - "null"
          description: Cisco suggested software releases to upgrade the asset to, resolving the conformance gap this finding reports. Empty when no release is suggested.
          items:
            type: string
            maxLength: 32
    assessment.StandardsTimeline:
