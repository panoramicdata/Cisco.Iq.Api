          items:
            $ref: "#/components/schemas/assessment.Insight"
      required:
      - items
    assessment.InsightRecommendation:
      type: object
      description: "A specific, actionable prescription that addresses a single [insight](#/components/schemas/assessment.insight), guidance that translates the insight's conclusions into action. An insight may be addressed by many insight recommendations; each recommendation belongs to exactly one insight."
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - assessment.insightRecommendation
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        account:
          $ref: "#/components/schemas/std.EntityRef"
          description: The account this entity belongs to. Determines the authorization scope and data partitioning boundary. Every instance of this entity is scoped to exactly one account.
          readOnly: true
          examples:
          - /iam/v1/accounts/5124b04c-4ea0-8811-9055-ba2969895e8e
          x-relationship-targets:
          - iam.Account
        description:
          type: string
          description: Human-readable explanation of what this recommendation suggests and why it is relevant for the addressed insight.
          readOnly: true
          maxLength: 8192
          examples:
          - Prioritize a fleet-wide upgrade program for the routers running the affected release train to close the recurring advisory exposure.
          - Establish a quarterly certificate-rotation process for the affected trust domain to prevent recurring expiry findings.
        evaluationKey:
          type: string
          description: Insight-local key that, together with the insight, forms the recommendation's natural key. Defaults to the constant `DEFAULT` today, giving one recommendation per insight; the engine will compute a distinct value per sibling recommendation in future. The producer sends it as the upsert address segment.
          readOnly: true
          minLength: 1
          maxLength: 1024
        implementationGuidance:
          $ref: "#/components/schemas/assessment.ImplementationGuidance"
          description: Detailed guidance for implementing this recommendation, including steps, prerequisites, verification procedures, and rollback plans. Review and validate this guidance against the target environment before applying it.
          readOnly: true
        insight:
          $ref: "#/components/schemas/std.EntityRef"
          description: "The [insight](#/components/schemas/assessment.insight) this recommendation addresses. First member of the natural key, so it is required; the producer sets it at creation and does not change it afterward. Deleting the insight deletes its recommendations (`onTargetDelete: CASCADE`) because a recommendation for a removed insight has no residual value."
          readOnly: true
          examples:
          - /assessment/v1/insights/f8e807dd-2f5d-8e10-af43-2ee81b226353
          x-relationship-targets:
          - assessment.Insight
        sys:
          description: System metadata for soft-deletion and purge lifecycle state.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.StandardSys"
          - type: "null"
        tags:
          type: object
          description: Tags assigned to this recommendation by the assessment engines. Each tag uses its own key; a recommendation can have several tags.
          readOnly: true
          maxProperties: 60
          additionalProperties:
            type: string
        type:
          $ref: "#/components/schemas/assessment.RecommendationType"
          description: Category of the recommended action, remediation, process improvement, strategic initiative, learning, optimization, or compliance.
          readOnly: true
