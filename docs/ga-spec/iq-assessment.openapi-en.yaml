openapi: 3.2.0
$self: https://iq.cisco.com/api/assessment/openapi/iq-assessment.openapi-en.yaml
info:
  title: Assessment API
  summary: Assessments, findings, insights, and recommendations for selected assets.
  description: Get assessments for selected assets, review findings with severity and evidence, explore insights, prioritize recommendations.
  termsOfService: https://www.cisco.com/c/en/us/about/legal/cloud-and-software.html
  contact:
    name: Cisco IQ Team
    url: https://iq.cisco.com
  license:
    name: Cisco Proprietary
    url: https://www.cisco.com/c/en/us/about/legal.html
  version: 0.1.0
servers:
- url: https://iq.cisco.com/api/assessment
  name: cisco-iq
  description: >-
    Global entry point for the Cisco IQ API.
- url: https://us-east-1.iq.cisco.com/api/assessment
  name: cisco-iq-us-east-1
  description: >-
    Cisco IQ API hosted in the United States (us-east-1).
- url: https://eu-frankfurt-1.iq.cisco.com/api/assessment
  name: cisco-iq-eu-frankfurt-1
  description: >-
    Cisco IQ API hosted in Europe (eu-frankfurt-1).
security:
- bearerAuth: []
tags:
- name: Assessments
  kind: nav
- name: deprecated
  description: Deprecated — scheduled for removal in a future release.
  kind: badge
- name: preview
  description: Preview API — subject to breaking changes without notice.
  kind: badge
paths:
  /v1/assessments:
    summary: Assessment collection
    description: Collection endpoint for listing Assessments and creating new Assessment resources.
    get:
      operationId: listAssessmentAssessments
      summary: List assessment definitions
      description: Retrieves a paginated list of Assessment definitions, each carrying its overview and applicability preconditions.
      tags:
      - Assessments
      x-actions:
      - list:assessment.assessment
      parameters:
      - $ref: "#/components/parameters/max"
      - $ref: "#/components/parameters/after"
      - name: orderby
        in: query
        summary: Order by
        description: "Comma-separated list of field names to order results by, each optionally suffixed with \" desc\" for descending order (ascending is the default). Example: name,createdAt desc. Choose a stable field for predictable pagination."
        schema:
          type: string
      - $ref: "#/components/parameters/filter"
      - $ref: "#/components/parameters/select"
      - $ref: "#/components/parameters/count"
      - $ref: "#/components/parameters/traceparent"
      responses:
        "200":
          description: Successfully retrieved list of Assessments.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
            Content-Disposition:
              $ref: "#/components/headers/Content-Disposition"
            Content-Encoding:
              $ref: "#/components/headers/Content-Encoding"
            Date:
              $ref: "#/components/headers/Date"
            Link:
              summary: Pagination links
              description: RFC 5988 navigation links for the current collection page. Relations may include next, prev, first, and last when those pages exist.
