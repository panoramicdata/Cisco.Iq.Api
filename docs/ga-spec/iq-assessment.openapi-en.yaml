          readOnly: true
          maxLength: 256
          examples:
          - National Institute of Standards and Technology
          - European Union Agency for Cybersecurity
        slug:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*[a-zA-Z0-9]$
          description: Stable programmatic key for the standards-published timeline.
          readOnly: true
          minLength: 2
          maxLength: 256
