  /v1/licensingAccounts/{id}/children:
    summary: Licensing Accounts relationship collection
    description: Sub-resource collection for listing Licensing Accounts related to the selected Licensing Account.
    get:
      operationId: listAssetChildrenForLicensingAccount
      summary: Virtual Accounts beneath this Smart Account
      description: "One account in the Smart Account / Virtual Account spine, at whichever of the two levels `type` names. A Smart Account sits at the top with a null parent; a Virtual Account hangs beneath one. Sources and coverage rows are booked against a Virtual Account, which is why the spine is modeled at all. It is the grain licensing consumption is counted at.\nA shared dimension rather than a coverage-owned entity: assets and orders reference it too, so it outlives any one coverage row. Sales and customer account views are a different spine entirely and are carried as party identifiers elsewhere."
