      - children
    asset.LicensingAccountListResponse:
      type: object
      description: Collection response containing one page of licensingAccount resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources matching the request, ignoring pagination. Present only when `?count=true` was requested and the request had no pagination cursor.
        items:
          type: array
          description: Array of licensingAccount resources in this paginated response.
          items:
            $ref: "#/components/schemas/asset.LicensingAccount"
      required:
      - items
