  /v1/physicalAssets/{id}/children:
    summary: Items relationship collection
    description: Sub-resource collection for listing Items related to the selected Physical Asset.
    get:
      operationId: listAssetChildrenForPhysicalAsset
      summary: Items contained within this item
      description: "Abstract base for any managed configuration item tracked in the asset inventory, physical hardware, virtual machines, services, and logical network constructs alike. Concrete subtypes (for example [physicalAsset](#/components/schemas/asset.physicalAsset)) carry form-factor-specific fields and declare their own natural-key identity schemes. The concrete-type discriminator (`_type`) identifies the subtype of each item. This item is the inventory resource and the target for coverage and risk exposure. An advisory or field notice is published reference data, and its exposure row identifies the item that is affected."
