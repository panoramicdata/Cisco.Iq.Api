openapi: 3.2.0
$self: https://iq.cisco.com/api/asset/openapi/iq-asset.openapi-en.yaml
info:
  title: Asset Management API
  summary: Assets, products, coverage, entitlements, and lifecycle bulletins
  description: Manage physical and virtual assets and their business context. Get information about products, contracts, warranty, support, entitlements, and hardware and software end-of-life bulletins.
  termsOfService: https://www.cisco.com/c/en/us/about/legal/cloud-and-software.html
  contact:
    name: Cisco IQ Team
    url: https://iq.cisco.com
  license:
    name: Cisco Proprietary
    url: https://www.cisco.com/c/en/us/about/legal.html
  version: 0.1.0
servers:
- url: https://iq.cisco.com/api/asset
  name: cisco-iq
  description: >-
    Global entry point for the Cisco IQ API.
- url: https://us-east-1.iq.cisco.com/api/asset
  name: cisco-iq-us-east-1
  description: >-
    Cisco IQ API hosted in the United States (us-east-1).
- url: https://eu-frankfurt-1.iq.cisco.com/api/asset
  name: cisco-iq-eu-frankfurt-1
  description: >-
    Cisco IQ API hosted in Europe (eu-frankfurt-1).
security:
- bearerAuth: []
tags:
- name: Coverage
  description: Contracts, subscriptions, activation keys, and warranties, and the coverage they grant.
  kind: nav
- name: Inventory
  description: Physical and virtual hardware and software assets tracked in the inventory.
  kind: nav
- name: Role Taxonomy
  kind: nav
- name: deprecated
  description: Deprecated — scheduled for removal in a future release.
  kind: badge
- name: preview
  description: Preview API — subject to breaking changes without notice.
  kind: badge
paths:
  /v1/coverageSources:
    summary: Coverage Source collection
    description: Collection endpoint for listing Coverage Sources and creating new Coverage Source resources.
    get:
      operationId: listAssetCoverageSources
      summary: List coverage sources
      description: List coverage sources, including contracts, subscriptions, and warranties. Results are paginated.
      tags:
      - Coverage
      x-actions:
      - list:asset.coverageSource
      parameters:
      - $ref: "#/components/parameters/max"
      - $ref: "#/components/parameters/after"
      - name: orderby
        in: query
        summary: Order by
        description: "Comma-separated list of field names to order results by, each optionally suffixed with \" desc\" for descending order (ascending is the default). Example: name,createdAt desc. Choose a stable field for predictable pagination."
        schema:
          type: string
      - $ref: "#/components/parameters/filter"
      - $ref: "#/components/parameters/select"
      - $ref: "#/components/parameters/count"
      - $ref: "#/components/parameters/asset.coverageSource.inline"
      - $ref: "#/components/parameters/inline.max"
      - $ref: "#/components/parameters/inline.count"
      - $ref: "#/components/parameters/traceparent"
      responses:
        "200":
          description: Successfully retrieved list of Coverage Sources.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
            Content-Disposition:
              $ref: "#/components/headers/Content-Disposition"
            Content-Encoding:
              $ref: "#/components/headers/Content-Encoding"
            Date:
              $ref: "#/components/headers/Date"
            Link:
              summary: Pagination links
              description: RFC 5988 navigation links for the current collection page. Relations may include next, prev, first, and last when those pages exist.
