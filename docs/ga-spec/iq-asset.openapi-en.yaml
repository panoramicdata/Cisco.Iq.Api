          description: Hypervisor or cloud provider hosting this instance, who runs the substrate underneath it, as against `saasAsset.provider`, which names the vendor whose service a tenancy is of. The two are different questions and are deliberately not the same field. Null when no hosting provider is available.
          readOnly: true
          maxLength: 64
