          type:
          - string
          - "null"
          description: Prefix used when a stock-keeping unit description is built for this offer.
          maxLength: 128
          examples:
          - BAS 8X5XNBD
        softwareServiceCategory:
          type:
          - string
          - "null"
          description: Software service category of this offer. Null when the offer is not a software service.
          maxLength: 64
          examples:
          - SWSS
          - SAS
          - SAU
          - ESW PRE-SWSS
          - SW SUPPORT NON-SWSS/SAS/SAU
        sys:
          description: System metadata for schema versioning and change-tracking timestamps.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.StandardSys"
          - type: "null"
        thirdPartyCoordination:
          type:
          - string
          - "null"
          description: Whether this offer includes third-party coordination. Null when the catalog does not say.
          maxLength: 240
    iam.CustomerLocation:
      type: object
      description: "One party's use of one address for one purpose, shipping, billing, or installation. The same party can have several uses, and each pairing is a separate customer location. A count of these locations counts commercial arrangements rather than places.\nThe purpose is what makes a location meaningful: an address used for billing says where invoices go, not where equipment sits. Most locations are used for shipping and only a small number mark an installation site, so a caller looking for where something is deployed must read `siteUseCode` before treating a location as a site, and must exclude DROP_SHIP addresses, which the customer does not occupy at all."
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - iam.customerLocation
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        customerRegistryPartyId:
          type:
          - string
          - "null"
          description: Identifier of the party this site use belongs to. The corresponding organization is available through `party`. Null when no party is associated with the site use.
          readOnly: true
          maxLength: 64
        customerRegistryPartyName:
          type:
          - string
          - "null"
          description: Trading name associated with the party for this site use. Null when `customerRegistryPartyId` is null.
          readOnly: true
          maxLength: 720
        customerRegistryPartyType:
          description: "Position of the party associated with this site use: branch, headquarters, or sales location. Null when `customerRegistryPartyId` is null."
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/iam.CustomerPartyType"
          - type: "null"
        partner:
          $ref: "#/components/schemas/std.EntityRef"
          description: Channel partner attributed to this use of the address. Many to one because one partner can be attributed to many site uses. Null when no partner attribution is available.
          readOnly: true
          x-relationship-targets:
          - iam.Partner
        party:
          $ref: "#/components/schemas/std.EntityRef"
          description: Organization using this address. Many to one because an organization can have several site uses. Null when no party is associated with the site use.
          readOnly: true
          x-relationship-targets:
          - iam.CustomerParty
        siteStatus:
          description: Whether the address is available to trade against. The first filter for any report meant to describe places currently in use, and the field that separates addresses a customer occupies from those goods are merely delivered to.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/iam.CustomerLocationStatus"
          - type: "null"
        siteUseCode:
          type:
          - string
          - "null"
          description: What the address is used for, receiving goods, receiving invoices, or hosting installed equipment. Read this before treating a location as a place equipment sits, since most addresses are recorded for shipping and only a small number are marked as installation sites.
          readOnly: true
          maxLength: 32
          examples:
          - SHIP_TO
          - BILL_TO
          - INSTALL_SITE
        siteUseId:
          type: string
          description: Identifier of this use of an address. Numeric at source; carried as a string because it is an identifier rather than a quantity. Immutable.
          readOnly: true
          minLength: 1
          maxLength: 64
        siteUseStatus:
          description: Whether this particular use is still in force, as distinct from the status of the address itself. Use `siteStatus` to select places that are currently in use.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/iam.CustomerLocationUseStatus"
          - type: "null"
        sys:
          type: object
          description: System metadata for provisioning state.
          readOnly: true
          properties:
            createdAt:
              type: string
              format: date-time
              description: When this entity was created. Set automatically by the server and never updated after that. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
            ownership:
              $ref: "#/components/schemas/std.Ownership"
              description: Who owns this instance. SYSTEM instances require an explicit platform role exception for updates by account principals and cannot be deleted by them. CUSTOM instances are created by an account.
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              description: When this entity was last modified. Updated automatically on every write operation. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
    iam.CustomerLocationStatus:
      type: string
      enum:
      - ACTIVE
      - DROP_SHIP
      - INACTIVE
      - ON_HOLD
      - UNKNOWN
      description: Whether an address is available to trade against. Governs whether new business may be directed to it, and is held against the address itself rather than against any one use of it. New values may be added without a breaking change; consumers should handle unknown values gracefully.
    iam.CustomerLocationUseStatus:
      type: string
      enum:
      - A
      - I
      description: Whether one use of an address is active. This status applies to the purpose-specific use, independent of the address's trading status.
    iam.CustomerParty:
      type: object
      description: >-
        One organization at one address. An organization can have many parties at different addresses, so the trading name can repeat. A party does not identify the organization as a whole.
        Headquarters, global-ultimate, and parent information is available as identifiers and names rather than traversable relationships. An UNKNOWN segmentation or sales-channel code means the party is unclassified.
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - iam.customerParty
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        address:
          description: Postal address of this party. Frequently partial, and the address of this site specifically rather than of the organization as a whole. Null where the registry holds no address.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/iam.PartyAddress"
          - type: "null"
        branchCustomerMarketSegmentCode:
          type:
          - string
          - "null"
          description: Code for the broad market this organization is sold into. UNKNOWN means no market-segment classification is available.
          readOnly: true
          maxLength: 64
          examples:
          - COM
          - ENT
          - SP
          - UNKNOWN
        branchDunsNumber:
          type:
          - string
          - "null"
          description: Nine-digit external business identifier for this party, used to reconcile against outside company data. Not unique in practice, so it can be used to look up a party but not to key one. Null when no DUNS value is available.
          readOnly: true
          maxLength: 16
          examples:
          - "150483782"
        branchSalesChannelCode:
          type:
          - string
          - "null"
          description: Code for the route through which this organization is sold, such as END_CUSTOMER for a direct relationship or IVAR for a value-added reseller. UNKNOWN means no sales-channel classification is available.
          readOnly: true
          maxLength: 64
          examples:
          - END_CUSTOMER
          - IVAR
          - UNKNOWN
        customerRegistryPartyId:
          type: string
          description: Unique identifier assigned to this party. Immutable.
          readOnly: true
          minLength: 1
          maxLength: 64
        customerRegistryPartyName:
          type:
          - string
          - "null"
          description: Trading name of the organization at this address. Repeats across the sites an organization operates, so it does not distinguish one party from another. Null on a small number of records where the registry holds an address but no name.
          readOnly: true
          maxLength: 720
        globalUltimatePartyId:
          type:
          - string
          - "null"
          description: Identifier of the organization at the top of this party's corporate tree. Use it to group parties for organization-wide reporting. Null when no global ultimate is available.
          readOnly: true
          maxLength: 64
        globalUltimatePartyName:
          type:
          - string
          - "null"
          description: Trading name of the global-ultimate organization. Null when `globalUltimatePartyId` is null.
          readOnly: true
          maxLength: 720
        headQuarterPartyId:
          type:
          - string
          - "null"
          description: Identifier of the headquarters this party reports to. A headquarters at the top of its tree names itself. Null when no headquarters is available.
          readOnly: true
          maxLength: 64
        headQuarterPartyName:
          type:
          - string
          - "null"
          description: Trading name of the headquarters. Null when `headQuarterPartyId` is null.
          readOnly: true
          maxLength: 720
        parentPartyId:
          type:
          - string
          - "null"
          description: Identifier of the immediate parent in the corporate hierarchy. Null at the top of a tree or when no parent is available.
          readOnly: true
          maxLength: 64
        parentPartyName:
          type:
          - string
          - "null"
          description: Trading name of the immediate parent. Null when `parentPartyId` is null.
          readOnly: true
          maxLength: 720
        partyType:
          description: Whether this party is a branch that reports upward or a headquarters that branches report to. Null when no position is recorded.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/iam.CustomerPartyType"
          - type: "null"
        sys:
          type: object
          description: System metadata for provisioning state.
          readOnly: true
          properties:
            createdAt:
              type: string
              format: date-time
              description: When this entity was created. Set automatically by the server and never updated after that. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
            ownership:
              $ref: "#/components/schemas/std.Ownership"
              description: Who owns this instance. SYSTEM instances require an explicit platform role exception for updates by account principals and cannot be deleted by them. CUSTOM instances are created by an account.
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              description: When this entity was last modified. Updated automatically on every write operation. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
    iam.CustomerPartyType:
      type: string
      enum:
      - BRANCH
      - HEADQUARTERS
      - SALES_LOCATION
      description: Position a party occupies in the corporate hierarchy. Determines whether the party is a branch that reports upward or the entity the branches report to. New values may be added without a breaking change; consumers should handle unknown values gracefully.
    iam.Partner:
      type: object
      description: "A channel partner, a reseller, distributor, service provider, or systems integrator, as the partner registry records it. Describes who sells and services equipment, as against [customerParty](#/components/schemas/iam.customerParty), which describes who owns and operates it.\nEach Partner identifies one partner in one geography, matching the registry's granularity and the `goToMarketGeographyId` key. A partner trading in several countries has one Partner per geography. These share `goToMarketId` and can differ in name, class of business, tier, and certification. Group on `goToMarketId` to reach the organization as a whole."
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - iam.partner
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        businessEntityGeographyId:
          type:
          - string
          - "null"
          description: >-
            Identifier of the partner's business entity within a single geography.
            Distinct from `goToMarketGeographyId`, which is the equivalent in the go-to-market range, fans out far less, and is this entity's key. The two ranges are not interchangeable.
          readOnly: true
          maxLength: 64
          examples:
          - "577858"
          - "639578"
        businessEntityGeographyName:
          type:
          - string
          - "null"
          description: Name of the partner's business entity in its geography.
          readOnly: true
          maxLength: 720
          examples:
          - Greenline Technologies LLC
          - Mediasens AG
        businessEntityId:
          type:
          - string
          - "null"
          description: Business-entity identifier of the partner. Null until the partner registry supplies the partner's details.
          readOnly: true
          maxLength: 64
          examples:
          - "525521"
          - "586315"
        businessEntityName:
          type:
          - string
          - "null"
          description: Name of the partner's business entity as registered.
          readOnly: true
          maxLength: 720
          examples:
          - Crescent Tech Ltd
          - MEDIASENS AG
        certification:
          description: Certification the partner holds, which governs the resale and service rights available to it. NONE means no certification is held. Null until the partner registry supplies the partner's details.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/iam.PartnerCertification"
          - type: "null"
        class:
          description: Class of business the partner runs.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/iam.PartnerClass"
          - type: "null"
        countryCode:
          description: ISO 3166-1 alpha-3 country the partner principally trades in.
          readOnly: true
          examples:
          - KEN
          - TZA
          - CHE
          anyOf:
          - $ref: "#/components/schemas/iam.PartnerCountryCode"
          - type: "null"
        goToMarketGeographyId:
          type: string
          description: "Identifier of the partner within a single geography, and the key of this entity. Assets and coverage sources resolve against this identifier.\nEvery Partner carries one: a Partner with no geography identifier names no single partner and is not published."
          readOnly: true
          minLength: 1
          maxLength: 64
          examples:
          - "209616674"
          - "272415966"
        goToMarketId:
          type:
          - string
          - "null"
          description: Go-to-market identifier of the partner organization, shared by every geography-specific Partner it trades through. It is not unique across Partners and therefore is not the key; `goToMarketGeographyId` is. Group on this to reach the whole organization. Null until the partner registry supplies the partner's details.
          readOnly: true
          maxLength: 64
          examples:
          - "209616676"
          - "272415968"
        subtype:
          type:
          - string
          - "null"
          description: Finer classification within `class`, distinguishing a local from a global systems integrator, or specialty from broad-based distribution.
          readOnly: true
          maxLength: 255
          examples:
          - UNREGISTERED
          - VAR
          - LOCAL DVAR
          - GLOBAL BROAD BASED DISTRIBUTION
        sys:
          type: object
          description: System metadata for provisioning state.
          readOnly: true
          properties:
            createdAt:
              type: string
              format: date-time
              description: When this entity was created. Set automatically by the server and never updated after that. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
            ownership:
              $ref: "#/components/schemas/std.Ownership"
              description: Who owns this instance. SYSTEM instances require an explicit platform role exception for updates by account principals and cannot be deleted by them. CUSTOM instances are created by an account.
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              description: When this entity was last modified. Updated automatically on every write operation. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
        tier:
          type:
          - string
          - "null"
          description: Whether the partner buys directly from the vendor or through distribution.
          readOnly: true
          maxLength: 10
          examples:
          - 2-TIER
          - 1-TIER
    iam.PartnerCertification:
      type: string
      enum:
      - GOLD
      - NONE
      - PREMIER
      - SELECT
      - SILVER
      description: "Vendor certification a channel partner holds, which governs the resale and service rights available to it. Ordered by attainment, with GOLD the highest. NONE is a recorded standing rather than missing data: the partner is known to the channel but has earned no certified status. New values may be added without a breaking change; consumers should handle unknown values gracefully."
    iam.PartnerClass:
      type: string
      enum:
      - DISTRIBUTOR
      - DMR
      - DVAR
      - SP
      - VAR
      description: Class of channel partner, how the business transacts with the vendor, which is what determines whether it resells, distributes to other resellers, or delivers a managed service on the vendor's behalf. Held against the partner rather than against any one sale. New values may be added without a breaking change; consumers should handle unknown values gracefully.
    iam.PartnerCountryCode:
      type: string
      pattern: ^[A-Z]{3}$
      description: ISO 3166-1 alpha-3 country code. Three uppercase letters identifying a country or territory.
      minLength: 3
      maxLength: 3
      examples:
      - KEN
      - TZA
      - CHE
    iam.PartyAddress:
      type: object
      description: "Postal address of a party, as the registry records it. Frequently partial, and the address of this party's own site rather than of the organization as a whole.\nFour unstructured address lines are carried rather than one, because that is how the source holds them and collapsing them loses content: a building, a floor, and a district commonly occupy separate lines outside the United States."
      properties:
        city:
          type:
          - string
          - "null"
          description: City or municipality. Null where the registry holds no address.
          maxLength: 120
        country:
          type:
          - string
          - "null"
          description: "Country, spelled out rather than carried as a code. A [customerAccountView](#/components/schemas/iam.customerAccountView) grouping records its country as a short code instead, so the two cannot be compared without mapping one to the other."
          maxLength: 120
          examples:
          - UNITED STATES
          - JAPAN
        county:
          type:
          - string
          - "null"
          description: County or second-level administrative division. Recorded on a minority of addresses, mostly in countries whose postal conventions use one.
          maxLength: 120
        line1:
          type:
          - string
          - "null"
          description: First address line, normally the street and number. Null where the registry holds no address at all.
          maxLength: 240
        line2:
          type:
          - string
          - "null"
          description: Second address line, where the source uses one. Null on most records, which fit in a single line.
          maxLength: 240
        line3:
          type:
          - string
          - "null"
          description: Third address line, where the source uses one. Null on all but a small minority of records.
          maxLength: 240
        line4:
          type:
          - string
          - "null"
          description: Fourth address line, where the source uses one. Null on all but a small minority of records.
          maxLength: 240
        postalCode:
          type:
          - string
          - "null"
          description: Postal or ZIP code. Format varies by country. Null where the source omits it.
          maxLength: 60
        state:
          type:
          - string
          - "null"
          description: State, province, or region, written as the source records it rather than as a standard code. Null in countries with no state level and wherever the source omits it.
          maxLength: 120
    iam.ServiceBrand:
      type: string
      enum:
      - CISCO_BRANDED
      - COLLABORATIVE_PROFESSIONAL_SERVICES
      - CO_BRANDED
      - PARTNER_BRANDED
      description: Support brand under which a catalog offer is delivered.
    std.AddressSource:
      type: string
      enum:
      - IMPORTED
      - REVERSE_GEOCODED
      - USER_PROVIDED
      description: How the postal address on a Location was obtained.
    std.CaseInsensitiveText:
      type: string
      description: Character string whose comparisons and sorting fold case (e.g. 'Cisco' and 'cisco' compare as the same value). Storage preserves the original case for display. A unique constraint on this scalar rejects case-only duplicates; fields without such a constraint can contain both values.
      maxLength: 256
      examples:
      - Cisco
      - cisco
    std.ConcreteType:
      type: string
      pattern: "^[a-z][a-z0-9-]*\\.[a-z][A-Za-z0-9]*$"
      description: "Namespace-qualified name of a concrete, instantiable model type, either an entity or a value type. Uniquely identifies the concrete type of a polymorphic payload using the format 'namespace.typeName'. Use [entityType](#/components/schemas/std.entityType) when the reference is restricted to entities, and [qualifiedName](#/components/schemas/std.qualifiedName) for any data-model type including interfaces, enums, and scalars."
      maxLength: 128
      examples:
      - asset.asset
      - std.schemaVersionedSys
      - iam.account
      - std.geoCoordinates
    std.CoordinateSource:
      type: string
      enum:
      - DEVICE_REPORTED
      - GEOCODED
      - IMPORTED
      - USER_PLACED
      description: How the geographic coordinates on a Location were obtained.
    std.CountryCode:
      type: string
      pattern: ^[A-Z]{2}$
      description: ISO 3166-1 alpha-2 country code. Two uppercase letters identifying a country or territory. Used in postal addresses, regional configuration, and locale-aware formatting.
      maxLength: 2
      examples:
      - US
      - DE
      - JP
      - BR
      - IN
    std.EntityRef:
      type: string
      format: uri-reference
      pattern: "^/[a-z][a-z0-9-]*/v[0-9]+/[a-z][a-zA-Z0-9]*/([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|by-[a-zA-Z][a-zA-Z0-9]*(/[^\\s/]+)+)$"
      description: API-relative URI reference pointing to a related resource. Addresses the target either by its server-assigned id or by one of the target's declared identity schemes.
      examples:
      - /asset/v1/assets/4ecc4f86-891e-4816-a4e0-d8138be01865
      - /iam/v1/users/a3b2c1d0-e5f6-4a7b-8c9d-0e1f2a3b4c5d
      - /product/v1/products/by-productId/isr4331
      - /asset/v1/assets/by-serial/cisco/isr4331/FDO12345678
    std.ErrorCode:
      type: string
      enum:
      - ALREADY_EXISTS
      - BAD_USER_INPUT
      - CONFLICT
      - DATA_FETCH_ERROR
      - FORBIDDEN
      - GONE
      - GRAPHQL_PARSE_FAILED
      - GRAPHQL_VALIDATION_FAILED
      - INTERNAL_SERVER_ERROR
      - INVALID_FORMAT
      - METHOD_NOT_ALLOWED
      - NOT_ACCEPTABLE
      - NOT_FOUND
      - NOT_IMPLEMENTED
      - PAYLOAD_TOO_LARGE
      - PRECONDITION_FAILED
      - RATE_LIMITED
      - REQUIRED_FIELD
      - SERVICE_UNAVAILABLE
      - TIMEOUT
      - UNAUTHENTICATED
      - UNSUPPORTED_MEDIA_TYPE
      - VALIDATION_FAILED
      description: Machine-readable code that classifies an API error.
    std.ErrorDetail:
      type: object
      description: Describes a specific error in an API response. Use the code, message, description, and field to identify and resolve the issue.
      properties:
        code:
          $ref: "#/components/schemas/std.ErrorCode"
          description: Machine-readable code that classifies the error.
          examples:
          - REQUIRED_FIELD
          - INVALID_FORMAT
        description:
          type:
          - string
          - "null"
          description: Detailed explanation with hints for resolution.
          examples:
          - Provide a non-empty value for the name field.
          - "Ensure the email follows the format: user@domain.com"
        field:
          type:
          - string
          - "null"
          description: Path to the field that caused the error, using dot-notation (e.g., "address.postalCode", "items[0].quantity"). Null for errors not associated with a specific field.
          examples:
          - name
          - address.postalCode
          - items[0].quantity
        message:
          type: string
          description: Human-readable error message suitable for display.
          examples:
          - The 'name' field is required.
          - Email address format is invalid.
    std.GeoCoordinates:
      type: object
      description: "A geographic coordinate pair in the WGS 84 coordinate reference system. Represents a point on the Earth's surface as decimal degrees of latitude and longitude. Used within Location to position sites on maps and to compute distances between locations.\nPrecision guidance: six decimal places (~0.11 m) is appropriate for building-level accuracy. Three decimal places (~111 m) is sufficient for city-block-level. The precision stored should reflect the actual accuracy of the source. Geocoded city-centroids should not be stored with spurious sub-meter precision."
      properties:
        latitude:
          $ref: "#/components/schemas/std.Latitude"
          description: Latitude in decimal degrees, WGS 84.
        longitude:
          $ref: "#/components/schemas/std.Longitude"
          description: Longitude in decimal degrees, WGS 84.
    std.GeocodingPrecision:
      type: string
      enum:
      - CITY
      - COUNTRY
      - NONE
      - REGION
      - ROOFTOP
      - STREET
      description: Confidence level of the geocoding that relates a postal address to geographic coordinates (or vice versa). Indicates the spatial granularity of the coordinate-to-address mapping.
    std.IpAddress:
      type: string
      description: IPv4 or IPv6 network address. IPv4 uses dotted-decimal notation. IPv6 uses colon-separated hexadecimal notation. Use [[Ipv4Address]] or [[Ipv6Address]] when the field must be restricted to a single protocol version. Prefix lengths and IPv6 zone identifiers are not accepted.
      maxLength: 45
      examples:
      - 10.0.1.42
      - 192.168.1.1
      - 2001:0db8::1
      - ::1
    std.IpOrHostname:
      type: string
      description: An IP address or hostname. It may be a configured hostname, a fully qualified domain name (FQDN), or an IP address (v4 or v6). Common in device management where a device can be reached or identified by any of these forms. Hostnames follow [[Hostname]] label rules. Ports, URI syntax, prefix lengths, IPv6 zone identifiers, and trailing root dots are not accepted. Use [[IdnHostname]] for internationalized hostnames. Use [[IpAddress]] or [[DnsName]] when only one form is acceptable.
      maxLength: 253
      examples:
      - ROUTER-1
      - core-sw.example.com
      - 10.0.1.42
      - 2001:0db8::1
    std.Latitude:
      type: number
      format: float
      description: "Geographic latitude in decimal degrees. Positive values indicate north of the equator; negative values indicate south. Range: -90.0 (South Pole) to +90.0 (North Pole). Precision to six decimal places gives ~0.11 m accuracy, which is sufficient for building-level positioning."
      minimum: -90
      maximum: 90
      examples:
      - 37.3861
      - -33.8688
      - 51.5074
    std.Location:
      type: object
      description: >-
        A physical location combining a human-readable postal address and machine-readable geographic coordinates. Intended for embedding on entities that need location data (e.g., Asset, Account).
        A Location may have a postal address, geographic coordinates, or both. When both are present, the coordinateSource and addressSource fields identify how each was obtained.
      properties:
        address:
          description: Postal address for this location. May be partial (e.g., city and country only) for locations where the full street address is unknown or not applicable (e.g., a rural cell tower site). Null if only coordinates are known.
          anyOf:
          - $ref: "#/components/schemas/std.PostalAddress"
          - type: "null"
        addressSource:
          description: How the postal address was obtained. Null when address is null.
          anyOf:
          - $ref: "#/components/schemas/std.AddressSource"
          - type: "null"
        coordinateSource:
          description: How the coordinates were obtained. Null when coordinates are null.
          anyOf:
          - $ref: "#/components/schemas/std.CoordinateSource"
          - type: "null"
        coordinates:
          description: Geographic coordinates for this location. Used for map rendering, distance calculations, and geo-queries. May be derived from the address via forward geocoding or provided directly by the user. Null if only the postal address is known and geocoding has not been performed.
          anyOf:
          - $ref: "#/components/schemas/std.GeoCoordinates"
          - type: "null"
        geocodingPrecision:
          description: Precision of the geocoding that relates the address to the coordinates (in either direction). Null when no geocoding has been performed (e.g., both address and coordinates were provided independently, or only one component is present). ROOFTOP indicates exact building-level match; CITY indicates a centroid approximation, etc.
          anyOf:
          - $ref: "#/components/schemas/std.GeocodingPrecision"
          - type: "null"
        name:
          type: string
          description: "Human-readable site name. Examples: 'Building 24, San Jose', 'London DC-1', 'Frankfurt Colo'."
          maxLength: 256
        timezone:
          description: IANA timezone identifier for this location. Used to interpret local time references, schedule maintenance windows, and display timestamps in the site's local time. May be derived from coordinates via a timezone lookup service, or set manually. Null if unknown.
          anyOf:
          - $ref: "#/components/schemas/std.Timezone"
          - type: "null"
    std.Longitude:
      type: number
      format: float
      description: "Geographic longitude in decimal degrees. Positive values indicate east of the Prime Meridian; negative values indicate west. Range: -180.0 to +180.0. The International Date Line (±180°) is represented as either +180.0 or -180.0."
      minimum: -180
      maximum: 180
      examples:
      - -122.0839
      - 151.2093
      - -0.1278
    std.Model:
      type: string
      description: Hardware model number or product identifier. Part of the composite natural key for asset identification alongside vendor and serial number. Format varies by vendor, typically an alphanumeric product code.
      minLength: 1
      maxLength: 128
      examples:
      - C9300-48P-A
      - MX250
      - ASR1002-HX
      - UCS-C240-M6S
    std.Ownership:
      type: string
      enum:
      - CUSTOM
      - SYSTEM
      description: Identifies who owns and manages an instance, determining its editability and visibility.
    std.PostalAddress:
      type: object
      description: Physical mailing address. Embedded value type without independent identity, always owned by its parent entity.
      properties:
        city:
          type:
          - string
          - "null"
          description: City or municipality name.
        country:
          description: Two-letter country code per ISO 3166-1 alpha-2. Null if country is unknown.
          anyOf:
          - $ref: "#/components/schemas/std.CountryCode"
          - type: "null"
        postalCode:
          type:
          - string
          - "null"
          description: Postal or ZIP code. Format varies by country.
        stateOrProvince:
          type:
          - string
          - "null"
          description: State, province, or region. Format varies by country.
        street:
          type:
          - string
          - "null"
          description: Street address line. May include suite or floor number.
    std.ProblemDetail:
      type: object
      description: Describes an HTTP API error. Use the type, title, status, detail, and errors fields to diagnose the problem and determine next steps.
      properties:
        detail:
          type:
          - string
          - "null"
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
          - Asset with ID 'asset-12345' not found in the system.
          - The field 'name' must not be empty.
        errors:
          type:
          - array
          - "null"
          description: Field-level validation errors. Each entry identifies the specific field and error condition.
          items:
            $ref: "#/components/schemas/std.ErrorDetail"
        instance:
          description: A URI reference identifying the specific occurrence of the problem. May or may not be dereferenceable.
          examples:
          - /api/assets/asset-12345
          - /assets?filter=invalid
          anyOf:
          - $ref: "#/components/schemas/std.Uri"
          - type: "null"
        status:
          type:
          - integer
          - "null"
          format: int32
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          examples:
          - 404
          - 400
        title:
          type:
          - string
          - "null"
          description: A short, human-readable summary of the problem type. Should not change from occurrence to occurrence of the same problem.
          examples:
          - Not Found
          - Validation Failed
        type:
          description: URI that identifies the problem type and may link to documentation that helps resolve it.
          examples:
          - https://iq.cisco.com/api/problems/not-found
          - https://iq.cisco.com/api/problems/validation-failed
          anyOf:
          - $ref: "#/components/schemas/std.Uri"
          - type: "null"
    std.ProvisionedSys:
      type: object
      description: System metadata that records instance ownership.
      properties:
        ownership:
          $ref: "#/components/schemas/std.Ownership"
          description: Who owns this instance. SYSTEM instances require an explicit platform role exception for updates by account principals and cannot be deleted by them. CUSTOM instances are created by an account.
          readOnly: true
    std.SerialNumber:
      type: string
      description: Identifier assigned to a hardware unit during manufacturing. Uniquely identifies a physical device within a vendor-model combination. Format varies by vendor, alphanumeric, typically 8–20 characters. Opaque to consumers; used as part of composite natural keys for asset identification.
      minLength: 1
      maxLength: 64
      examples:
      - FOC2331Z0P7
      - JAE2241063U
      - FDO2312V00A
    std.SoftwareType:
      type: string
      description: Network operating system type identifier. Categorizes the software platform running on a device or supported by a product. Determines which advisory databases, end-of-life bulletins, and software compatibility rules apply. Values are vendor-defined uppercase strings (e.g., 'IOS-XE' for Cisco IOS XE).
      minLength: 1
      maxLength: 64
      examples:
      - IOS-XE
      - NX-OS
      - IOS-XR
      - FXOS
      - ASA
    std.StandardSys:
      type: object
      description: "System metadata for change-tracked entities: schema version (inherited from [schemaVersionedSys](#/components/schemas/std.schemaVersionedSys)) plus creation and last-modification timestamps. Mutable entities use [mutableSys](#/components/schemas/std.mutableSys), which extends this type and adds ETag support."
      properties:
        createdAt:
          type: string
          format: date-time
          description: When this entity was created. Set automatically by the server and never updated after that. Always UTC.
          readOnly: true
          examples:
          - "2024-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: When this entity was last modified. Updated automatically on every write operation. Always UTC.
          readOnly: true
          examples:
          - "2024-01-15T10:30:00Z"
    std.Timezone:
      type: string
      pattern: "^[A-Za-z_]+(/[A-Za-z_+\\-0-9]+)*$"
      description: IANA Time Zone Database identifier. Identifies a geographic region's rules rules for UTC offset and daylight saving time transitions. Values follow the Area/Location convention defined by the IANA tz database, with additional forms for UTC and Etc zones. The canonical list is maintained at https://www.iana.org/time-zones.
      maxLength: 64
      examples:
      - America/New_York
      - America/Los_Angeles
      - Europe/Berlin
      - Asia/Tokyo
      - UTC
    std.Uri:
      type: string
      format: uri
      pattern: "^[a-zA-Z][a-zA-Z0-9+\\-.]*:[^\\s]*$"
      description: "Uniform Resource Identifier matching the RFC 3986 URI syntax rule: scheme ':' hier-part [ '?' query ] [ '#' fragment ]. Must include a scheme such as https:, mailto:, or urn:, and may also include a query or fragment. A Uri identifies a resource but does not, by itself, imply that the resource is dereferenceable or retrievable. Use [[UriReference]] when a field must also accept relative references such as /ui/dashboard, ../reports/summary, //cdn.example.com/assets/app.js, or #section-2. Use Uri for scheme-based identifiers such as XML namespace URIs, OIDC issuer identifiers, RDF subject URIs, and other absolute references. Use [[Url]] only when the field specifically means a dereferenceable locator. Use [[Urn]] only when the field must use the urn scheme and URN namespace rules. Conforms to RFC 3986, with usage guidance updated by RFC 8820."
      maxLength: 2048
      examples:
      - https://api.example.com/users/42
      - urn:isbn:978-0-306-40615-7
      - mailto:user@example.com
      - urn:uuid:6e8bc430-9c3a-11d9-9669-0800200c9a66
    std.Vendor:
      type: string
      description: Name of the hardware or software manufacturer. Used as part of composite natural keys for asset identification and as a grouping dimension for lifecycle reporting, advisory matching, and inventory queries. Format is a free-form display name as published by the vendor.
      minLength: 1
      maxLength: 128
      examples:
      - Cisco
      - Pure Storage
      - NetApp
      - Juniper Networks
  parameters:
    If-Match:
      name: If-Match
      in: header
      summary: Optimistic-concurrency precondition
      description: ETag value from the most recent GET response for this resource. The server rejects the mutation with 412 Precondition Failed if the resource has changed since then, preventing a write against stale state. Use the verbatim value returned in the ETag response header (RFC 9110 §13.1.1).
      schema:
        type: string
    If-Modified-Since:
      name: If-Modified-Since
      in: header
      summary: Conditional retrieval date
      description: Supply the verbatim value from the Last-Modified response header. The server returns 304 Not Modified if nothing has changed since that date; otherwise it returns the current response. The comparison is against the resource's own last-modification timestamp. Prefer If-None-Match when ETag is available (RFC 9110 §13.1.3).
      schema:
        type: string
    If-None-Match:
      name: If-None-Match
      in: header
      summary: Conditional retrieval validator
      description: ETag value from the most recent GET response for this resource. Returns the resource only if its current ETag differs; otherwise returns 304 Not Modified, allowing the client to reuse its cached copy. Supply the verbatim value returned in the ETag response header (RFC 9110 §13.1.2).
      schema:
        type: string
    If-Unmodified-Since:
      name: If-Unmodified-Since
      in: header
      summary: Date-based concurrency precondition
      description: Last-Modified date from the most recent GET response for this resource. The server rejects the mutation with 412 Precondition Failed if the resource has been modified since then, preventing a write against stale state. Use when ETag is unavailable. If the request also carries If-Match, the server evaluates If-Match and ignores this header (RFC 9110 §13.1.4).
      schema:
        type: string
    after:
      name: after
      in: query
      summary: Pagination cursor
      description: Opaque cursor from a previous response's Link header. Continue from the next page without interpreting or modifying the token.
      schema:
        type: string
    asset.coverageSource.inline:
      name: inline
      in: query
      summary: Inline relationship references
      description: Comma-separated non-owning collection names. Each selected relationship returns bounded reference `items` with an optional opaque `next` cursor. With `select`, include each inline relationship in the selected fields.
      schema:
        type: array
        minItems: 1
        items:
          $ref: "#/components/schemas/asset.CoverageSourceInlineMember"
      style: form
      explode: false
    asset.licensingAccount.inline:
      name: inline
      in: query
      summary: Inline relationship references
      description: Comma-separated non-owning collection names. Each selected relationship returns bounded reference `items` with an optional opaque `next` cursor. With `select`, include each inline relationship in the selected fields.
      schema:
        type: array
        minItems: 1
        items:
          $ref: "#/components/schemas/asset.LicensingAccountInlineMember"
      style: form
      explode: false
    asset.physicalAsset.inline:
      name: inline
      in: query
      summary: Inline relationship references
      description: Comma-separated non-owning collection names. Each selected relationship returns bounded reference `items` with an optional opaque `next` cursor. With `select`, include each inline relationship in the selected fields.
      schema:
        type: array
        minItems: 1
        items:
          $ref: "#/components/schemas/asset.PhysicalAssetInlineMember"
      style: form
      explode: false
    asset.virtualAsset.inline:
      name: inline
      in: query
      summary: Inline relationship references
      description: Comma-separated non-owning collection names. Each selected relationship returns bounded reference `items` with an optional opaque `next` cursor. With `select`, include each inline relationship in the selected fields.
      schema:
        type: array
        minItems: 1
        items:
          $ref: "#/components/schemas/asset.VirtualAssetInlineMember"
      style: form
      explode: false
    count:
      name: count
      in: query
      summary: Include total count
      description: When true, includes a `count` field in the response equal to the total number of matching rows, regardless of page size. Cannot be combined with a pagination cursor (`after`); only valid on the first page.
      schema:
        type: boolean
    filter:
      name: filter
      in: query
      summary: Filter expression
      description: "Filter expression applied to the collection before pagination. UUID fields and to-one reference comparisons require UUID literals, not resource paths; invalid UUID literals return HTTP 400 BAD_USER_INPUT before execution. Supported: field equality (`status == \"ACTIVE\"`, where the value must match the field's declared enum value), `tier != 0`, nullable stored relationship checks (`account == null`, `account != null`), ordered comparison (`<`, `<=`, `>`, `>=`), boolean combination (`&&`, `||`, `!`) with parentheses for grouping, case-sensitive substring match (`name.contains(\"acme\")`), case-insensitive substring, prefix, and suffix match (`name.icontains(\"ACME\")`, `name.istartsWith(\"ac\")`, `name.iendsWith(\"me\")`), element membership in array fields (`3 in flags`, `\"prod\" in scopes`), key existence in map fields (`\"env\" in tags`), constant string-key lookup (`tags[\"地域 / 環境\"] == \"本番\"`, with single- or double-quoted keys), literal string-list membership for scalar string-compatible fields and tag entries (`product.productId in [\"A\", \"B\"]`, `tags.env in [\"prod\", \"stage\"]`), nested value-type field access (`address.city == \"x\"`), array value-type sub-field predicates (`tags.value == \"x\"`), and many-to-one or one-to-one (owner-side) relationship traversal using a natural key, including a multi-hop chain and a chain that passes through a polymorphic relationship shared identically by every concrete type (`product.manufacturer.name == \"Cisco\"`, `owner.effectiveEntitlementTier.ordinal >= 3`). Literal string lists follow each field's equality validation, including enum values and UUID syntax. An empty list matches no row but still validates the field and retains referenced target readability checks. A chain longer than the configured hop limit, a polymorphic relationship immediately followed by another polymorphic relationship, one-to-many and many-to-many entity relationships, lists of numbers (`tier in [1, 2, 3]`), nonliteral list elements, lists on whole maps or ordinary map entries, dynamic map keys, numeric indexing, arithmetic, and other functions (such as plain `startsWith`, `endsWith`, and `matches`) are not supported. See https://iq.cisco.com/api/help#filtering. Tag values in `tags`, including relationship paths, reject `contains()`, `icontains()`, `startsWith()`, `istartsWith()`, `endsWith()`, `iendsWith()`, `matches()`. Use == to compare a specific tag key with its complete value, for example `tags.env == \"prod\"`; key existence remains supported. Tag string-search violations return HTTP 422 VALIDATION_FAILED."
      schema:
        type: string
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    inline.count:
      name: inline.count
      in: query
      summary: Include relationship totals
      description: When true, each selected relationship includes its exact authorized total in `count`. Requires `inline`. Omit or use false to return no relationship totals.
      schema:
        type: boolean
        default: false
    inline.max:
      name: inline.max
      in: query
      summary: Inline relationship page size
      description: Maximum references per selected relationship and parent. Requires `inline` and a positive value. To continue, pass the relationship's opaque `next` cursor as `after` to its member endpoint.
      schema:
        type: integer
        default: 25
        minimum: 1
        maximum: 100
    max:
      name: max
      in: query
      summary: Page size
      description: "Caps the number of items returned in one page. Use 0 only with `count=true` to return the exact count and an empty `items` array. Smaller positive values reduce response size. Larger positive values return results in fewer pages. Default: 25."
      schema:
        type: integer
        default: 25
        minimum: 0
        maximum: 50000
    offset:
      name: offset
      in: query
      summary: Pagination offset
      description: Zero-based index of the first item to return. Use with page size for direct page access when offset pagination is enabled.
      schema:
        type: integer
    select:
      name: select
      in: query
      summary: Sparse fieldset
      description: Comma-separated list of field names to include in the response. Omit to return the default field set. The `id` identifier and `_type` type discriminator are always included even when not listed. Unknown field names are rejected.
      schema:
        type: string
    traceparent:
      name: traceparent
      in: header
      summary: Trace context
      description: "Optional W3C Trace Context propagation header (RFC format: `00-{trace-id}-{parent-id}-{flags}`). When present, the server creates a child span within the caller's trace; `parent-id` must identify the caller's current span."
      schema:
        type: string
        pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
  headers:
    Cache-Control:
      summary: Cache directive
      description: Directives that control caching behavior for this response. Authenticated responses carry `no-store` to prevent storage in HTTP caches or shared proxies (RFC 9111).
      schema:
        type: string
    Content-Disposition:
      summary: Export file name
      description: Sent only when the response is a CSV or Excel file. It marks the body as an attachment and gives the file name, which has the form <resource>_<UTC date>_<UTC time> and the file extension.
      schema:
        type: string
    Content-Encoding:
      summary: Content coding
      description: "Content coding that the server applied to the response body: `br` (RFC 7932) or `gzip` (RFC 9110 §8.4.1.3). The server compresses `application/json`, `application/*+json`, `application/yaml`, `application/*+yaml`, `text/csv`, and `text/plain` responses when the request `Accept-Encoding` header accepts `br` or `gzip` (RFC 9110 §12.5.3). It uses the coding with the higher quality value, and `br` wins a tie. A small body is not compressed unless the server streams it. Absent when the body is not compressed. Decode the body before you parse it. The `ETag` identifies the decoded body, so it is the same for every coding."
      schema:
        type: string
        enum:
        - br
        - gzip
    Date:
      summary: Response date
      description: Date and time at which the server generated the response, in IMF-fixdate format (RFC 9110 §6.6.1). Useful for detecting clock skew and correlating audit logs.
      schema:
        type: string
    ETag:
      summary: Entity tag
      description: Opaque identifier for the current state of the resource. Use with `If-None-Match` for conditional GETs and with `If-Match` for optimistic-concurrency on updates (RFC 9110 §8.8.3).
      schema:
        type: string
    Last-Modified:
      summary: Last-modified date
      description: Date and time at which the resource was last modified, in IMF-fixdate format. Send it back in `If-Modified-Since` to revalidate a cache, or in `If-Unmodified-Since` to make a subsequent write conditional (RFC 9110 §8.8.2).
      schema:
        type: string
    RateLimit:
      summary: Rate limit
      description: Current rate-limit quota state for the request, including remaining quota and reset time.
      schema:
        type: string
    RateLimit-Policy:
      summary: Rate-limit policy
      description: Published rate-limit policy describing the quota windows and units that apply to the request.
      schema:
        type: string
    Retry-After:
      summary: Retry delay
      description: Time to wait before retrying the request, expressed as delay-seconds or an HTTP date.
      schema:
        type: string
    Server-Timing:
      summary: Server timing
      description: "Time the server spent on this request, as a comma-separated list of metrics in the form `name;dur=<milliseconds>`, each optionally followed by `;desc=\"<text>\"`. The `total` metric covers the request up to the point the server began sending the response; any other metric names a phase within it. Browsers show these entries in the network timing panel. The set of metrics can change between releases. Read entries by name, not by position. Only `total` is guaranteed: the server drops metrics from the end of the list when the full set would not fit in the header."
      schema:
        type: string
    Vary:
      summary: Vary
      description: Lists the request headers used to select the response representation. Caches must store a separate entry for each combination of their values (RFC 9110 §12.5.5). `Accept-Encoding` and `Sec-Fetch-Site` select the content coding of the body. `Accept-Language` signals that the response body is localized.
      schema:
        type: string
    WWW-Authenticate:
      summary: Authentication challenge
      description: Authentication challenge issued by the server when the request lacks valid credentials (RFC 9110 §11.6.1). For Bearer tokens the value is `Bearer realm="<service>"`.
