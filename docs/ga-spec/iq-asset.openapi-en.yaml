    asset.LicensingAccount:
      type: object
      description: "One account in the Smart Account / Virtual Account spine, at whichever of the two levels `type` names. A Smart Account sits at the top with a null parent; a Virtual Account hangs beneath one. Sources and coverage rows are booked against a Virtual Account, which is why the spine is modeled at all. It is the grain licensing consumption is counted at.\nA shared dimension rather than a coverage-owned entity: assets and orders reference it too, so it outlives any one coverage row. Sales and customer account views are a different spine entirely and are carried as party identifiers elsewhere."
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - asset.licensingAccount
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        account:
          $ref: "#/components/schemas/std.EntityRef"
          description: The account this entity belongs to. Determines the authorization scope and data partitioning boundary. Every instance of this entity is scoped to exactly one account.
          readOnly: true
          examples:
          - /iam/v1/accounts/5124b04c-4ea0-8811-9055-ba2969895e8e
          x-relationship-targets:
          - iam.Account
        children:
          $ref: "#/components/schemas/asset.LicensingAccountNavigation"
          description: Virtual Accounts beneath this Smart Account. Empty for a Virtual Account, which has none, and for a Smart Account that has not been subdivided.
          readOnly: true
          examples:
          - href: /api/asset/v1/licensingAccounts/f18f58f9-cb32-8b85-a137-3bbf4b168ce8/children
          x-relationship-targets:
          - asset.LicensingAccount
        licensingAccountId:
          type: string
          description: Identifier the licensing spine assigns this account, a Smart Account domain identifier or a Virtual Account identifier. Held as a string rather than a UUID because both levels share the field and the two do not share a format.
          readOnly: true
          minLength: 1
          maxLength: 128
        name:
          type:
          - string
          - "null"
          description: Display name of the account as the licensing spine publishes it. Null if the source reported none.
          readOnly: true
          maxLength: 256
        parent:
          $ref: "#/components/schemas/std.EntityRef"
          description: Smart Account this Virtual Account hangs beneath. Null for a Smart Account, which is the top of the spine, see `type` before reading a null here as unresolved.
          readOnly: true
          examples:
          - /asset/v1/licensingAccounts/f18f58f9-cb32-8b85-a137-3bbf4b168ce8
          x-relationship-targets:
          - asset.LicensingAccount
        sys:
          description: System metadata for soft-deletion and purge lifecycle state.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.StandardSys"
          - type: "null"
        type:
          $ref: "#/components/schemas/asset.LicensingAccountType"
          description: "Which level of the spine this account occupies. Read it before interpreting `parent`: a null parent on a Smart Account means nothing sits above it, while a null parent on a Virtual Account means the Smart Account above it is unresolved."
          readOnly: true
