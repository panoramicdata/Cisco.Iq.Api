components:
  schemas:
    asset.AssetCriticality:
      type: object
      description: "Role and importance classification for an item. `role` and `importance` are read-only computed views: each resolves a caller's override first (`overriddenRole`/`overriddenImportance`, directly writable), then falls back to the asset criticality pipeline's own classification (`telemetryRole`/`predictedRole` for role, `computedImportance` for importance). Set the override fields directly to take control; clear them (null) to hand control back to the pipeline."
      properties:
        importance:
          description: Business-criticality classification of the item, in effect. Read-only. Resolved by precedence from `overriddenImportance`, then `computedImportance`; null until the caller sets an override or the pipeline classifies the item. To change it, write `overriddenImportance` directly (see that field). A write that supplies only one of these precedence inputs may leave this value resolved from a stale combination of the others until a later write supplies the full set together.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/asset.AssetImportance"
          - type: "null"
        overriddenImportance:
          description: Business-criticality classification as manually overridden. Directly writable by a caller. Set it to take control of `importance` away from the pipeline; write it as null to hand control back to `computedImportance`. While set, it supersedes `computedImportance` in `importance`.
          anyOf:
          - $ref: "#/components/schemas/asset.AssetImportance"
          - type: "null"
        overriddenRole:
          type:
          - string
          - "null"
          description: Operational function of the item as manually overridden. Directly writable by a caller. Set it to take control of `role` away from the pipeline; write it as null to hand control back to `telemetryRole`, then `predictedRole`. While set, it supersedes both in `role`.
          maxLength: 50
          examples:
          - Router
          - Switch
          - Firewall
        role:
          type:
          - string
          - "null"
          description: Operational function of the item, in effect. Read-only. Resolved by precedence from `overriddenRole`, then `telemetryRole`, then `predictedRole`; null until the caller sets an override or the pipeline classifies the item. To change it, write `overriddenRole` directly (see that field). A write that supplies only one of these precedence inputs may leave this value resolved from a stale combination of the others until a later write supplies the full set together.
          readOnly: true
          maxLength: 50
          examples:
          - Router
          - Switch
          - Firewall
    asset.AssetImportance:
      type: string
      enum:
      - CRITICAL
      - HIGH
      - MEDIUM
      - LOW
      description: Business-criticality classification of an item.
    asset.AssetOrigin:
      type: string
      enum:
      - CISCO
      - CLOUD_NATIVE
      - THIRD_PARTY
      - UNKNOWN
      description: Who produced a configuration item, independent of where it runs. Every item family can hold items of more than one origin, so this is what separates vendor-built products from the third-party and provider-native resources reported alongside them. New values may be added without a breaking change; consumers should handle unknown values gracefully.
    asset.AssetTier:
      type: string
      enum:
      - OVERLAY
      - SUBSTRATE
      description: Whether a configuration item is counted as installed base or exists only to reference the items that are. An item's family fixes this value. New values may be added without a breaking change; consumers should handle unknown values gracefully.
    asset.CollectorType:
      type: string
      enum:
      - CSPC
      - CXAGENT
      - IQLINK
      description: Type of collector that gathers an item's telemetry for a data source. New values may be added; consumers should handle unknown values.
    asset.Coverage:
      type: object
      description: Coverage granted by its source, at the level of detail the source reports. The resource either binds a configuration item by instance identifier, serial number, unique device identifier, or tenancy, or expresses an account-level quantity with no individual target, which is what `targetType` distinguishes. Grouping is by `source`, which represents a contract service line. An item can have separate support and license coverage.
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - asset.coverage
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        account:
          $ref: "#/components/schemas/std.EntityRef"
          description: The account this entity belongs to. Determines the authorization scope and data partitioning boundary. Every instance of this entity is scoped to exactly one account.
          readOnly: true
          examples:
          - /iam/v1/accounts/5124b04c-4ea0-8811-9055-ba2969895e8e
          x-relationship-targets:
          - iam.Account
        asset:
          $ref: "#/components/schemas/std.EntityRef"
          description: Configuration item this row covers. Null for account-level grains, which grant a quantity rather than binding an item, and for rows whose reported target has not yet resolved to an item.
          readOnly: true
          examples:
          - /asset/v1/physicalAssets/f8760922-9d26-8d3b-8ab9-de5b18681336
          - /asset/v1/virtualAssets/036c11bb-30a0-8772-a9a9-bdd54cf0e744
          x-relationship-targets:
          - asset.PhysicalAsset
          - asset.VirtualAsset
        attributes:
          description: "Ancillary key/value detail specific to one kind of coverage source, for values worth carrying but not worth a field of their own. A deliberate escape hatch: it exists so a source-specific column can be surfaced without reshaping the entity, and it is expected to be empty on most rows.\nNot part of the query surface. The query API does not inspect this JSON, so nothing inside this object can be filtered, sorted, indexed or range searched, and no key is validated, typed or length-checked. Any value a consumer needs to select or window on must be promoted to a top-level field instead, in particular dates, statuses and identifiers do not belong here, since expiry windowing and status filtering are the two things coverage is most often queried for.\nKeys are conventional rather than declared, so consumers must treat every key as optional and every value as untyped, and must not assume a key present on one source type appears on another. Because no key is part of the published contract, keys may be added, renamed or removed without a breaking change.\nA contract row might carry the covered line's duplicate-coverage marker and promotional program, neither of which any query filters on: `{\"duplicateCoverageFlag\": \"S\", \"programType\": \"Try and Buy\"}`. A subscription row might carry the commercial shape of the subscription instead: `{\"subscriptionModelType\": \"Support\", \"termInMonths\": 36, \"bookingsOfferType\": \"DNA - Advantage\"}`. Note that the keys differ entirely between the two, which is the point of the field and the reason nothing inside it can be relied on."
          readOnly: true
          examples:
          - duplicateCoverageFlag: S
            programType: Try and Buy
          - bookingsOfferType: "DNA - Advantage"
            subscriptionModelType: Support
            termInMonths: 36
        consumedQuantity:
          type:
          - integer
          - "null"
          format: int32
          description: "Amount of the grant already in use. Compared against the entitled quantity to find over- and under-consumption. Null when consumption is not reported."
          readOnly: true
          minimum: 0
        coveredLineNumber:
          type:
          - string
          - "null"
          description: Number of the covered line this row came from, as a person would read it. Numbered within the parent coverage line rather than globally, so it identifies a row only alongside that parent's `coverageLineNumber`, and it is what a support case cites. Null if the source has no line numbering.
          readOnly: true
          maxLength: 64
        endDate:
          type:
          - string
          - "null"
          format: date
          description: Date coverage for this specific target expires. The last covered day is included, so a row whose end date is today still covers its target today. Two rows where one's start date equals the other's end date therefore overlap for that day rather than abutting; a clean handover is start date = previous end date plus one. May differ from the source's end date for targets on different terms. Null if not reported.
          readOnly: true
        entitledQuantity:
          type:
          - integer
          - "null"
          format: int32
          description: "Quantity granted by this row (seats, instances, or devices) and the purchased pool size at POOL grain. A count only means something where a row grants a countable pool, so this is populated for LICENSE coverage and the account-level grains (VIRTUAL_ACCOUNT, POOL) and left null at the per-item grains, where the row already stands for exactly one item: support on a serial is not defaulted to a quantity of one. Warranty and embedded coverage carry no counted entitlement."
          readOnly: true
          minimum: 0
        entitlementTag:
          type:
          - string
          - "null"
          description: Entitlement tag assigned by the licensing system, when the source reports one. Null otherwise.
          readOnly: true
          maxLength: 128
        entitlementTier:
          $ref: "#/components/schemas/std.EntityRef"
          description: "The [entitlementTier](#/components/schemas/iam.entitlementTier) granted by this coverage row. An ACTIVE row of any type except WARRANTY grants its template's purchased tier when its source is ACTIVE and both date windows include the current UTC date. Missing date bounds are open. The template must resolve to basic, standard, or signature. The grant applies to every service brand and account kind. Catalog orderability does not expire the grant. Null means the row has no qualifying grant. The account-specific policy on [item](#/components/schemas/asset.item) determines whether this grant contributes to the item's effective entitlement tier."
          readOnly: true
          examples:
          - /iam/v1/entitlementTiers/904e671c-856c-84c6-a2fa-d8a61e2b89cb
          x-relationship-targets:
          - iam.EntitlementTier
        entitlementType:
          type:
          - string
          - "null"
          description: Right this row grants, such as support, software, a feature license, or replacement. Null when no entitlement type is available.
          readOnly: true
          maxLength: 64
        lastUpdatedDate:
          type:
          - string
          - "null"
          format: date
          description: When the source last changed this coverage row. Dates the underlying record, not when this API last received it. Null if the source does not date its rows.
          readOnly: true
        licensingAccount:
          $ref: "#/components/schemas/std.EntityRef"
          description: Virtual Account scoping this row. Load-bearing for the account-level grains, where it is the only thing the row attaches to, a VIRTUAL_ACCOUNT or POOL row binds no item, so its account is what makes it addressable. Null until resolved.
          readOnly: true
          examples:
          - /asset/v1/licensingAccounts/f18f58f9-cb32-8b85-a137-3bbf4b168ce8
          x-relationship-targets:
          - asset.LicensingAccount
        maintenanceSalesOrder:
          type:
          - string
          - "null"
          description: Service order this coverage was booked under. Referenced when reconciling coverage against commerce records. Null if not reported.
          readOnly: true
          maxLength: 128
        program:
          type:
          - string
          - "null"
          description: Program or offer governing the service level, carrying the program's name rather than its code, `serviceLevelCode` on the same row holds the corresponding code, so a row reading 'SNTC' here reads 'SNT' there. This is where distinct programs stay separate after `type` folds them into a single coarse value. Null on warranty, which has no program, and where the source reports none.
          readOnly: true
          maxLength: 128
          examples:
          - SNTC
          - CISCO SWSS
          - ELA SWSS
        serialNumber:
          description: "Serial number of the item this row targets, denormalised from that item so coverage can be filtered by serial without traversing to the asset. Null when the targeted item carries no serial. Never carries an ancestor's serial: where the targeted item has none, this stays null even if a parent is serialized, because the coverage binds the child and not the parent."
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.SerialNumber"
          - type: "null"
        serviceLevelCode:
          type:
          - string
          - "null"
          description: "Service level this row delivers, as the code its own source states. The vocabulary depends on `sourceType` rather than being shared: a contract line carries a General Service Program code such as 'SNT' or 'ECMU', a warranty line a policy code such as 'WARR-90-DAY-LTD-HW', and a subscription the service offer code where it reports one. Codes are stable across product changes, so this is the durable way to compare service levels within a source type. Read it against `sourceType` before comparing across types. Null if the source states no code."
          readOnly: true
          maxLength: 64
          examples:
          - SNT
          - ECMU
          - ELSU
          - WARR-90-DAY-LTD-HW
        serviceLevelDescription:
          type:
          - string
          - "null"
          description: Service level in readable form, stating the response terms that the coded `serviceLevelCode` and named `program` on the same row do not. The most detailed of the three, so it is the only service signal available on rows where the program is absent. Null when no service terms are available.
          readOnly: true
          maxLength: 256
          examples:
          - SNTC 8X5XNBD
          - SWSS UPGRADES
          - Standard Warranty
        shipDate:
          type:
          - string
          - "null"
          format: date
          description: Date the covered hardware shipped. Starts the warranty window. Null for rows that cover no hardware.
          readOnly: true
        source:
          $ref: "#/components/schemas/std.EntityRef"
          description: The source this row belongs to and draws its term and baseline service tier from. Deleting the source cascades to remove this row.
          readOnly: true
          examples:
          - /asset/v1/coverageSources/7a7b3011-d120-8e06-bb71-94de8e7b8a26
          x-relationship-targets:
          - asset.CoverageSource
        sourceRowKey:
          type: string
          description: "Identity of this row, taken from the source's own row identifier and namespaced by coverage path so that two id spaces can share one column: CVL- followed by the covered line id for contract and subscription coverage, WTY- followed by the instance id for warranty. Both are one-to-one in their own path, so no digest is needed and no row is lost to key collision. The stable key for idempotent upsert, and distinct from the surrogate identifier."
          readOnly: true
          minLength: 1
          maxLength: 128
        startDate:
          type:
          - string
          - "null"
          format: date
          description: Date coverage for this specific target begins. The first covered day is included. This may differ from the source's start date for targets added mid-term. Null if not reported.
          readOnly: true
        status:
          $ref: "#/components/schemas/asset.CoverageStatus"
          description: Lifecycle state of this row as its source reports it, carried verbatim rather than interpreted. For contract coverage this is the covered line's own state.
          readOnly: true
          examples:
          - ACTIVE
          - SIGNED
          - OVERDUE
        sys:
          description: System metadata for soft-deletion and purge lifecycle state.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.StandardSys"
          - type: "null"
        targetIdentifier:
          type:
          - string
          - "null"
          description: Identifier of the thing this row targets, as reported, for INSTANCE the item's instance identifier, otherwise a serial number or a tenant identifier. Retained even after the row resolves to a configuration item, so unresolved rows remain traceable. Null for the account-level target types, which bind no item.
          readOnly: true
          maxLength: 128
        targetType:
          $ref: "#/components/schemas/asset.CoverageTargetType"
          description: Kind of thing this row targets. INSTANCE, SERIAL, UDI and TENANT bind a configuration item; VIRTUAL_ACCOUNT and POOL are account-level quantities with no item and carry their size in the entitled and consumed counts. Installed-base coverage always uses INSTANCE, because the instance identifier is present and unique on every item whereas a serial is not.
          readOnly: true
        type:
          type:
          - string
          - "null"
          description: >-
            Kind of coverage granted. An item holds each kind independently, so it can be license-covered while support-uncovered. Null if the kind is not known.
            SUPPORT covers case handling, hardware replacement, and software downloads at a stated service level. LICENSE covers a subscription or entitlement grant counted against the entitled quantity. WARRANTY grants replacement coverage with a window based on the hardware ship date. EMBEDDED covers support or licensing included in a cloud-managed subscription, with no contract line to reconcile. These examples are not an exhaustive list. Consumers must accept other string values.
          readOnly: true
          maxLength: 128
        warrantyType:
          type:
          - string
          - "null"
          description: Policy code classifying the warranty granted to the target, such as a 90-day limited hardware warranty. Null where the row grants something other than warranty coverage, and on the warranty rows whose source reports a window without classifying it, type, not this field, says whether a row is a warranty. The window is carried in startDate and endDate, as it is for every other coverage type.
          readOnly: true
          maxLength: 64
    asset.CoverageEntitlementOwner:
      type: string
      enum:
      - CISCO_BRANDED
      - COLLABORATIVE_PROFESSIONAL_SERVICES
      - CO_BRANDED
      - PARTNER_BRANDED
      description: "Whose brand an entitlement is delivered under, and therefore whose support organization is answerable to the customer for it. A classification rather than an organization: which partner is involved is reached through `billToLocation`, and the two are independent. New values may be added without a breaking change; consumers should handle unknown values gracefully."
    asset.CoverageLineStatus:
      type: string
      enum:
      - ACTIVE
      - EXPIRED
      - INACTIVE
      description: Coarse validity state of this source's own line, distinct from the agreement it sits under. A line can be terminated under an agreement that is still live, and it is the line that governs whether coverage is in force. New values may be added without a breaking change; consumers should handle unknown values gracefully.
    asset.CoverageLineStatusCode:
      type: string
      enum:
      - ACTIVE
      - ENTERED
      - EXPIRED
      - HOLD
      - OVERDUE
      - SIGNED
      - TERMINATED
      description: Fine-grained validity state of this source's own line as its system reports it, before rollup into `coverageLineStatus`. Values below are those observed on contract service lines. Other source types report different vocabularies, so values will be added as those are onboarded. Read this against `sourceType` and handle unknown values gracefully.
    asset.CoverageListResponse:
      type: object
      description: Collection response containing one page of coverage resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources matching the request, ignoring pagination. Present only when `?count=true` was requested and the request had no pagination cursor.
        items:
          type: array
          description: Array of coverage resources in this paginated response.
          items:
            $ref: "#/components/schemas/asset.Coverage"
      required:
      - items
    asset.CoverageNavigation:
      anyOf:
      - $ref: "#/components/schemas/asset.CoverageNavigationPage"
      - $ref: "#/components/schemas/asset.CoverageRefListResponse"
    asset.CoverageNavigationPage:
      type: object
      description: Link to the relationship endpoint, with an optional expanded page of coverage resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources this member holds, independent of how many items are present in this response. Present only when the request asked for a total.
        href:
          type: string
          format: uri-reference
          description: URL of the relationship endpoint for the containing resource.
        items:
          type: array
          description: Array of coverage resources in this paginated response.
          items:
            $ref: "#/components/schemas/asset.Coverage"
        next:
          type: string
          format: uri-reference
          description: Opaque cursor to pass as `after` to the member endpoint to resume after the last element in items. Absent when items holds the whole member.
      required:
      - href
      additionalProperties: false
    asset.CoverageRefListResponse:
      type: object
      description: A to-many relationship member, holding a bounded set of references to coverage resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources this member holds, independent of how many items are present in this response. Present only when the request asked for a total.
        items:
          type: array
          description: References to the coverage resources in this member. A bounded preview of the member when next is present.
          items:
            $ref: "#/components/schemas/std.EntityRef"
            x-relationship-targets:
            - asset.Coverage
        next:
          type: string
          format: uri-reference
          description: Opaque cursor to pass as `after` to the member endpoint to resume after the last element in items. Absent when items holds the whole member.
      required:
      - items
    asset.CoverageSource:
      type: object
      description: The thing that grants coverage, a service contract, a subscription or enterprise agreement, a product activation key, or the warranty a product carries. Holds the term and the baseline service tier agreed at the source level, together with the parties that pay for and receive it. What the source actually covers is carried on its coverage rows, since one source commonly grants coverage to many targets on differing terms.
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - asset.coverageSource
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        account:
          $ref: "#/components/schemas/std.EntityRef"
          description: The account this entity belongs to. Determines the authorization scope and data partitioning boundary. Every instance of this entity is scoped to exactly one account.
          readOnly: true
          examples:
          - /iam/v1/accounts/5124b04c-4ea0-8811-9055-ba2969895e8e
          x-relationship-targets:
          - iam.Account
        billToLocation:
          $ref: "#/components/schemas/std.EntityRef"
          description: Location this source bills to. The organization using the site is `iam.customerLocation.party`, and the attributed partner is `iam.customerLocation.partner`. Null when no bill-to site can be resolved.
          readOnly: true
          x-relationship-targets:
          - iam.CustomerLocation
        billToName:
          type:
          - string
          - "null"
          description: Name of the party responsible for payment. May differ from the account name when a reseller or channel organization handles billing. Null if not reported.
          readOnly: true
          maxLength: 256
        coverageEntitlementOwner:
          description: "Whose brand this entitlement is delivered under, and therefore whose support organization is answerable to the customer for it.\nA classification, not an organization: which partner is involved is reached through `billToLocation`, and the two are independent. Null when no entitlement brand is available."
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/asset.CoverageEntitlementOwner"
          - type: "null"
        coverageLineNumber:
          type: string
          description: Line number distinguishing this line from the others on the same agreement, a service line on a contract, and the equivalent subdivision on the source types that have one. `sourceIdentifier` holds the agreement's identifier alone, so without this the rows of a multi-line agreement cannot be told apart. Numbered from 1 within an agreement. Sits one grain above `coverage.coveredLineNumber`, which numbers the covered items beneath a single line. `0` for source types that have no line structure is part of this source's natural key, so it is never null or empty, which would leave the coverage source unaddressable by key and let sources without lines duplicate.
          readOnly: true
          minLength: 1
          maxLength: 64
          examples:
          - "0"
          - "1"
          - "2"
        coverageLineStatus:
          description: Coarse validity state of this source's own line, and the field that governs whether the coverage it grants is in force. A line can be terminated under an agreement that is still live, so prefer this over `status` when answering coverage questions. Null until the source event supplies the line status.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/asset.CoverageLineStatus"
          - type: "null"
        coverageLineStatusCode:
          description: The source system's own fine-grained state for this line, carried verbatim alongside `coverageLineStatus` for the same reason its source-level counterpart is. Separates a line that ran to its end date from one canceled early, and a signed line not yet started from one already granting. The coarse value collapses these distinctions. Null where the source system reports no line-level state.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/asset.CoverageLineStatusCode"
          - type: "null"
        coverageTemplate:
          $ref: "#/components/schemas/std.EntityRef"
          description: Catalog offer cited by this service line, with its support tier and Global Service Program details. The offer's `name` is the service short code that the service line cites. Null until the service short code is resolved.
          readOnly: true
          x-relationship-targets:
          - iam.CoverageTemplate
        coverages:
          $ref: "#/components/schemas/asset.CoverageNavigation"
          description: "Rows specifying what this source grants and to which targets. A source typically has one row per covered target, or a single account-level row where it grants a quantity rather than binding items, and a source that grants nothing returns an empty collection rather than being absent. An expired contract service line whose items have moved on is the common case.\nNothing writes this collection. It is the read side of the single foreign key that `coverage.source` holds on the coverage row, so it is resolved per query rather than stored: a one-to-many keeps the key on the child and adds no column to the parent. For contract sources the key is set by matching a covered line's contract identifier and service line identifier together against the header. The contract identifier alone would match every service line on the agreement.\nBeing a collection, it cannot be used as a filter or sort operand. Counting or windowing what a source grants means reading the coverage rows themselves."
          readOnly: true
          examples:
          - href: /api/asset/v1/coverageSources/7a7b3011-d120-8e06-bb71-94de8e7b8a26/coverages
          x-relationship-targets:
          - asset.Coverage
        endDate:
          type:
          - string
          - "null"
          format: date
          description: Date the source's term expires. The last day the term is in force is included, but the first day after it is not. A successor that begins the day after this date therefore continues without a gap; one that begins on this date overlaps for a day. Null if the source has no term.
          readOnly: true
        licensingAccount:
          $ref: "#/components/schemas/std.EntityRef"
          description: Virtual Account this source is booked under, the licensing consumption grain, rather than the Smart Account above it. Null until the account the source reported has been resolved, and for sources that are not booked against the licensing spine at all.
          readOnly: true
          examples:
          - /asset/v1/licensingAccounts/f18f58f9-cb32-8b85-a137-3bbf4b168ce8
          x-relationship-targets:
          - asset.LicensingAccount
        sourceIdentifier:
          $ref: "#/components/schemas/asset.SourceIdentifier"
          description: Identifier used to match this source during ingestion. Warranties are implied by the product rather than ordered, so their identifier is derived from the product and item they cover.
          readOnly: true
        sourceType:
          description: Form this source takes. Determines which of the type-specific attributes apply. Null until the source event supplies its type.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/asset.SourceType"
          - type: "null"
        startDate:
          type:
          - string
          - "null"
          format: date
          description: Date the source's term begins. The first day the term is in force is included. Null if the source has no term.
          readOnly: true
        status:
          description: "Coarse validity state of the source as a whole. Where the source is a contract service line this is the parent agreement's state, not the line's. The line's own state is `coverageLineStatus`, and it is the line that governs whether coverage is in force. The two can disagree: an active agreement routinely carries an expired or terminated line. Use this to tell a lapsed line under a live customer from a closed account, and `coverageLineStatus` to answer whether the target is covered. Null until the source event supplies its status."
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/asset.CoverageSourceStatus"
          - type: "null"
        statusCode:
          description: "The source system's own fine-grained state for the source as a whole, carried verbatim so the normalisation into `status` stays auditable and reversible. Preserves what the rollup discards: SIGNED and OVERDUE both report ACTIVE, while EXPIRED, TERMINATED and ENTERED all report INACTIVE. Null where the source type reports no state of its own. A product-implied warranty has no agreement behind it."
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/asset.CoverageSourceStatusCode"
          - type: "null"
        sys:
          description: System metadata for soft-deletion and purge lifecycle state.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.StandardSys"
          - type: "null"
        webOrderId:
          type:
          - string
          - "null"
          description: Web order identifier a subscription source was placed under. Subscriptions ordered through the web have no enterprise order number, so this is the only order reference they carry. Null for sources ordered through other channels.
          readOnly: true
          maxLength: 128
    asset.CoverageSourceInlineMember:
      type: string
      enum:
      - coverages
    asset.CoverageSourceListResponse:
      type: object
      description: Collection response containing one page of coverageSource resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources matching the request, ignoring pagination. Present only when `?count=true` was requested and the request had no pagination cursor.
        items:
          type: array
          description: Array of coverageSource resources in this paginated response.
          items:
            $ref: "#/components/schemas/asset.CoverageSource"
      required:
      - items
    asset.CoverageSourceStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
      description: "Coarse validity state of the coverage source as a whole, for a contract source, the agreement its service lines hang off. Two values, because the source system for contracts report this as a rollup of the finer `coverageSourceStatusCode`: eight codes collapse into these two, ACTIVE covering ACTIVE, OVERDUE, SIGNED, QA_HOLD and HOLD, and INACTIVE covering EXPIRED, TERMINATED and ENTERED. Read the code alongside it wherever the distinction matters, and read `coverageLineStatus` to establish whether coverage is actually in force. New values may be added without a breaking change as other source types are onboarded; consumers should handle unknown values gracefully."
    asset.CoverageSourceStatusCode:
      type: string
      enum:
      - ACTIVE
      - ENTERED
      - EXPIRED
      - HOLD
      - OVERDUE
      - QA_HOLD
      - SIGNED
      - TERMINATED
      description: Fine-grained validity state of the coverage source as its own system reports it, before rollup into `coverageSourceStatus`. Carries the distinctions the rollup loses, a source that ran to its end date against one canceled early, and one signed but not yet started against one already granting. Values below are those observed on contract sources. Other source types report different vocabularies. Subscription sources emit Active, Expired, Close and Terminated, so values will be added as those are onboarded. Read this against `sourceType` and handle unknown values gracefully.
    asset.CoverageStatus:
      type: string
      enum:
      - ACTIVE
      - EXPIRED
      - OVERDUE
      - SIGNED
      - TERMINATED
      description: "Lifecycle state of an individual coverage row, as its source reports it. Distinct from the source's own validity state, which the parent carries: a source can be ACTIVE while a particular row beneath it is not yet in force. Answering \"is this target covered?\" means reading this together with the row's dates rather than treating any single member as a yes. Only ACTIVE asserts coverage outright, while EXPIRED and TERMINATED answer it negatively on their own. New values may be added without a breaking change; consumers should handle unknown values gracefully.\nThis is a lifecycle axis, not a coverage verdict. It deliberately carries what the source says rather than a computed COVERED / NOT_COVERED, so that SIGNED can be told from ACTIVE and a lapse can be told from a pending renewal. A consumer wanting a plain verdict derives it from this together with the dates."
    asset.CoverageTargetType:
      type: string
      enum:
      - INSTANCE
      - POOL
      - SERIAL
      - TENANT
      - UDI
      - VIRTUAL_ACCOUNT
      description: Kind of thing a coverage row targets. Determines whether the row binds a configuration item or expresses an account-level quantity, so a consumer must read it before treating a null target as missing data. New values may be added without a breaking change; consumers should handle unknown values gracefully.
    asset.DataSource:
      type: object
      description: A system or channel that supplies asset inventory data, such as a management controller, telemetry collector, file feed, or manual import. An asset can have multiple reporting sources. Use the source name and management-system details to identify where its data comes from.
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - asset.dataSource
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        account:
          $ref: "#/components/schemas/std.EntityRef"
          description: The account this entity belongs to. Determines the authorization scope and data partitioning boundary. Every instance of this entity is scoped to exactly one account.
          readOnly: true
          examples:
          - /iam/v1/accounts/5124b04c-4ea0-8811-9055-ba2969895e8e
          x-relationship-targets:
          - iam.Account
        externalId:
          type: string
          description: Identifier assigned to this source by the reporting system. Stable across reports and unique within the account. This differs from id, which identifies the source in this API.
          readOnly: true
          minLength: 1
          maxLength: 128
        kind:
          description: "What kind of channel this is. Determines how much else is known about the source: a CONTROL_PLANE corresponds to a configuration item tracked in the asset inventory, while a file feed or reconciliation pipeline has no network presence at all. Null until the source kind is reported."
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/asset.DataSourceKind"
          - type: "null"
        managementSystemHostname:
          description: Hostname or fully qualified domain name at which the management system is reached. Null if not reported.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.IpOrHostname"
          - type: "null"
        managementSystemId:
          type:
          - string
          - "null"
          description: Identifier of the underlying management system this data source corresponds to, when applicable. Null if not reported.
          readOnly: true
          maxLength: 128
        managementSystemIpAddress:
          description: Management IP address of the system, IPv4 or IPv6. Null if not reported.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.IpAddress"
          - type: "null"
        managementSystemTimezone:
          description: IANA timezone the management system reports its timestamps in. Interprets local times carried in what the source reports. Null if not reported.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.Timezone"
          - type: "null"
        managementSystemType:
          description: Classification of the system that reports the items. Null when no management-system classification is available.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/asset.ManagementSystemType"
          - type: "null"
        name:
          $ref: "#/components/schemas/std.CaseInsensitiveText"
          description: Human-readable name of the data source as reported by the system. Uses the external identifier until a name is reported.
          readOnly: true
          minLength: 1
        sys:
          description: System metadata for schema versioning, change-tracking timestamps, and optimistic-locking token.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.StandardSys"
          - type: "null"
    asset.DataSourceKind:
      type: string
      enum:
      - CONTROL_PLANE
      - FILE_FEED
      - MANUAL_IMPORT
      - RECONCILIATION_PIPELINE
      - TELEMETRY_COLLECTOR
      description: Kind of channel a data source is. Sources differ in whether the reporting system has a network presence at all. A controller does and is tracked as a configuration item, while a file feed or an internal pipeline does not. New values may be added without a breaking change; consumers should handle unknown values gracefully.
    asset.DataSourceListResponse:
      type: object
      description: Collection response containing one page of dataSource resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources matching the request, ignoring pagination. Present only when `?count=true` was requested and the request had no pagination cursor.
        items:
          type: array
          description: Array of dataSource resources in this paginated response.
          items:
            $ref: "#/components/schemas/asset.DataSource"
      required:
      - items
    asset.DataSourceMapping:
      type: object
      description: Association between a data source and a configuration item it reports.
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - asset.dataSourceMapping
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        account:
          $ref: "#/components/schemas/std.EntityRef"
          description: The account this entity belongs to. Determines the authorization scope and data partitioning boundary. Every instance of this entity is scoped to exactly one account.
          readOnly: true
          examples:
          - /iam/v1/accounts/5124b04c-4ea0-8811-9055-ba2969895e8e
          x-relationship-targets:
          - iam.Account
        collectorType:
          description: Type of collector that gathered this item's data for this data source. Identifies the collection method for source reports. Null when the collector type is not reported.
          readOnly: true
          examples:
          - CSPC
          - CXAGENT
          - IQLINK
          anyOf:
          - $ref: "#/components/schemas/asset.CollectorType"
          - type: "null"
        dataSource:
          $ref: "#/components/schemas/std.EntityRef"
          description: The data source that reports the item in this mapping.
          readOnly: true
          examples:
          - /asset/v1/dataSources/a47eda4b-b88e-890f-bf53-00b71b1db14a
          x-relationship-targets:
          - asset.DataSource
        item:
          $ref: "#/components/schemas/std.EntityRef"
          description: The configuration item reported by this data source.
          readOnly: true
          examples:
          - /asset/v1/physicalAssets/f8760922-9d26-8d3b-8ab9-de5b18681336
          - /asset/v1/virtualAssets/036c11bb-30a0-8772-a9a9-bdd54cf0e744
          x-relationship-targets:
          - asset.PhysicalAsset
          - asset.VirtualAsset
        sys:
          description: System metadata for schema versioning, change-tracking timestamps, and optimistic-locking token.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.StandardSys"
          - type: "null"
        telemetryRecordId:
          type:
          - string
          - "null"
          description: Identifier of the raw telemetry record reported for this item by this data source. Use it to trace the item to the original record during troubleshooting. Null when no reference is reported.
          readOnly: true
          maxLength: 128
    asset.DataSourceMappingListResponse:
      type: object
      description: Collection response containing one page of dataSourceMapping resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources matching the request, ignoring pagination. Present only when `?count=true` was requested and the request had no pagination cursor.
        items:
          type: array
          description: Array of dataSourceMapping resources in this paginated response.
          items:
            $ref: "#/components/schemas/asset.DataSourceMapping"
      required:
      - items
    asset.DataSourceMappingNavigation:
      anyOf:
      - $ref: "#/components/schemas/asset.DataSourceMappingNavigationPage"
      - $ref: "#/components/schemas/asset.DataSourceMappingRefListResponse"
    asset.DataSourceMappingNavigationPage:
      type: object
      description: Link to the relationship endpoint, with an optional expanded page of dataSourceMapping resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources this member holds, independent of how many items are present in this response. Present only when the request asked for a total.
        href:
          type: string
          format: uri-reference
          description: URL of the relationship endpoint for the containing resource.
        items:
          type: array
          description: Array of dataSourceMapping resources in this paginated response.
          items:
            $ref: "#/components/schemas/asset.DataSourceMapping"
        next:
          type: string
          format: uri-reference
          description: Opaque cursor to pass as `after` to the member endpoint to resume after the last element in items. Absent when items holds the whole member.
      required:
      - href
      additionalProperties: false
    asset.DataSourceMappingRefListResponse:
      type: object
      description: A to-many relationship member, holding a bounded set of references to dataSourceMapping resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources this member holds, independent of how many items are present in this response. Present only when the request asked for a total.
        items:
          type: array
          description: References to the dataSourceMapping resources in this member. A bounded preview of the member when next is present.
          items:
            $ref: "#/components/schemas/std.EntityRef"
            x-relationship-targets:
            - asset.DataSourceMapping
        next:
          type: string
          format: uri-reference
          description: Opaque cursor to pass as `after` to the member endpoint to resume after the last element in items. Absent when items holds the whole member.
      required:
      - items
    asset.FunctionalRoleTaxonomy:
      type: object
      description: One selectable role option for the manual role override picker. Each resource pairs a functional role with the architecture, technology, and sub-technology it belongs to, and the software type of item it applies to. A caller building the override picker for an item filters role options by that item's `softwareType`, then offers the matching options' `functionalRole` values as the choices for `criticality.overriddenRole`.
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - asset.functionalRoleTaxonomy
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        architecture:
          type: string
          description: Top-level category `functionalRole` is classified under.
          readOnly: true
          minLength: 1
          maxLength: 64
          examples:
          - Enterprise
          - Data Center
          - Service Provider
        functionalRole:
          type: string
          description: Operational function classified by this role option's `architecture`, `technology`, `subTechnology`, and `softwareType` categories.
          readOnly: true
          minLength: 1
          maxLength: 50
          examples:
          - Catalyst SD-WAN edge
          - Route reflector
          - DC core
        softwareType:
          $ref: "#/components/schemas/std.SoftwareType"
          description: Software type category that `functionalRole` is classified under, and the value a caller matches against the item's own `softwareType` to find applicable role options.
          readOnly: true
          examples:
          - IOS-XE
          - IOS XR
          - NX-OS
        subTechnology:
          type: string
          description: Sub-technology category under `technology` that `functionalRole` is classified under.
          readOnly: true
          maxLength: 128
          examples:
          - Software Defined Wide Area Network
          - Traditional Enterprise
          - Wireless
        sys:
          $ref: "#/components/schemas/std.ProvisionedSys"
          description: System metadata for provisioning state.
          readOnly: true
        technology:
          type: string
          description: Technology category under `architecture` that `functionalRole` is classified under.
          readOnly: true
          maxLength: 64
          examples:
          - Enterprise Network
          - Data Center Networking
          - Data Center Compute
    asset.FunctionalRoleTaxonomyListResponse:
      type: object
      description: Collection response containing one page of functionalRoleTaxonomy resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources matching the request, ignoring pagination. Present only when `?count=true` was requested and the request had no pagination cursor.
        items:
          type: array
          description: Array of functionalRoleTaxonomy resources in this paginated response.
          items:
            $ref: "#/components/schemas/asset.FunctionalRoleTaxonomy"
      required:
      - items
    asset.Item:
      type: object
      description: "Abstract base for any managed configuration item tracked in the asset inventory, physical hardware, virtual machines, services, and logical network constructs alike. Concrete subtypes (for example [physicalAsset](#/components/schemas/asset.physicalAsset)) carry form-factor-specific fields and declare their own natural-key identity schemes. The concrete-type discriminator (`_type`) identifies the subtype of each item. This item is the inventory resource and the target for coverage and risk exposure. An advisory or field notice is published reference data, and its exposure row identifies the item that is affected."
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
          examples:
          - asset.physicalAsset
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        assetOrigin:
          description: Who produced this item, independent of where it runs. Total observed inventory filters on `assetTier` alone; the Cisco installed base additionally filters on CISCO, which is what separates Cisco hardware from the third-party and provider-native resources the same families can hold. A Cisco virtual appliance running on a cloud provider is CISCO, not CLOUD_NATIVE. UNKNOWN means the producer cannot be determined. This field applies to every item family; `physicalAsset.vendor` identifies the manufacturer of hardware rather than its origin classification. Null while a placeholder has no confirmed producer classification.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/asset.AssetOrigin"
          - type: "null"
        assetTier:
          description: "Whether this item is counted as installed base or exists only to reference it. Fixed by the item's family: physical, virtual, and service items are SUBSTRATE; control planes and logical aggregates are OVERLAY. Inventory totals filter on this rather than enumerating families, and excluding OVERLAY is what keeps a controller from being counted alongside the devices it manages. Null while an identity-only placeholder has no confirmed item tier."
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/asset.AssetTier"
          - type: "null"
        billToLocation:
          $ref: "#/components/schemas/std.EntityRef"
          description: Location billed for this item, where invoices go, not where the equipment sits. The organization billed is `iam.customerLocation.party`, and the attributed partner is `iam.customerLocation.partner`. Null when no bill-to site use can be resolved.
          readOnly: true
          x-relationship-targets:
          - iam.CustomerLocation
        children:
          $ref: "#/components/schemas/asset.ItemNavigation"
          description: Items contained within this item (for example line cards, modules, power supplies). Empty for leaf or standalone items.
          readOnly: true
          examples:
          - href: /api/asset/v1/items/7e00a03d-c392-8ebf-bc72-cac213d3001f/children
          x-relationship-targets:
          - asset.PhysicalAsset
          - asset.VirtualAsset
        coverages:
          $ref: "#/components/schemas/asset.CoverageNavigation"
          description: "Coverage rows that cover this configuration item. Rows are never merged: an item holds one per source line and kind of coverage, so an active contract and a signed future contract granting the same kind are two rows, each carrying its own term, status, and quantities. This is what lets support and software rights be answered independently, and what preserves the contract and line a support case has to cite. The rolled-up tier across these rows is on `effectiveEntitlementTier`. Empty for an uncovered item."
          readOnly: true
          examples:
          - href: /api/asset/v1/items/7e00a03d-c392-8ebf-bc72-cac213d3001f/coverages
          x-relationship-targets:
          - asset.Coverage
        criticality:
          description: Role and importance classification for this item. The asset criticality pipeline computes it by default; set its overriddenRole/overriddenImportance fields to take manual control. Null until the pipeline has classified the item or a caller has set an override.
          anyOf:
          - $ref: "#/components/schemas/asset.AssetCriticality"
          - type: "null"
        dataSourceMappings:
          $ref: "#/components/schemas/asset.DataSourceMappingNavigation"
          description: The mappings that identify each data source that reports this item.
          readOnly: true
          examples:
          - href: /api/asset/v1/items/7e00a03d-c392-8ebf-bc72-cac213d3001f/dataSourceMappings
          x-relationship-targets:
          - asset.DataSourceMapping
        deploymentModel:
          type:
          - string
          - "null"
          description: Delivery and operation model of this item (for example on-prem, hosted, cloud-managed, saas).
          readOnly: true
          maxLength: 64
        effectiveEntitlementTier:
          $ref: "#/components/schemas/std.EntityRef"
          description: "The [entitlementTier](#/components/schemas/iam.entitlementTier) this item's account coverage grants. Determines which features are available. Only ACTIVE coverage rows whose type is not WARRANTY contribute their stored `entitlementTier`. A Partner account uses grants for every service brand. Every other account uses a grant only when its source has a Cisco-branded coverage template. The item uses the highest contributing tier by catalog ordinal. It uses the No Support floor when no grant qualifies. The template's own tier does not replace a stored coverage grant. This field is null until the application first derives it, or if the resolved tier row is later deleted."
          readOnly: true
          examples:
          - /iam/v1/entitlementTiers/904e671c-856c-84c6-a2fa-d8a61e2b89cb
          x-relationship-targets:
          - iam.EntitlementTier
        externalRef:
          description: Canonical URL or managed-object reference for this item in an external system. Null when the item has no external reference.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.Uri"
          - type: "null"
        installedAt:
          $ref: "#/components/schemas/std.EntityRef"
          description: Location where this item is installed. The organization using the site is `iam.customerLocation.party`, and the attributed partner is `iam.customerLocation.partner`. Null when no site use can be resolved.
          readOnly: true
          x-relationship-targets:
          - iam.CustomerLocation
        isManaged:
          type: boolean
          description: Whether this item is actively managed and monitored. Unmanaged items appear in inventory but do not generate alerts or consume telemetry collection resources.
          readOnly: true
        lastReconciledAt:
          type:
          - string
          - "null"
          format: date-time
          description: When this item's identity and attributes were last confirmed. Null when the item has not been reconciled.
          readOnly: true
        lastTelemetryAt:
          type:
          - string
          - "null"
          format: date-time
          description: When this item last sent telemetry successfully. Used to detect stale or unreachable items. Null if the item has never reported telemetry.
          readOnly: true
        parent:
          $ref: "#/components/schemas/std.EntityRef"
          description: Parent item in a containment hierarchy. Null for standalone or top-level items. When set, this item is a component installed in the parent.
          readOnly: true
          examples:
          - /asset/v1/physicalAssets/f8760922-9d26-8d3b-8ab9-de5b18681336
          - /asset/v1/virtualAssets/036c11bb-30a0-8772-a9a9-bdd54cf0e744
          x-relationship-targets:
          - asset.PhysicalAsset
          - asset.VirtualAsset
        product:
          $ref: "#/components/schemas/std.EntityRef"
          description: >-
            The product represented by this item. An item is one deployed unit or instance of that product, while the product describes the kind of thing it is. Null when the item's product has not been identified.
            Carries the product classification, family, and owning business unit. It also tells whether deployed units have serial numbers and can be serviced. Read it before assuming an item corresponds to countable hardware.
          readOnly: true
          examples:
          - /product/v1/products/7de87c3f-0f21-8dbb-953f-0cfa06ecfd52
          x-relationship-targets:
          - product.Product
        productId:
          type:
          - string
          - "null"
          description: >-
            Orderable product identifier for the product represented by this item. Carries the same value used by the `product` relationship, so the identifier remains available when that relationship is null.
            Held on every item rather than on the physical form alone because virtual appliances and subscribed services can also represent products. On physical assets this is distinct from `model`, which is the hardware model identifier.
            Null when the item's product has not been identified.
          readOnly: true
          maxLength: 64
        reconciliationStatus:
          $ref: "#/components/schemas/asset.ReconciliationStatus"
          description: Reconciliation state for this item's identity and attributes.
          readOnly: true
        softwareEndOfLifeBulletin:
          $ref: "#/components/schemas/std.EntityRef"
          description: End-of-life announcement covering the software release this item runs. Null where the release has not been retired, or where the reported version has not been resolved against the bulletins. Resolution honors the bulletin's scoping fields, so an unresolved version is not the same as an unretired one.
          readOnly: true
          examples:
          - /product/v1/softwareEndOfLifeBulletins/3ebd0947-d998-8ffd-9828-97e45237bef5
          x-relationship-targets:
          - product.SoftwareEndOfLifeBulletin
        softwarePatchVersion:
          type: string
          description: Patch or maintenance level applied on top of the base version. Empty when no separate patch level is reported. Never null, so unpatched versions can be grouped consistently by operating system type and version.
          readOnly: true
          maxLength: 128
          examples:
          - ""
          - SMU-1
        softwareType:
          description: Operating system type this item runs. Determines which advisory databases and software end-of-life bulletins apply. Null when no software type is available.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.SoftwareType"
          - type: "null"
        softwareVersion:
          type:
          - string
          - "null"
          description: Base software version currently running on this item. Format varies by platform. Null when no software version is available.
          readOnly: true
          maxLength: 128
          examples:
          - 17.9.4
          - 9.3(10)
        status:
          type:
          - string
          - "null"
          description: >-
            Operational lifecycle state of this configuration item. Null if the state is not known. The default is UNKNOWN.
            ACTIVE means the item is in service and operational. INACTIVE means the item is in inventory but is powered off, staged, or held as a spare. DECOMMISSIONED means the item is retired from service and no longer managed, but retained for history and audit. UNKNOWN means the operational state has not been determined. These examples are not an exhaustive list. Consumers must accept other string values.
          readOnly: true
          maxLength: 128
        sys:
          description: System metadata for soft-deletion and purge lifecycle state.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.StandardSys"
          - type: "null"
        tags:
          type: object
          description: Key-value labels attached to this item. Customers own the entries whose key does not start with cisco. and send only those entries. Cisco platform callers own the entries whose key starts with cisco. A customer write keeps stored Cisco platform entries, and a Cisco platform write keeps stored customer entries. Customer entries and Cisco platform entries share one declared entry limit, including stored entries retained by the write.
          maxProperties: 60
          additionalProperties:
            type: string
