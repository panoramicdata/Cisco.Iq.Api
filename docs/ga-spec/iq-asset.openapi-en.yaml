          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        allocatedServiceGroup:
          type:
          - string
          - "null"
          description: Allocated service group for this offer.
          maxLength: 64
          examples:
          - SMART NET TOTAL CARE
        businessProcessName:
          type:
          - string
          - "null"
          description: Business process that owns this offer. Null when the catalog does not name one.
