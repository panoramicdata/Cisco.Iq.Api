    iam.ApiKeyPolicy:
      type: object
      description: "Account-level limits applied when an [apiKey](#/components/schemas/iam.apiKey) is created. Account creation adds one policy with default limits. An administrator can update its values within the allowed limits. The policy cannot be created or deleted through the public API, and each account has exactly one policy."
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - iam.apiKeyPolicy
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        account:
          $ref: "#/components/schemas/std.EntityRef"
          description: The account this entity belongs to. Determines the authorization scope and data partitioning boundary. Every instance of this entity is scoped to exactly one account.
          readOnly: true
          examples:
          - /iam/v1/accounts/5124b04c-4ea0-8811-9055-ba2969895e8e
          x-relationship-targets:
          - iam.Account
        defaultKeyDuration:
          type: string
          format: duration
          description: Lifetime assigned when a key-creation request omits `expiresAt`. It cannot exceed `maxKeyDuration`.
          x-default: P90D
          x-maximum: P365D
          x-minimum: P1D
        maxKeyDuration:
          type: string
          format: duration
          description: Longest lifetime the account permits for a newly created key, capped by this field's maximum.
          x-default: P365D
          x-maximum: P365D
          x-minimum: P1D
        maxKeysPerAccount:
          type: integer
          format: int32
          description: Maximum number of unrevoked, unexpired keys held across every user and service account in the account. A new key must satisfy this limit and `maxKeysPerPrincipal`. Uses this field's default when omitted and must remain within its minimum and maximum.
          minimum: 1
          maximum: 1000
        maxKeysPerPrincipal:
          type: integer
          format: int32
          description: Maximum number of unrevoked, unexpired keys one user or service account may own. Accepts a value from 1 through 10 and defaults to 5.
          minimum: 1
          maximum: 10
        sys:
          type: object
          description: System metadata for provisioning state.
          readOnly: true
          properties:
            createdAt:
              type: string
              format: date-time
              description: When this entity was created. Set automatically by the server and never updated after that. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
            ownership:
              $ref: "#/components/schemas/std.Ownership"
              description: Who owns this instance. SYSTEM instances require an explicit platform role exception for updates by account principals and cannot be deleted by them. CUSTOM instances are created by an account.
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              description: When this entity was last modified. Updated automatically on every write operation. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
