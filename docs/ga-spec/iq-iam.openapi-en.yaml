    iam.ApiKeyStatus:
      type: string
      enum:
      - ACTIVE
      - DISABLED
      - EXPIRED
      - REVOKED
      description: "Server-managed authentication state of an [apiKey](#/components/schemas/iam.apiKey). New keys start active, can be disabled and activated, scheduled expiration changes due keys to expired, and revocation permanently invalidates a key."
    iam.ApiKeyType:
      type: string
      enum:
      - BEARER
      description: "Credential technology for an [apiKey](#/components/schemas/iam.apiKey). BEARER keys authenticate API requests through the Authorization header. The type is immutable."
    iam.AuditAction:
      type: string
      enum:
      - CREATED
      - DELETED
      - LOGIN
      - LOGOUT
      - SESSION_EXPIRED
      - UPDATED
      description: "The action recorded in an [AuditRecord](#/components/schemas/iam.AuditRecord)."
    iam.AuditReason:
      type: string
      enum:
      - ABSOLUTE_TIMEOUT
      - IDLE_TIMEOUT
      - SESSION_REPLACED
      - USER_INITIATED
      description: "Why the action recorded in an [AuditRecord](#/components/schemas/iam.AuditRecord) occurred, where the action alone does not say."
    iam.AuditRecord:
      type: object
      description: "An immutable record of one audited action: a create, update, or delete performed on a tracked entity, or an authentication event that began or ended a session. Created automatically, a mutation record when changeTracking is enabled on the target entity, and an authentication record at each session transition. Captures the action, the actor (when known), the account, request metadata, and for a mutation, the set of field-level changes."
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - iam.auditRecord
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        account:
          $ref: "#/components/schemas/std.EntityRef"
          description: The account this entity belongs to. Determines the authorization scope and data partitioning boundary. Every instance of this entity is scoped to exactly one account.
          readOnly: true
          examples:
          - /iam/v1/accounts/5124b04c-4ea0-8811-9055-ba2969895e8e
          x-relationship-targets:
          - iam.Account
        action:
          $ref: "#/components/schemas/iam.AuditAction"
          description: The action this record describes, a mutation of the target entity, or an authentication event on the target session.
          readOnly: true
        changes:
          type:
          - array
          - "null"
          description: "The set of field-level changes the action made. Each entry captures the field name, previous value, and new value. A CREATED action gives each field that it wrote, a DELETED action gives each field that the removed entity held, and an UPDATED action gives only the fields that moved. No action gives system fields, such as the identifier, the system metadata, or the modification timestamp. Empty when the action moved only those fields and nothing the caller sent. Null only when the action was not asked to report its changes, which is a different statement from an empty array: null says nothing was captured, empty says capture found nothing to report. Always null for an authentication action, which reports no changes at all. A session's own fields are never copied here."
          readOnly: true
          items:
            $ref: "#/components/schemas/iam.FieldChange"
        credentialType:
          description: The kind of credential that proved the identity of the principal who performed the action. Null when no credential proved it, such as for a system action or an account provisioning pass. `performedBy` names who acted; this names what they presented to act.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/iam.CredentialType"
          - type: "null"
        identityProvider:
          $ref: "#/components/schemas/std.EntityRef"
          description: "The [identityProvider](#/components/schemas/iam.identityProvider) that authenticated the principal for the session this action concerns. Null on every mutation record, whatever credential authenticated the request, and on an authentication record whose provider has since been removed. A session always names a provider, so a null here never means the sign-in used none."
          readOnly: true
          examples:
          - /iam/v1/identityProviders/ae90eb84-1730-8ec8-bbdf-d78812d174ff
          x-relationship-targets:
          - iam.IdentityProvider
        performedAt:
          type: string
          format: date-time
          description: The instant when the audited action was performed. This is the action timestamp, not the persistence timestamp of the audit record itself. Used as the primary sort key for audit queries.
          readOnly: true
        performedBy:
          $ref: "#/components/schemas/std.EntityRef"
          description: "The [principal](#/components/schemas/iam.principal) (user or service account) who performed the action. Null when the actor is not a principal the trail can name, a request processed without authentication, a non-interactive writer such as ingestion or a reconciler, or account provisioning. Such an action is attributed to its account alone."
          readOnly: true
          examples:
          - /iam/v1/serviceAccounts/00964b6c-d1c7-815c-b094-ddd0ac876c2c
          - /iam/v1/users/2bde4094-0439-8b9f-8653-da15ed0bba5f
          x-relationship-targets:
          - iam.ServiceAccount
          - iam.User
        reason:
          description: Why the action occurred, where the action alone does not say. Set on a logout, which may be a sign-out or a replacement, and on a session expiry, which may be an idle or an absolute timeout. Null on every other action, including a login and any mutation, because the action and the request that caused it are already a complete statement.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/iam.AuditReason"
          - type: "null"
        relationshipChanges:
          type:
          - array
          - "null"
          description: The set of links that the action added or removed. Each entry names the relationship and the entity on the other side. A CREATED action gives the links that it added, a DELETED action gives the links that the removed entity held, and an UPDATED action gives only the links that changed. Empty when the action moved no links. Null only when the action was not asked to report its changes, on the same terms as changes, and always null for an authentication action.
          readOnly: true
          items:
            $ref: "#/components/schemas/iam.RelationshipChange"
        requestId:
          type:
          - string
          - "null"
          description: Correlation identifier for the action, taken from the W3C trace context. Enables tracing an audit record back to the request or background pass that caused it, and joining it to the log lines and error responses that carry the same identifier. A caller can select the value. Send a traceparent header, and its trace identifier becomes this value. Send none, and the response returns the server's value in a traceparent header. A background pass has no request, and starts its own trace, so its records carry that pass rather than a null. Null only when no trace was active.
          readOnly: true
          maxLength: 128
          examples:
          - 4bf92f3577b34da6a3ce929d0e0e4736
        sourceAddress:
          description: IP address of the client that initiated the request. Null when the action was triggered by an internal system process (e.g., a scheduled job or async event handler), and null on an authentication record written on behalf of another region, where the only observed address names that region rather than the principal.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.IpAddress"
          - type: "null"
        summary:
          type: string
          description: Human-readable summary of the action (e.g., "Updated 3 fields on Asset serial ABC123"). Generated automatically.
          readOnly: true
          maxLength: 512
        sys:
          description: System metadata for payload schema versioning.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.SchemaVersionedSys"
          - type: "null"
        targetId:
          type: string
          description: Identifier of the entity the action was performed on, the entity that was created, updated, or deleted, or the session that was begun or ended. Retained after that entity is deleted, so the record continues to name what it describes.
          readOnly: true
        targetType:
          type: string
          description: Namespace-qualified type of the entity the action was performed on. Required to resolve targetId, which is only unique within a type. An authentication action names the session.
          readOnly: true
          maxLength: 128
          examples:
          - asset.physicalAsset
          - iam.user
          - iam.session
        userAgent:
          description: HTTP User-Agent header value from the originating request. Null when unavailable, when the action was triggered by an internal process, or on an authentication record written on behalf of another region, where the owning region has no user agent of its own to name. On that relayed case it follows sourceAddress, which is null for the same reason.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.UserAgent"
          - type: "null"
    iam.AuditRecordListResponse:
      type: object
      description: Collection response containing one page of auditRecord resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources matching the request, ignoring pagination. Present only when `?count=true` was requested and the request had no pagination cursor.
        items:
          type: array
          description: Array of auditRecord resources in this paginated response.
          items:
            $ref: "#/components/schemas/iam.AuditRecord"
      required:
      - items
    iam.AuthorizationRuleSet:
      type: object
      description: Authorization rules stored directly in a Role instead of in a separate Policy. The rule set names the resources it covers and contains the rules that allow or deny actions on those resources.
      properties:
        description:
          type:
          - string
          - "null"
          description: Optional human-readable text explaining the purpose, contents, or context of this entity instance. Set and maintained by users or administrators, not auto-generated.
          maxLength: 8192
        name:
          $ref: "#/components/schemas/std.CaseInsensitiveText"
          description: Human-readable display name. Name comparisons and sorting ignore case. An entity that declares name as a unique key rejects case-only duplicates. Used for display in dashboards, search results, and reports.
          minLength: 1
        resources:
          type: array
          description: Names that identify the resources covered by every rule in this set. Use `entity:asset.physicalAsset` for one entity type, `entity:asset.*` for every entity type whose name starts with `asset.`, `interface:iam.accountScoped` for entity types that belong to an account, or `*` for actions that do not operate on one entity type. Multiple entries are alternatives. Role-attached rules also require membership in the ResourceGroups of the assignment through which they apply.
          items:
            $ref: "#/components/schemas/std.ResourceSelectorUrn"
        rules:
          type: array
          description: Rules that allow or deny actions. Rule order is for readability; evaluation uses all matching rules. The rule set applies only while its containing Role is active. It counts as one access grant. In a system-defined Role, it is an alternative to other system-defined grants. In a user-defined Role, a set with at least one matching `ALLOW` is a separate requirement. A set with only matching `DENY` rules does not add a grant requirement, but a true `DENY` can still block access. For a list, an `ALLOW` returns only resources that pass the rule set's resource and condition checks. A `DENY` removes resources whose resource and condition checks pass. The selected assignment's ResourceGroups limit both ALLOW and DENY resource checks.
          items:
            $ref: "#/components/schemas/iam.PolicyRule"
    iam.BeGeoId:
      type: string
      pattern: "^.*\\S.*$"
      description: Business-entity geography identifier used to identify a partner organization.
      minLength: 1
      maxLength: 64
    iam.CreateAccountRequest:
      type: object
      description: Writable fields accepted when creating a account resource.
      properties:
        beGeoId:
          description: Business-entity geography identifier used to verify the initial users and access levels for a PARTNER Account. Required and nonblank for PARTNER; absent for CUSTOMER and PLATFORM_ADMIN.
          anyOf:
          - $ref: "#/components/schemas/iam.BeGeoId"
          - type: "null"
        bootstrapUser:
          description: Bootstrap contact email recorded at Account creation, normalized to lowercase by the creation flow. Self-service Customer Accounts derive it from the verified creator. A Platform Operator supplies it for a Customer Account. Platform Operator Partner creation selects a PSS Partner Administrator email when available, otherwise a PSS Partner Viewer email. This selection does not grant administrator access. Null when no supported PSS user is available or for PLATFORM_ADMIN Accounts. It cannot change after Account creation.
          anyOf:
          - $ref: "#/components/schemas/std.EmailAddress"
          - type: "null"
        collationPreferences:
          type: array
          description: Ordered list of text collation preferences for this account. Each entry identifies an ICU locale whose collation rules IQ pre-provisions (locale-aware indexes, search analyzers) so that queries can request locale-correct text sorting and comparison. Exactly one entry should be marked as default; if none is marked, the first entry is treated as default. When empty, text sorting uses the account's defaultLocale or the default collation.
          maxItems: 10
          items:
            $ref: "#/components/schemas/std.CollationPreference"
        defaultLocale:
          $ref: "#/components/schemas/std.Locale"
          default: en-US
          description: Primary locale for this account, used for UI language, message localization, date and number formatting, and as the fallback collation when no explicit collation is specified in queries. Defaults to the IQ locale (`en-US`) when omitted. Set by the account administrator during onboarding or in account settings.
        kind:
          $ref: "#/components/schemas/iam.AccountKind"
          default: CUSTOMER
          description: Determines the Account's business and administrative semantics. CUSTOMER owns and uses resources directly. PARTNER synchronizes users and roles through PSS. PLATFORM_ADMIN holds regional platform operator users and policies. Defaults to CUSTOMER when omitted.
        name:
          $ref: "#/components/schemas/std.CaseInsensitiveText"
          description: Display name of this administrative boundary.
          minLength: 1
        partnerType:
          $ref: "#/components/schemas/iam.PartnerType"
          default: NOT_APPLICABLE
          description: IQ-owned operating model for this Account. Partner Accounts use BRANDED when the partner owns and administers the Partner Account or RESELL when the partner does not. Other Accounts use NOT_APPLICABLE.
        tags:
          type: object
          description: Key-value labels attached to this account. Customers own the entries whose key does not start with cisco. and send only those entries. Cisco platform callers own the entries whose key starts with cisco., such as the asset management rollout entry. A customer write keeps stored Cisco platform entries, and a Cisco platform write keeps stored customer entries. Customer entries and Cisco platform entries share one declared entry limit, including stored entries retained by the write.
          maxProperties: 60
          additionalProperties:
            type: string
    iam.CreateApiKeyRequest:
      type: object
      description: Writable fields accepted when creating a apiKey resource.
      properties:
        description:
          type:
          - string
          - "null"
          description: Explanation of the API client's purpose and expected use. Helps administrators identify a key during access reviews and rotation.
          maxLength: 8192
        displayName:
          type: string
          description: Human-readable display label for this entity. Used in UI pickers, audit records, and search results. Concise and suitable for use in compact list views.
          maxLength: 256
        expiresAt:
          type: string
          format: date-time
          description: Time after which authentication with this key is rejected. It must be in the future and within the account policy's lifetime limit.
        keyType:
          $ref: "#/components/schemas/iam.ApiKeyType"
          default: BEARER
          description: Authentication method fixed when the key is created. BEARER keys authenticate API requests with an opaque token.
        owner:
          $ref: "#/components/schemas/std.EntityRef"
          description: Human user or service account authenticated by this key. The owner belongs to the same account and cannot be changed.
          examples:
          - /iam/v1/serviceAccounts/00964b6c-d1c7-815c-b094-ddd0ac876c2c
          - /iam/v1/users/2bde4094-0439-8b9f-8653-da15ed0bba5f
          x-relationship-targets:
          - iam.ServiceAccount
          - iam.User
        roleAssignment:
          $ref: "#/components/schemas/iam.RoleAssignmentInput"
          description: The Role and ResourceGroups authorized when the key was issued. At creation, the owner must hold this Role or its corresponding built-in Administrator Role with the same ResourceGroups or a superset in one complete assignment. Requests use this assignment independently of the owner's current role assignments. The selected Role's current Policies apply.
      required:
      - roleAssignment
    iam.CreatePartnerAccessRequest:
      type: object
      description: Writable fields accepted when creating a partnerAccess resource.
      properties:
        beGeoId:
          $ref: "#/components/schemas/iam.BeGeoId"
          description: Business Entity Geography ID (BeGeoId) that Cisco Partner Self Service uses to identify this partner.
        customerContactSharingEnabled:
          type: boolean
          default: false
          description: Set this to `true` to share your account administrators' names and email addresses with the users IQ added for this partner. Their assigned policies still limit what they can see. The default is `false`.
      required:
      - beGeoId
    iam.CreatePolicyRequest:
      type: object
      description: Writable fields accepted when creating a policy resource.
      properties:
        description:
          type:
          - string
          - "null"
          description: Explanation of why the Policy exists, which resources and actions it covers, and what access it permits or limits.
          maxLength: 8192
        name:
          $ref: "#/components/schemas/std.CaseInsensitiveText"
          description: "Human-readable name of the policy. Examples: 'Account Isolation', 'Scope & Entitlement', 'US-West Asset Restriction'."
          minLength: 1
        resources:
          type: array
          description: Names that identify the resources covered by every rule in this Policy. Use `entity:asset.physicalAsset` for one entity type, `entity:asset.*` for every entity type whose name starts with `asset.`, `interface:iam.accountScoped` for entity types that belong to an account, or `*` for actions that do not operate on one entity type. Multiple entries are alternatives. Role-attached rules also require membership in the ResourceGroups of the assignment through which they apply.
          items:
            $ref: "#/components/schemas/std.ResourceSelectorUrn"
        rules:
          type: array
          description: Rules that allow or deny actions. Each rule can choose callers, name actions, and provide a true-or-false CEL condition. Rule order is for readability; evaluation uses every matching rule. A user-defined Policy with at least one matching `ALLOW` is one separate access requirement. A Policy with only matching `DENY` rules does not add a grant requirement, but a true `DENY` can still block access. When attached to a Role, ALLOW and DENY resource checks also require that assignment's ResourceGroup membership.
          items:
            $ref: "#/components/schemas/iam.PolicyRule"
        slug:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*[a-zA-Z0-9]$
          description: Stable programmatic identifier, unique within the entity's natural scope. Immutable after creation. Used in API references, configuration, and policy expressions where a human-readable but rename-safe key is needed. It starts and ends with a letter or number. The interior may contain letters, numbers, dots, underscores, and hyphens. System-defined slugs use inverse DNS form.
          minLength: 2
          maxLength: 256
          examples:
          - accountAdministrator
          - viewer
          - com.cisco.iq.account-administrator
    iam.CreateRoleRequest:
      type: object
      description: Writable fields accepted when creating a role resource.
      properties:
        description:
          type:
          - string
          - "null"
          description: "Explanation of the role's purpose and the level of access it grants. Helps administrators understand the role when assigning it to users. Examples: 'Full administrative access to all resources', 'Read-only access to asset inventory'."
          maxLength: 8192
        inlinePolicies:
          type:
          - array
          - "null"
          description: Policy rule sets stored directly in this Role instead of as separate Policies. Each rule set names the resources and actions it covers and contains rules that allow or deny access. The rule sets apply only while this Role is active. System-defined and user-defined Roles can contain them.
          items:
            $ref: "#/components/schemas/iam.AuthorizationRuleSet"
        name:
          $ref: "#/components/schemas/std.CaseInsensitiveText"
          description: "Human-readable name of the role. Must be unique within an account for custom roles. System-defined roles use consistent names across all accounts. Examples: 'Administrator', 'Asset Viewer', 'Contract Manager'."
          minLength: 1
        policies:
          type: array
          description: Policies evaluated while this Role is active. An access-grant Policy can permit an action. A system-defined Role can also use a resource-constraint Policy, which can only limit access permitted by another Policy. A matching `DENY` rule always blocks the matching request or resource.
          examples:
          - - /iam/v1/policies/b456c055-5e02-82d0-adde-a1000bac67ad
          items:
            $ref: "#/components/schemas/std.EntityRef"
            x-relationship-targets:
            - iam.Policy
          x-relationship-targets:
          - iam.Policy
        slug:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*[a-zA-Z0-9]$
          description: Stable programmatic identifier, unique within the entity's natural scope. Immutable after creation. Used in API references, configuration, and policy expressions where a human-readable but rename-safe key is needed. It starts and ends with a letter or number. The interior may contain letters, numbers, dots, underscores, and hyphens. System-defined slugs use inverse DNS form.
          minLength: 2
          maxLength: 256
          examples:
          - accountAdministrator
          - viewer
          - com.cisco.iq.account-administrator
    iam.CreateServiceAccountRequest:
      type: object
      description: Writable fields accepted when creating a serviceAccount resource.
      properties:
        description:
          type:
          - string
          - "null"
          description: Explanation of what this service account does, who maintains it, and which entities it typically creates or modifies. Helps administrators during access reviews.
          maxLength: 8192
        displayName:
          type: string
          description: Human-readable name for this service account, unique within its account or globally if it has no account. Also its identity key; renaming it changes which service account a name-based lookup resolves to.
          minLength: 1
          maxLength: 256
        email:
          description: Contact or notification address. For users, the login identifier. For service accounts, an optional notification address for alerts and reports.
          anyOf:
          - $ref: "#/components/schemas/std.EmailAddress"
          - type: "null"
        roleAssignments:
          type: array
          description: The optional Role grant for this service account. Supply no more than one assignment. The assignment selects one shared Role. A Viewer assignment can limit its permissions to selected ResourceGroups.
          items:
            $ref: "#/components/schemas/iam.RoleAssignmentInput"
      required:
      - displayName
    iam.CreateUserGroupRequest:
      type: object
      description: Writable fields accepted when creating a userGroup resource.
      properties:
        description:
          type:
          - string
          - "null"
          description: Optional explanation of this group's purpose and membership criteria. Useful for access reviews and onboarding.
          maxLength: 8192
        identityProvider:
          $ref: "#/components/schemas/std.EntityRef"
          description: "[identityProvider](#/components/schemas/iam.identityProvider) that owns the identities referenced by this group. A DYNAMIC group matches only claims from this provider against externalGroupIds. A STATIC group keeps explicit members associated with the same provider. The provider cannot change, and deleting it removes the group."
          examples:
          - /iam/v1/identityProviders/ae90eb84-1730-8ec8-bbdf-d78812d174ff
          x-relationship-targets:
          - iam.IdentityProvider
        members:
          type: array
          description: "Explicit members of this group. STATIC groups use this relationship. DYNAMIC groups compute membership at login from identity provider claims. Only [user](#/components/schemas/iam.user) resources can be members; service accounts are account principals with direct role assignments and cannot be added to identity-provider user groups. Update this relationship to add or remove users from a STATIC group."
          examples:
          - - /iam/v1/users/2bde4094-0439-8b9f-8653-da15ed0bba5f
          items:
            $ref: "#/components/schemas/std.EntityRef"
            x-relationship-targets:
            - iam.User
          x-relationship-targets:
          - iam.User
        membershipType:
          $ref: "#/components/schemas/iam.GroupMembershipType"
          default: STATIC
          description: How members are added to this group. STATIC members are explicitly managed by administrators. DYNAMIC members are determined at login from identity provider claims. Platform Admin seed initialization provisions this form. The mode cannot change.
        name:
          $ref: "#/components/schemas/std.CaseInsensitiveText"
          description: "Human-readable name for this group. Displayed in the UI when managing group membership and role assignments. Examples: 'Platform Administrators', 'Engineering Team', 'US-West Support'."
          minLength: 1
        roleAssignments:
          type: array
          description: The optional Role grant for this user group. Supply no more than one assignment. The assignment selects one shared Role. A Viewer assignment can limit its permissions to selected ResourceGroups.
          items:
            $ref: "#/components/schemas/iam.RoleAssignmentInput"
      required:
      - identityProvider
    iam.CreateUserRequest:
      type: object
      description: Writable fields accepted when creating a user resource.
      properties:
        displayName:
          type: string
          default: ""
          description: Human-readable name for this user. Profile data may be absent at creation time, so an empty display name is valid.
          maxLength: 256
        email:
          $ref: "#/components/schemas/std.EmailAddress"
          description: Primary email address used as the login identifier. Must be non-null and unique within the account. For externally managed users, synchronized from the external system.
          minLength: 1
        groups:
          type: array
          description: "[userGroup](#/components/schemas/iam.userGroup) memberships for this user. Membership is explicitly assigned by admins and limited to groups bound to this user's own [identityProvider](#/components/schemas/iam.identityProvider). The user inherits role assignments from all groups they belong to."
          examples:
          - - /iam/v1/userGroups/365195ac-0ab6-8731-8f00-e9054612c5d8
          items:
            $ref: "#/components/schemas/std.EntityRef"
            x-relationship-targets:
            - iam.UserGroup
          x-relationship-targets:
          - iam.UserGroup
        identityProvider:
          $ref: "#/components/schemas/std.EntityRef"
          description: Logical identity provider that authenticates this user. Administrators can set this binding at creation. Only trusted authentication or identity reconciliation can populate the provider-owned external identifier.
          examples:
          - /iam/v1/identityProviders/ae90eb84-1730-8ec8-bbdf-d78812d174ff
          x-relationship-targets:
          - iam.IdentityProvider
        roleAssignments:
          type: array
          description: The optional Role grant for this user. Supply no more than one assignment. The assignment selects one shared Role. A Viewer assignment can limit its permissions to selected ResourceGroups.
          items:
            $ref: "#/components/schemas/iam.RoleAssignmentInput"
        sendInvite:
          type: boolean
          default: false
          description: Requests a best-effort invitation for a Customer or Partner Account user when true on creation or changed from false to true on update. New PSS users provisioned in a BRANDED Partner Account request an invitation automatically. An existing identity synchronized into Forge does not request an invitation. After a delivery attempt, this value returns to false regardless of the delivery result. Set it to true to request another invitation. Delivery requires email notification to be enabled.
      required:
      - email
    iam.CredentialType:
      type: string
      enum:
      - API_KEY
      - SESSION
      - WORKLOAD_IDENTITY
      description: "The kind of credential that proved a principal's identity for the request an [AuditRecord](#/components/schemas/iam.AuditRecord) describes."
    iam.DiscoveredPartner:
      type: object
      description: An active onboarded partner identified by the Customer Account's coverage-source bill-to locations. Both BRANDED and RESELL partners can appear. Discovery does not grant access.
      properties:
        assetCount:
          type: integer
          format: int32
          description: Number of distinct covered assets attributed to this partner.
          minimum: 1
        beGeoId:
          $ref: "#/components/schemas/iam.BeGeoId"
          description: Partner business-entity geography identifier.
        linked:
          type: boolean
          description: Whether this Customer Account currently has Partner Access for the partner.
          readOnly: true
        numberOfUsers:
          type: integer
          format: int32
          description: Number of current Partner Self-Service users in the Partner Account.
          minimum: 0
        partnerName:
          type: string
          description: Display name of the onboarded Partner Account.
          minLength: 1
          maxLength: 256
      required:
      - assetCount
      - beGeoId
      - linked
      - numberOfUsers
      - partnerName
    iam.EntitlementTier:
      type: object
      description: "An entitlement tier that defines which IQ features an asset can use. Tiers are ordered. Each assessment declares which tiers permit access to its findings and their recommendations. Entitlement is established through business records ([coverage](#/components/schemas/asset.coverage)) and determines which IQ features are available for an asset.\nOrdering is defined by the `ordinal` field. Higher ordinals represent higher tiers."
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - iam.entitlementTier
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        description:
          type: string
          description: Explanation of what this tier includes and how it differs from adjacent tiers. Displayed in entitlement dashboards and onboarding flows.
          readOnly: true
          maxLength: 8192
        name:
          $ref: "#/components/schemas/std.CaseInsensitiveText"
          description: Human-readable display name of this entitlement tier (e.g., 'Basic', 'Standard', 'Signature'). May be renamed by product management without affecting integrations. External systems reference tiers by slug, not name.
          readOnly: true
          minLength: 1
        ordinal:
          type: integer
          format: int32
          description: Numeric rank that defines tier ordering. Higher ordinals represent higher tiers and determine the highest qualifying coverage tier. Assessment result access uses the assessment's explicit supportTiers rather than an ordinal threshold.
          readOnly: true
        slug:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*[a-zA-Z0-9]$
          description: "Stable programmatic identifier for this entitlement tier. Immutable after creation. Used in contract records, feature gating rules, and API references. Format: lowerCamelCase."
          readOnly: true
          minLength: 2
          maxLength: 256
          examples:
          - basic
          - standard
          - signature
        sys:
          type: object
          description: System metadata for provisioning state.
          readOnly: true
          properties:
            createdAt:
              type: string
              format: date-time
              description: When this entity was created. Set automatically by the server and never updated after that. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
            ownership:
              $ref: "#/components/schemas/std.Ownership"
              description: Who owns this instance. SYSTEM instances require an explicit platform role exception for updates by account principals and cannot be deleted by them. CUSTOM instances are created by an account.
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              description: When this entity was last modified. Updated automatically on every write operation. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
    iam.EntitlementTierListResponse:
      type: object
      description: Collection response containing one page of entitlementTier resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources matching the request, ignoring pagination. Present only when `?count=true` was requested and the request had no pagination cursor.
        items:
          type: array
          description: Array of entitlementTier resources in this paginated response.
          items:
            $ref: "#/components/schemas/iam.EntitlementTier"
      required:
      - items
    iam.FieldChange:
      type: object
      description: A single field-level change captured during a write. Records the field path, the kind of change, and the values on each side in their own JSON form, so consumers can display change diffs and build audit trails.
      properties:
        changeType:
          $ref: "#/components/schemas/iam.FieldChangeType"
          description: Whether the field gained a value, moved from one value to another, or lost the value it held.
        fieldPath:
          type: string
          description: Dot-delimited path to the modified field. Top-level fields use their lowerCamelCase name. Nested fields within value types use dot notation. Array elements use bracket-index notation.
          examples:
          - status
          - installedAt.countryCode
          - tags[2]
          - tags[2].value
        newValue:
          description: The field value after the change, in its own JSON form. Null when the field was cleared, when an array element was removed, or when the value was withheld. Check valueRedacted to tell those apart.
        previousValue:
          description: The field value before the change, in its own JSON form. Null when the field held no value, when an array element was added, or when the value was withheld. Check valueRedacted to tell those apart.
        valueRedacted:
          type: boolean
          description: True when the field holds a secret, so the values on both sides are withheld. The path and the change type are still recorded, so the audit trail shows that the secret changed without disclosing it. This field has no default; each change record states whether its value was redacted.
    iam.FieldChangeType:
      type: string
      enum:
      - ADDED
      - MODIFIED
      - REMOVED
      description: "How a field moved in an [FieldChange](#/components/schemas/iam.FieldChange)."
    iam.GroupMembershipType:
      type: string
      enum:
      - DYNAMIC
      - STATIC
      description: "How members are added to a [userGroup](#/components/schemas/iam.userGroup). Membership is either managed explicitly by IAM administrators or derived from identity provider group claims at login."
    iam.IdentityProvider:
      type: object
      description: Logical identity system associated with users and sessions. The provider is provisioned from deployment-managed OIDC configuration and used to authenticate users. User external identifiers correlate verified identities with the provider; entity identifiers keep relationships stable when email changes.
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - iam.identityProvider
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        account:
          $ref: "#/components/schemas/std.EntityRef"
          description: The account this entity belongs to. Determines the authorization scope and data partitioning boundary. Every instance of this entity is scoped to exactly one account.
          readOnly: true
          examples:
          - /iam/v1/accounts/5124b04c-4ea0-8811-9055-ba2969895e8e
          x-relationship-targets:
          - iam.Account
        description:
          type:
          - string
          - "null"
          description: Optional explanation of this identity provider for administrators. Useful for documenting the external system this connects to.
          readOnly: true
          maxLength: 8192
        enabled:
          type: boolean
          description: Whether this identity provider accepts logins. When false, users cannot authenticate via this provider. Existing sessions are not terminated, but new logins are rejected. Use for maintenance or to disable without deleting config.
          readOnly: true
        name:
          $ref: "#/components/schemas/std.CaseInsensitiveText"
          description: "Human-readable name shown in the login UI. Examples: 'Corporate SSO'."
          readOnly: true
          minLength: 1
        slug:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*[a-zA-Z0-9]$
          description: Stable URL-safe identifier for this logical identity provider.
          readOnly: true
          minLength: 2
          maxLength: 256
          examples:
          - accountAdministrator
          - viewer
          - com.cisco.iq.account-administrator
        sys:
          type: object
          description: System metadata for provisioning state.
          readOnly: true
          properties:
            createdAt:
              type: string
              format: date-time
              description: When this entity was created. Set automatically by the server and never updated after that. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
            ownership:
              $ref: "#/components/schemas/std.Ownership"
              description: Who owns this instance. SYSTEM instances require an explicit platform role exception for updates by account principals and cannot be deleted by them. CUSTOM instances are created by an account.
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              description: When this entity was last modified. Updated automatically on every write operation. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
    iam.IdentityProviderListResponse:
      type: object
      description: Collection response containing one page of identityProvider resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources matching the request, ignoring pagination. Present only when `?count=true` was requested and the request had no pagination cursor.
        items:
          type: array
          description: Array of identityProvider resources in this paginated response.
          items:
            $ref: "#/components/schemas/iam.IdentityProvider"
      required:
      - items
    iam.PartnerAccess:
      type: object
      description: >-
        Use Partner Access to control a partner's access to your account. You can link or unlink the partner and control sharing of your account administrators' names and email addresses. Partner users can read and list assets permitted by the Partner Access policy. You need account administrator permissions to make these changes.
        Add Partner Access after you select a partner associated with your assets or service contracts. Creating Partner Access links the partner immediately. Contact sharing is off by default.
        When you create Partner Access, IQ maps the imported users' partner roles to Partner Resell roles and manages the attached policies. Read this resource's `users` relationship to see who IQ added. The partner manages its users and roles in PSS. IQ imports the users returned by PSS when you create Partner Access. Delete Partner Access to unlink the partner and remove the users IQ added for that link.
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - iam.partnerAccess
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        account:
          $ref: "#/components/schemas/std.EntityRef"
          description: The account this entity belongs to. Determines the authorization scope and data partitioning boundary. Every instance of this entity is scoped to exactly one account.
          readOnly: true
          examples:
          - /iam/v1/accounts/5124b04c-4ea0-8811-9055-ba2969895e8e
          x-relationship-targets:
          - iam.Account
        beGeoId:
          $ref: "#/components/schemas/iam.BeGeoId"
          description: Business Entity Geography ID (BeGeoId) that Cisco Partner Self Service uses to identify this partner.
        customerContactSharingEnabled:
          type: boolean
          description: Set this to `true` to share your account administrators' names and email addresses with the users IQ added for this partner. Their assigned policies still limit what they can see. The default is `false`.
        partnerName:
          type:
          - string
          - "null"
          description: Name IQ copied from the active Partner Account when this Partner Access was created.
          readOnly: true
          minLength: 1
          maxLength: 256
        sys:
          description: System metadata for schema versioning, change-tracking timestamps, and optimistic-locking token.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.StandardSys"
          - type: "null"
        users:
          $ref: "#/components/schemas/iam.UserNavigation"
          description: Users imported from PSS when you created this Partner Access. This collection is read-only; deleting the link removes these users. Follow each user's `roleAssignments[].role` references to see their Partner Resell role, then that role's `policies` relationship to inspect its IQ-managed policies. The partner manages these users and roles in Cisco Partner Self Service.
          readOnly: true
          examples:
          - href: /api/iam/v1/partnerAccesses/febd1efe-2914-8717-9d29-5b4d89760d5e/users
          x-relationship-targets:
          - iam.User
      required:
      - beGeoId
      - customerContactSharingEnabled
      - partnerName
    iam.PartnerAccessInlineMember:
      type: string
      enum:
      - users
    iam.PartnerAccessListResponse:
      type: object
      description: Collection response containing one page of partnerAccess resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources matching the request, ignoring pagination. Present only when `?count=true` was requested and the request had no pagination cursor.
        items:
          type: array
          description: Array of partnerAccess resources in this paginated response.
          items:
            $ref: "#/components/schemas/iam.PartnerAccess"
      required:
      - items
    iam.PartnerDiscoveryResponse:
      type: object
      description: Every distinct onboarded partner ordered by BeGeoId. An empty list means no active onboarded partner matches the Account's available coverage evidence.
      properties:
        items:
          type: array
          description: Every matching active onboarded partner, one per BeGeoId and ordered by BeGeoId.
          items:
            $ref: "#/components/schemas/iam.DiscoveredPartner"
      required:
      - items
    iam.PartnerType:
      type: string
      enum:
      - BRANDED
      - NOT_APPLICABLE
      - RESELL
      description: IQ-owned classification of how a Partner Account is presented and used. New values may be added as additional partner operating models are supported.
    iam.Policy:
      type: object
      description: >-
        A named set of rules that controls access. A Policy names the resources and actions it covers, the callers it applies to, and the true-or-false conditions that must pass. An access grant can permit an action. A resource constraint cannot permit an action; it can only constrain access granted elsewhere.
        IQ supplies `SYSTEM` Policies, which account administrators cannot change. `CUSTOM` Policies are created within an account and can be attached to Roles. Ownership controls who can manage the Policy.
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - iam.policy
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        account:
          $ref: "#/components/schemas/std.EntityRef"
          description: The account that owns this Policy. Null if the Policy has no account.
          readOnly: true
          examples:
          - /iam/v1/accounts/5124b04c-4ea0-8811-9055-ba2969895e8e
          x-relationship-targets:
          - iam.Account
        description:
          type:
          - string
          - "null"
          description: Explanation of why the Policy exists, which resources and actions it covers, and what access it permits or limits.
          maxLength: 8192
        name:
          $ref: "#/components/schemas/std.CaseInsensitiveText"
          description: "Human-readable name of the policy. Examples: 'Account Isolation', 'Scope & Entitlement', 'US-West Asset Restriction'."
          minLength: 1
        resources:
          type: array
          description: Names that identify the resources covered by every rule in this Policy. Use `entity:asset.physicalAsset` for one entity type, `entity:asset.*` for every entity type whose name starts with `asset.`, `interface:iam.accountScoped` for entity types that belong to an account, or `*` for actions that do not operate on one entity type. Multiple entries are alternatives. Role-attached rules also require membership in the ResourceGroups of the assignment through which they apply.
          items:
            $ref: "#/components/schemas/std.ResourceSelectorUrn"
        rules:
          type: array
          description: Rules that allow or deny actions. Each rule can choose callers, name actions, and provide a true-or-false CEL condition. Rule order is for readability; evaluation uses every matching rule. A user-defined Policy with at least one matching `ALLOW` is one separate access requirement. A Policy with only matching `DENY` rules does not add a grant requirement, but a true `DENY` can still block access. When attached to a Role, ALLOW and DENY resource checks also require that assignment's ResourceGroup membership.
          items:
            $ref: "#/components/schemas/iam.PolicyRule"
        slug:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*[a-zA-Z0-9]$
          description: Stable programmatic identifier, unique within the entity's natural scope. Immutable after creation. Used in API references, configuration, and policy expressions where a human-readable but rename-safe key is needed. It starts and ends with a letter or number. The interior may contain letters, numbers, dots, underscores, and hyphens. System-defined slugs use inverse DNS form.
          minLength: 2
          maxLength: 256
          examples:
          - accountAdministrator
          - viewer
          - com.cisco.iq.account-administrator
        sys:
          type: object
          description: System metadata for soft-deletion and purge lifecycle state.
          readOnly: true
          properties:
            createdAt:
              type: string
              format: date-time
              description: When this entity was created. Set automatically by the server and never updated after that. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
            ownership:
              $ref: "#/components/schemas/std.Ownership"
              description: Who owns this instance. SYSTEM instances require an explicit platform role exception for updates by account principals and cannot be deleted by them. CUSTOM instances are created by an account.
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              description: When this entity was last modified. Updated automatically on every write operation. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
    iam.PolicyEffect:
      type: string
      enum:
      - ALLOW
      - DENY
      description: Says whether a rule supports access or blocks access when it covers the current caller, resource, and action and its condition is true. A Policy with a constraint group adds a required limit. A Policy without a constraint group can grant access.
    iam.PolicyListResponse:
      type: object
      description: Collection response containing one page of policy resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources matching the request, ignoring pagination. Present only when `?count=true` was requested and the request had no pagination cursor.
        items:
          type: array
          description: Array of policy resources in this paginated response.
          items:
            $ref: "#/components/schemas/iam.Policy"
      required:
      - items
    iam.PolicyRefListResponse:
      type: object
      description: A to-many relationship member, holding a bounded set of references to policy resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources this member holds, independent of how many items are present in this response. Present only when the request asked for a total.
        items:
          type: array
          description: References to the policy resources in this member. A bounded preview of the member when next is present.
          items:
            $ref: "#/components/schemas/std.EntityRef"
            x-relationship-targets:
            - iam.Policy
        next:
          type: string
          format: uri-reference
          description: Opaque cursor to pass as `after` to the member endpoint to resume after the last element in items. Absent when items holds the whole member.
      required:
      - items
    iam.PolicyRule:
      type: object
      description: One rule in a Policy. The effect says whether the rule allows or denies access. The optional principal selector chooses callers. The actions name the operations covered by the rule. The condition is a Common Expression Language (CEL) test that returns true or false for the request or resource. OPERATION_ACCESS is the default rule type. MEMBER_EXCLUSION rules remove fields or relationships from API access using fixed request values or scalar values on the resource. The declared type, not the condition or action catalog, determines the rule's purpose.
      properties:
        actions:
          type: array
          description: "Action names or patterns covered by this rule. An action is a named operation. The part before `:` says what happens, and the part after `:` names the target. For example, `read:asset.physicalAsset` reads a physical asset, `update:asset.physicalAsset.tags` updates its tags, and `add:iam.userGroup.members` adds a user to a group. Use an exact [Action](#/components/schemas/iam.Action) name or a pattern containing `*`. `read:*` matches all read actions, `*:asset.*` matches all actions whose target starts with `asset.`, and `*` matches all actions. In an `ALLOW` rule from a Policy without a constraint group, a wildcard does not include actions reserved for trusted internal services. Account users and services cannot perform a reserved internal action even when a rule names it exactly. MEMBER_EXCLUSION DENY selectors for readable or writable model members may use read, create, or update without a stored Action record for each member. Direct member paths may traverse value types. A read selector may also cross a singular relationship on the resource to a concrete entity, then select an accessible field or value-type field path on that target. It cannot cross another relationship or select a target relationship. Related create and update selectors are unsupported. The source resource supplies self for the condition; the exclusion applies only through that relationship. A direct member read denial also blocks client writes. Member exclusions prevent observation of hidden values through queries. Create and update member denials restrict only that input usage. Member wildcard expansion is not supported."
          uniqueItems: true
          items:
            type: string
        condition:
          $ref: "#/components/schemas/std.CelPredicate"
          description: A true-or-false Common Expression Language (CEL) test. Use `ctx.*` to read verified values that stay fixed for the request, such as the account or caller ID. Use `self.*` to read the resource currently being checked. A condition that does not use `self` can be checked before data is read. For an OPERATION_ACCESS list check, a true `ALLOW` condition provides one possible way to return a row, while a true `DENY` condition removes it. A read of one resource uses the same test against that resource. Supported mutations also enforce applicable resource conditions before they commit. Actions that do not operate on a resource may use `ctx`, but they cannot use `self`. MEMBER_EXCLUSION conditions may read scalar resource fields, including scalars within singular value types and through one singular relationship to a concrete entity. Related values are private condition inputs and do not grant access to the related resource. A matching condition hides the selected members in that resource's response. For a related member selector, self remains the source resource and the matching condition hides target fields only in that relationship occurrence. Expanded response projections support this restriction. Filters, grouping dimensions, and aggregation expressions cannot reference related fields whose visibility depends on the source instance. Root sort planning omits inaccessible related fields. Top-level query filters and scalar grouping dimensions can use conditionally excluded fields on their entity, including fields within singular value types. Only resources where every field referenced by the filter and grouping dimensions is readable participate. Counts and groups describe that subset. A readable null may form a null group; a resource that hides the grouping field contributes to no group. Top-level filters may also use conditionally excluded scalar fields on collections of concrete entities reached directly from the root. Every related resource that the caller can read must permit each referenced collection field before the root participates in the query. Each per-aggregation filter has its own readable subset. It may use conditionally excluded scalar fields on the root resource, including fields within singular value types, and on collections of concrete entities reached directly from that resource. Every related resource that the caller can read must permit each referenced collection field. An unreadable field excludes the root resource from that aggregation before its filter is evaluated, including OR, NOT, and collection predicates. Other aggregations keep their own subsets. Other query expressions cannot use potentially hidden values. Direct-member client writes are rejected when the condition matches the stored or final resource. Creates check only the final resource. MEMBER_EXCLUSION conditions do not support multiple relationship hops, polymorphic targets, collection traversal, whole-object reads, or scope membership.
          examples:
          - self.account.id == ctx.auth.account.id
          - self.id == ctx.auth.principal.id
          - self.sys.ownership == 'SYSTEM'
          - "true"
        effect:
          $ref: "#/components/schemas/iam.PolicyEffect"
          description: What the rule does when it covers the current caller, resource, and action and its condition is true. In a Policy without a constraint group, `ALLOW` makes this rule one way to permit the action. In a Policy with a constraint group, `ALLOW` says that the request or resource passes one required limit; a separate access grant must still permit the action. `DENY` blocks the request or resource even if another rule allows it. Each active assignment's ResourceGroups limit its attached rules to matching resources. A MEMBER_EXCLUSION DENY instead removes that member from API access; it does not grant entity access. A supported top-level filter or scalar grouping dimension on a conditionally excluded field omits resources where that field is hidden. A supported per-aggregation filter omits those resources only from its own aggregation.
        principals:
          description: Optional claims used to choose which callers this rule applies to. If omitted, the rule does not filter callers by claim. A Policy that is not in a mandatory Policy set must be attached to the caller's active Role.
          anyOf:
          - $ref: "#/components/schemas/iam.PrincipalSelector"
          - type: "null"
        type:
          description: The rule's purpose. Defaults to OPERATION_ACCESS when omitted or null. OPERATION_ACCESS rules authorize cataloged operations and retain their resource conditions. MEMBER_EXCLUSION rules support only DENY and subtract exact model members from client input, query, or response access. Conditions may read scalar resource fields and singular value-type fields. A member restriction does not add an operation denial, even when that member has a cataloged action.
          anyOf:
          - $ref: "#/components/schemas/iam.PolicyRuleType"
          - type: "null"
    iam.PolicyRuleType:
      type: string
      enum:
      - MEMBER_EXCLUSION
      - OPERATION_ACCESS
      description: The purpose of a policy rule and how its result is enforced.
    iam.PrincipalSelector:
      type: object
      description: Chooses which authenticated users or software a rule applies to. A claim is a verified fact about the caller that IQ adds to the request after authentication. Each listed claim without `!` must be present. Each claim that starts with `!` must be absent. If a rule omits this value, it does not filter callers by claim.
      properties:
        claims:
          type: array
          description: Verified facts that a caller must have or must not have. Every entry without `!` must be present in the authenticated request. Prefix an entry with `!` to require that claim to be absent. Matching is exact. Wildcards, surrounding spaces, duplicate entries, and conflicting entries such as `example` with `!example` are not allowed.
          uniqueItems: true
          examples:
          - - principal:tenanted
          - - principal:tenanted
            - principal_type:user
          - - "!platform:system_control"
          items:
            type: string
    iam.PrincipalStatus:
      type: string
      enum:
      - ACTIVE
      - DISABLED
      - PENDING
      description: "Lifecycle state for a [principal](#/components/schemas/iam.principal). Shared by User and ServiceAccount. Controls whether the principal can authenticate and perform API actions."
    iam.PrincipalType:
      type: string
      enum:
      - SERVICE
      - USER
      description: "Discriminator for the concrete subtype of a [principal](#/components/schemas/iam.principal). Set automatically at creation time, USER for [user](#/components/schemas/iam.user), SERVICE for [serviceAccount](#/components/schemas/iam.serviceAccount)."
    iam.Region:
      type: object
      description: A customer-visible account routing and data-residency region. A Region identifies the geographic theater in which an Account is provisioned. Infrastructure configuration maps the Region to the physical cloud deployment used by each environment.
      properties:
