          maxLength: 8192
        identityProvider:
          $ref: "#/components/schemas/std.EntityRef"
          description: "[identityProvider](#/components/schemas/iam.identityProvider) that owns the identities referenced by this group. A DYNAMIC group matches only claims from this provider against externalGroupIds. A STATIC group keeps explicit members associated with the same provider. The provider cannot change, and deleting it removes the group."
          examples:
