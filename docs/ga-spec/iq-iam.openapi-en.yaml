            - iam.User
          x-relationship-targets:
          - iam.User
        membershipType:
          $ref: "#/components/schemas/iam.GroupMembershipType"
          default: STATIC
          description: How members are added to this group. STATIC members are explicitly managed by administrators. DYNAMIC members are determined at login from identity provider claims. Platform Admin seed initialization provisions this form. The mode cannot change.
        name:
          $ref: "#/components/schemas/std.CaseInsensitiveText"
          description: "Human-readable name for this group. Displayed in the UI when managing group membership and role assignments. Examples: 'Platform Administrators', 'Engineering Team', 'US-West Support'."
          minLength: 1
        roleAssignments:
          type: array
