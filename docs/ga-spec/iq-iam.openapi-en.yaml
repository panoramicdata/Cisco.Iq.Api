openapi: 3.2.0
$self: https://iq.cisco.com/api/iam/openapi/iq-iam.openapi-en.yaml
info:
  title: Identity and Access Management API
  summary: Identity, access, accounts, credentials, sessions, and audit events
  description: Manage identity, authentication, authorization, and accounts. Manage users, service accounts, user groups, roles, API keys, sessions, and audit records.
  termsOfService: https://www.cisco.com/c/en/us/about/legal/cloud-and-software.html
  contact:
    name: Cisco IQ Team
    url: https://iq.cisco.com
  license:
    name: Cisco Proprietary
    url: https://www.cisco.com/c/en/us/about/legal.html
  version: 0.1.0
servers:
- url: https://iq.cisco.com/api/iam
  name: cisco-iq
  description: >-
    Global entry point for the Cisco IQ API.
- url: https://us-east-1.iq.cisco.com/api/iam
  name: cisco-iq-us-east-1
  description: >-
    Cisco IQ API hosted in the United States (us-east-1).
- url: https://eu-frankfurt-1.iq.cisco.com/api/iam
  name: cisco-iq-eu-frankfurt-1
  description: >-
    Cisco IQ API hosted in Europe (eu-frankfurt-1).
security:
- bearerAuth: []
tags:
- name: API Keys
  description: API key issuance, rotation, and policy management.
  kind: nav
- name: Authorization
  description: Roles, permissions, role assignments, resource scopes, and data-grant policies.
  kind: nav
- name: Governance
  description: Accounts, regions, entitlements, and audit records.
  kind: nav
- name: Identity
  description: Users, service accounts, groups, sessions, and principal lifecycle management.
  kind: nav
- name: Identity Providers
  description: Logical identity providers for deployment-managed authentication.
  kind: nav
- name: Identity and Access Management
  kind: nav
- name: Identity and Access Management
  kind: nav
- name: deprecated
  description: Deprecated — scheduled for removal in a future release.
  kind: badge
- name: preview
  description: Preview API — subject to breaking changes without notice.
  kind: badge
paths:
  /v1/accounts:
