          minLength: 1
        policies:
          type: array
          description: Policies evaluated while this Role is active. An access-grant Policy can permit an action. A system-defined Role can also use a resource-constraint Policy, which can only limit access permitted by another Policy. A matching `DENY` rule always blocks the matching request or resource.
