  /v1/roles/{id}/policies:
    summary: Policies relationship collection
    description: Sub-resource collection for listing Policies related to the selected Role.
    get:
      operationId: listIamPoliciesForRole
      summary: Policies attached to this role
      description: >-
        A named set of rules that controls access. A Policy names the resources and actions it covers, the callers it applies to, and the true-or-false conditions that must pass. An access grant can permit an action. A resource constraint cannot permit an action; it can only constrain access granted elsewhere.
        IQ supplies `SYSTEM` Policies, which account administrators cannot change. `CUSTOM` Policies are created within an account and can be attached to Roles. Ownership controls who can manage the Policy.
      tags:
      - Authorization
      x-actions:
      - read:iam.role
      parameters:
      - $ref: "#/components/parameters/id"
