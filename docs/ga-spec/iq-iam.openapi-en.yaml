          description: Authentication method fixed when the key is created. BEARER keys authenticate API requests with an opaque token.
        owner:
          $ref: "#/components/schemas/std.EntityRef"
          description: Human user or service account authenticated by this key. The owner belongs to the same account and cannot be changed.
