    iam.Session:
      type: object
      description: "An authenticated user session using one selected role assignment, or combining all eligible current assignments according to its captured login mode. Each assignment pairs a [role](#/components/schemas/iam.role) with its own ResourceGroup scope. Applicable denials take precedence across assignments. Sessions expire after a configurable timeout or when explicitly terminated by the user or an administrator."
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - iam.session
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        account:
          $ref: "#/components/schemas/std.EntityRef"
          description: The account this entity belongs to. Determines the authorization scope and data partitioning boundary. Every instance of this entity is scoped to exactly one account.
          readOnly: true
          examples:
          - /iam/v1/accounts/5124b04c-4ea0-8811-9055-ba2969895e8e
          x-relationship-targets:
          - iam.Account
        channel:
          $ref: "#/components/schemas/iam.SessionChannel"
          description: The client channel through which this session was established. Set at creation time based on the authentication request context. Used for audit classification.
          readOnly: true
        expiresAt:
          type: string
          format: date-time
          description: When this session expires and requires re-authentication. Set by the authentication service from its deployment settings. After expiration, API requests with this session token are rejected.
          readOnly: true
        identityProvider:
          $ref: "#/components/schemas/std.EntityRef"
          description: "The [identityProvider](#/components/schemas/iam.identityProvider) that authenticated this session. Records the logical identity system independently of the active protocol, enabling event correlation, audit trails, and provider-scoped session revocation."
          readOnly: true
          examples:
          - /iam/v1/identityProviders/ae90eb84-1730-8ec8-bbdf-d78812d174ff
          x-relationship-targets:
          - iam.IdentityProvider
        ipAddress:
          $ref: "#/components/schemas/std.IpAddress"
          description: Client IP address at session creation. Captured for audit and security monitoring. Some policies restrict sessions to the originating IP.
          readOnly: true
        lastActivityAt:
          type: string
          format: date-time
          description: Timestamp of the last API request using this session. Updated periodically (not on every request) to support idle timeout policies. Null if no activity since creation.
          readOnly: true
        roleAssignment:
          description: The selected Role grant and its ResourceGroups. Authorization uses this assignment while it remains granted to the owner. Present in single mode, including when one assignment is selected from several eligible grants; null in combined mode.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/iam.RoleAssignment"
          - type: "null"
        sys:
          description: System metadata for schema versioning, change-tracking timestamps, and optimistic-locking token.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.StandardSys"
          - type: "null"
        user:
          $ref: "#/components/schemas/std.EntityRef"
          description: "The [user](#/components/schemas/iam.user) who owns this session. A user may have multiple concurrent sessions (different devices, different role contexts)."
          readOnly: true
          examples:
          - /iam/v1/users/2bde4094-0439-8b9f-8653-da15ed0bba5f
          x-relationship-targets:
          - iam.User
        userAgent:
          $ref: "#/components/schemas/std.UserAgent"
          description: Client user-agent string at session creation. Captured for audit trails and anomaly detection.
          readOnly: true
    iam.SessionChannel:
      type: string
