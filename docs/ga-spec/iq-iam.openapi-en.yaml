        members:
          type: array
          description: "Explicit members of this group. STATIC groups use this relationship. DYNAMIC groups compute membership at login from identity provider claims. Only [user](#/components/schemas/iam.user) resources can be members; service accounts are account principals with direct role assignments and cannot be added to identity-provider user groups. Update this relationship to add or remove users from a STATIC group."
          examples:
