          items:
            $ref: "#/components/schemas/iam.AuthorizationRuleSet"
        name:
          $ref: "#/components/schemas/std.CaseInsensitiveText"
          description: "Human-readable name of the role. Must be unique within an account for custom roles. System-defined roles use consistent names across all accounts. Examples: 'Administrator', 'Asset Viewer', 'Contract Manager'."
          minLength: 1
        policies:
          $ref: "#/components/schemas/iam.PolicyRefListResponse"
          description: Policies evaluated while this Role is active. An access-grant Policy can permit an action. A system-defined Role can also use a resource-constraint Policy, which can only limit access permitted by another Policy. A matching `DENY` rule always blocks the matching request or resource.
          examples:
          - items:
            - /iam/v1/policies/b456c055-5e02-82d0-adde-a1000bac67ad
          x-relationship-targets:
          - iam.Policy
        slug:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*[a-zA-Z0-9]$
          description: Stable programmatic identifier, unique within the entity's natural scope. Immutable after creation. Used in API references, configuration, and policy expressions where a human-readable but rename-safe key is needed. It starts and ends with a letter or number. The interior may contain letters, numbers, dots, underscores, and hyphens. System-defined slugs use inverse DNS form.
          minLength: 2
          maxLength: 256
          examples:
