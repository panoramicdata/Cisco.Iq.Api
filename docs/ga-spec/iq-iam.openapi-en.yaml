  /v1/accounts/by-name/{name}:
    summary: Manage Account by name
    description: Endpoint for creating, replacing, or updating the Account identified by name.
    patch:
      operationId: upsertIamaccountByName
      summary: Create or update Account by name
      description: Merges the supplied fields into the Account identified by name using JSON Merge Patch semantics, or creates it if no matching resource exists.
