    iam.ApiKey:
      type: object
      description: "A credential that lets an API client authenticate as its owning [principal](#/components/schemas/iam.principal). The owner is a human user or a service account and cannot be changed after creation. A user can create a user-owned key only for themselves, including when they are an administrator. An Account Administrator with an assignment that has no ResourceGroups can issue a key for themselves or a service account. An unscoped Partner Administrator can issue keys for service accounts in the same partner account. Every new key, including one created by an administrator, must select a Role held by its owner or the corresponding built-in Viewer Role for a held Administrator Role. Custom Roles must be assigned to the owner. The selected ResourceGroups must be the same or a subset of one complete owner assignment, including for a Viewer reduction. A user can hold the Role directly or through an eligible user group. ResourceGroups from separate assignments cannot be combined. An empty ResourceGroup selection means account-wide access and requires an unscoped owner assignment. A human-owned key can use these administrator permissions; otherwise, it can issue only its own Role or its built-in Viewer reduction with the same or a narrower scope. Service-account-owned keys cannot issue keys. The key's Role and ResourceGroups remain fixed. Before removing a Role directly assigned to a user or service account or narrowing its resource scope, revoke or delete any live key that depends on the removed access. A service account change preserves a key when one proposed assignment covers its Role and ResourceGroups, including a supported built-in Administrator-to-Viewer reduction. A user group assignment change permanently revokes members' affected live keys. The group change and key revocations succeed or fail together. The change preserves a key when one remaining direct or user group assignment fully covers its Role and ResourceGroups. ResourceGroups from separate assignments are not combined to retain a key. Revocation retains each key and its audit history.\nThese checks include disabled keys that have not expired. Permanently revoked and expired keys do not prevent assignment changes. A key whose expiration time has passed is excluded even if its status is still ACTIVE or DISABLED. Changes to the selected Role's Policies still apply.\nA principal can own several independently managed active keys. During rotation, a replacement and the old key may overlap briefly so the client can switch without downtime, after which the old key is revoked.\nAPI keys authenticate requests with bearer tokens."
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - iam.apiKey
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        account:
          $ref: "#/components/schemas/std.EntityRef"
          description: The account this entity belongs to. Determines the authorization scope and data partitioning boundary. Every instance of this entity is scoped to exactly one account.
          readOnly: true
          examples:
          - /iam/v1/accounts/5124b04c-4ea0-8811-9055-ba2969895e8e
          x-relationship-targets:
          - iam.Account
        description:
          type:
          - string
          - "null"
          description: Explanation of the API client's purpose and expected use. Helps administrators identify a key during access reviews and rotation.
          maxLength: 8192
        displayName:
          type: string
          description: Human-readable display label for this entity. Used in UI pickers, audit records, and search results. Concise and suitable for use in compact list views.
          maxLength: 256
        expiresAt:
          type: string
          format: date-time
          description: Time after which authentication with this key is rejected. It must be in the future and within the account policy's lifetime limit.
        keyId:
          type: string
          description: Server-generated identifier used to select this credential during authentication. It is different from the API-key resource ID.
          readOnly: true
        keyType:
          $ref: "#/components/schemas/iam.ApiKeyType"
          description: Authentication method fixed when the key is created. BEARER keys authenticate API requests with an opaque token.
        lastUsedAt:
          type:
          - string
          - "null"
          format: date-time
          description: Most recent successful authentication observed for this key. Null until the key is used.
          readOnly: true
        owner:
          $ref: "#/components/schemas/std.EntityRef"
          description: Human user or service account authenticated by this key. The owner belongs to the same account and cannot be changed.
          examples:
          - /iam/v1/serviceAccounts/00964b6c-d1c7-815c-b094-ddd0ac876c2c
          - /iam/v1/users/2bde4094-0439-8b9f-8653-da15ed0bba5f
          x-relationship-targets:
          - iam.ServiceAccount
          - iam.User
        roleAssignment:
          $ref: "#/components/schemas/iam.RoleAssignment"
          description: The Role and ResourceGroups authorized when the key was issued. At creation, the owner must hold this Role or its corresponding built-in Administrator Role with the same ResourceGroups or a superset in one complete assignment. Requests use this assignment independently of the owner's current role assignments. The selected Role's current Policies apply.
        status:
          $ref: "#/components/schemas/iam.ApiKeyStatus"
          description: Stored authentication state managed by the server. New keys start active, authorized callers can disable or activate unexpired keys, expiration changes active or disabled keys to expired, and revocation changes a key to revoked. It cannot be set directly by an API client.
          readOnly: true
        sys:
          description: System metadata for revocation state and actor attribution.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.RevocableSys"
          - type: "null"
      required:
      - keyId
      - roleAssignment
      - status
