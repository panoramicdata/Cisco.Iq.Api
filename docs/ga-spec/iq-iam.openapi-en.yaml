components:
  schemas:
    RelationshipActionRequest:
      type: object
      description: Named members to add or remove, with optional exact conditions on the member resources.
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            properties:
              expectedEtag:
                type: string
                description: Expected stored token of the referenced member. A stale token fails the complete action, including a membership change that would be a no-op.
                minLength: 1
              ref:
                $ref: "#/components/schemas/std.EntityRef"
            required:
            - ref
            additionalProperties: false
      required:
      - items
      additionalProperties: false
    RelationshipActionResponse:
      type: object
      description: Actual added and removed links and current tokens for resources whose owned state changed.
      properties:
        added:
          type: array
          description: References to links added by this action. Existing links are omitted.
          maxItems: 100
          items:
            $ref: "#/components/schemas/std.EntityRef"
        changed:
          type: array
          description: References and stored tokens of resources whose owned state changed. Unchanged resources are omitted.
          maxItems: 100
          items:
            type: object
            properties:
              etag:
                type: string
                minLength: 1
              ref:
                $ref: "#/components/schemas/std.EntityRef"
            required:
            - ref
            - etag
            additionalProperties: false
        removed:
          type: array
          description: References to links removed by this action. Absent links are omitted.
          maxItems: 100
          items:
            $ref: "#/components/schemas/std.EntityRef"
      required:
      - added
      - removed
      - changed
      additionalProperties: false
    iam.Account:
      type: object
      description: "An administrative boundary for identity, governance, and data residency. The [accountKind](#/components/schemas/iam.accountKind) value determines whether an Account is a Customer, Partner, or platform operator control plane.\nA CUSTOMER or PARTNER owns domain resources, including asset inventory and assessments. In regional deployments, its [region](#/components/schemas/iam.region) identifies the geographic theater where those resources are stored. In on-premises deployments, the Region is absent. Each Account is an independent boundary.\nA PLATFORM_ADMIN holds regional platform operator users and policies. It does not own customer or partner domain resources."
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - iam.account
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        beGeoId:
          description: Business-entity geography identifier used to verify the initial users and access levels for a PARTNER Account. Required and nonblank for PARTNER; absent for CUSTOMER and PLATFORM_ADMIN.
          anyOf:
          - $ref: "#/components/schemas/iam.BeGeoId"
          - type: "null"
        bootstrapUser:
          description: Bootstrap contact email recorded at Account creation, normalized to lowercase by the creation flow. Self-service Customer Accounts derive it from the verified creator. A Platform Operator supplies it for a Customer Account. Platform Operator Partner creation selects a PSS Partner Administrator email when available, otherwise a PSS Partner Viewer email. This selection does not grant administrator access. Null when no supported PSS user is available or for PLATFORM_ADMIN Accounts. It cannot change after Account creation.
          anyOf:
          - $ref: "#/components/schemas/std.EmailAddress"
          - type: "null"
        collationPreferences:
          type: array
          description: Ordered list of text collation preferences for this account. Each entry identifies an ICU locale whose collation rules IQ pre-provisions (locale-aware indexes, search analyzers) so that queries can request locale-correct text sorting and comparison. Exactly one entry should be marked as default; if none is marked, the first entry is treated as default. When empty, text sorting uses the account's defaultLocale or the default collation.
          maxItems: 10
          items:
            $ref: "#/components/schemas/std.CollationPreference"
        defaultLocale:
          $ref: "#/components/schemas/std.Locale"
          description: Primary locale for this account, used for UI language, message localization, date and number formatting, and as the fallback collation when no explicit collation is specified in queries. Defaults to the IQ locale (`en-US`) when omitted. Set by the account administrator during onboarding or in account settings.
        emailDomain:
          description: Normalized domain used to offer this Account when a verified account-creation email has the same exact domain. The match does not establish membership, session authority, or access. Null when no valid domain is available.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/iam.AccountEmailDomain"
          - type: "null"
        kind:
          $ref: "#/components/schemas/iam.AccountKind"
          description: Determines the Account's business and administrative semantics. CUSTOMER owns and uses resources directly. PARTNER synchronizes users and roles through PSS. PLATFORM_ADMIN holds regional platform operator users and policies. Defaults to CUSTOMER when omitted.
        name:
          $ref: "#/components/schemas/std.CaseInsensitiveText"
          description: Display name of this administrative boundary.
          minLength: 1
        partnerType:
          $ref: "#/components/schemas/iam.PartnerType"
          description: IQ-owned operating model for this Account. Partner Accounts use BRANDED when the partner owns and administers the Partner Account or RESELL when the partner does not. Other Accounts use NOT_APPLICABLE.
        region:
          $ref: "#/components/schemas/std.EntityRef"
          description: Account-routing Region for this Account in a regional environment. For CUSTOMER and PARTNER Accounts, the Region stores IAM configuration and domain resources. Null for on-premises environments.
          readOnly: true
          examples:
          - /iam/v1/regions/5efe6988-ae08-8a68-b43f-3069f6495f23
          x-relationship-targets:
          - iam.Region
        status:
          $ref: "#/components/schemas/iam.AccountStatus"
          description: Current lifecycle state of this administrative boundary. Determines whether users can authenticate and whether resources are accessible. Defaults to ACTIVE when the caller omits the value.
          readOnly: true
        sys:
          description: System metadata for soft-deletion and purge lifecycle state.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.StandardSys"
          - type: "null"
        tags:
          type: object
          description: Key-value labels attached to this account. Customers own the entries whose key does not start with cisco. and send only those entries. Cisco platform callers own the entries whose key starts with cisco., such as the asset management rollout entry. A customer write keeps stored Cisco platform entries, and a Cisco platform write keeps stored customer entries. Customer entries and Cisco platform entries share one declared entry limit, including stored entries retained by the write.
          maxProperties: 60
          additionalProperties:
            type: string
    iam.AccountEmailDomain:
      type: string
      pattern: "^([a-z0-9]([a-z0-9\\-]{0,61}[a-z0-9])?\\.)+([a-z]{2,63}|xn--[a-z0-9]([a-z0-9\\-]{0,57}[a-z0-9])?)$"
      description: Lowercase IDNA ASCII email domain used to compare a verified account-creation identity with an Account. Internationalized labels use their ACE/Punycode form. An exact match is an affiliation hint only and does not establish membership or access.
      maxLength: 253
      examples:
      - example.com
      - division.example.org
      - example.xn--p1ai
    iam.AccountKind:
      type: string
      enum:
      - CUSTOMER
      - PARTNER
      - PLATFORM_ADMIN
      description: Business and administrative semantics of an Account. The value determines whether the boundary represents a customer, a partner, or a platform operator control plane.
    iam.AccountListResponse:
      type: object
      description: Collection response containing one page of account resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources matching the request, ignoring pagination. Present only when `?count=true` was requested and the request had no pagination cursor.
        items:
          type: array
          description: Array of account resources in this paginated response.
          items:
            $ref: "#/components/schemas/iam.Account"
      required:
      - items
    iam.AccountStatus:
      type: string
      enum:
      - ACTIVE
      - DEACTIVATED
      - PROVISIONING
      - SUSPENDED
      description: Lifecycle state of an Account. Controls authentication and resource availability.
    iam.Action:
      type: object
      description: "A grantable action in the read-only Action catalog. Each Action instance describes a specific verb on a specific element and can be granted through roles and policies.\nActions are named using the format `verb:element`, where `element` identifies the target at the appropriate level of granularity:\n- **Entity-level**: `verb:namespace.entity`.\n  Example: `update:asset.physicalAsset` authorizes updating a\n  physical asset.\n- **Field-level**: `verb:namespace.entity.field`.\n  Example: `update:asset.physicalAsset.tags` authorizes updating its\n  tags without requiring `update:asset.physicalAsset`.\n- **Relationship-level**: `verb:namespace.entity.relationship`.\n  Example: `add:iam.userGroup.members` authorizes adding users to a group.\n- **Namespace-operation**: `invoke:namespace.operation`.\n  Example: `invoke:system.bulk` authorizes the Bulk operation without\n  granting GraphQL or other System operations.\n- **Service-level**: `verb:namespace.service`.\n  Example: `read:mcp.server` authorizes connecting to an MCP\n  server for discovery and data access.\n- **Tool-level**: `verb:namespace.Tool.tool-name`.\n  Example: `invoke:mcp.Tool.web-search` authorizes invoking\n  the specific `web-search` tool.\n\nUse action names and patterns (including wildcards like `*` and `read:asset.*`) in role policies and policy rules to declare which actions are granted. The Action catalog provides discoverability for policy editors and audit tools. Account principals see consumer-facing SYSTEM actions."
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - iam.action
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        description:
          type:
          - string
          - "null"
          description: Short description of the element this action applies to.
          readOnly: true
          maxLength: 8192
        name:
          $ref: "#/components/schemas/std.CaseInsensitiveText"
          description: "Machine-readable action identifier. Format: 'verb:element' (e.g., 'read:asset.physicalAsset') for entity-level, or 'verb:element.member' (e.g., 'update:asset.physicalAsset.tags') for member-level. Globally unique. Immutable after creation."
          readOnly: true
          minLength: 1
        namespace:
          $ref: "#/components/schemas/std.NamespaceName"
          description: The namespace that owns the element this action applies to (e.g., 'asset', 'iam', 'mcp'). Enables efficient filtering and grouping of actions by domain.
          readOnly: true
          examples:
          - asset
          - iam
          - assessment
          - mcp
        summary:
          type:
          - string
          - "null"
          description: Concise human-readable phrase capturing the action's purpose, suitable for role editors and audit UIs (e.g., "Create new Account records").
          readOnly: true
          maxLength: 256
        sys:
          type: object
          description: System metadata for provisioning state.
          readOnly: true
          properties:
            createdAt:
              type: string
              format: date-time
              description: When this entity was created. Set automatically by the server and never updated after that. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
            ownership:
              $ref: "#/components/schemas/std.Ownership"
              description: Who owns this instance. SYSTEM instances require an explicit platform role exception for updates by account principals and cannot be deleted by them. CUSTOM instances are created by an account.
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              description: When this entity was last modified. Updated automatically on every write operation. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
