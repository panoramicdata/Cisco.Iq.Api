          minimum: 1
          maximum: 1000
        maxKeysPerPrincipal:
          type: integer
          format: int32
          description: Maximum number of unrevoked, unexpired keys one user or service account may own. Accepts a value from 1 through 10 and defaults to 5.
          minimum: 1
          maximum: 10
    iam.UpdateApiKeyRequest:
      type: object
      description: Writable fields accepted when patching a apiKey resource with JSON Merge Patch semantics.
      properties:
        description:
          type:
          - string
          - "null"
          description: Explanation of the API client's purpose and expected use. Helps administrators identify a key during access reviews and rotation.
          maxLength: 8192
        displayName:
          type: string
          description: Human-readable display label for this entity. Used in UI pickers, audit records, and search results. Concise and suitable for use in compact list views.
          maxLength: 256
    iam.UpdatePartnerAccessRequest:
      type: object
      description: Writable fields accepted when patching a partnerAccess resource with JSON Merge Patch semantics.
