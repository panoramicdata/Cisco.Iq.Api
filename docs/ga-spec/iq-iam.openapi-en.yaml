      - Governance
      x-actions:
      - create:iam.account
      - update:iam.account
      parameters:
      - $ref: "#/components/parameters/If-Match"
      - $ref: "#/components/parameters/If-Unmodified-Since"
      - $ref: "#/components/parameters/traceparent"
      requestBody:
        description: Merge-patch payload containing the writable fields to apply when creating or updating the Account resource. Omitted fields are left unchanged; an explicit null clears a field.
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/iam.UpdateAccountRequest"
      responses:
        "200":
          description: Account already existed and was updated with the supplied fields.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
