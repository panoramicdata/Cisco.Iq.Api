      description: Scope of restart required after applying a remediation.
    product.SecurityAdvisory:
      type: object
      description: A published security advisory describing a vulnerability in network products and the product tree published by the vendor or coordinator.
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - product.securityAdvisory
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        advisoryId:
          $ref: "#/components/schemas/std.AdvisoryId"
          description: Advisory identifier string published by the issuing organization. Immutable.
          readOnly: true
          minLength: 1
        advisoryVersion:
          type:
          - string
          - "null"
          description: Version string of the advisory's current revision.
          readOnly: true
          maxLength: 32
        affectedProducts:
          $ref: "#/components/schemas/product.ProductRefListResponse"
          description: Catalog products affected by this security advisory, identified by their product identifiers. This is separate from the advisory's product-tree entries.
          readOnly: true
          examples:
          - items:
            - /product/v1/products/7de87c3f-0f21-8dbb-953f-0cfa06ecfd52
          x-relationship-targets:
          - product.Product
        bugs:
          $ref: "#/components/schemas/product.BugRefListResponse"
          description: Cisco bugs identified by this advisory, including bugs whose details are not yet known. Empty when the advisory identifies no bugs.
          readOnly: true
          examples:
          - items:
            - /product/v1/bugs/75f85f3a-88ed-886e-be07-bb84d8fce6d5
          x-relationship-targets:
          - product.Bug
        bulletinUrl:
          description: URL to the full advisory product. Provides detailed vulnerability description, workarounds, and fixed software versions.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.Url"
          - type: "null"
        details:
          type:
          - string
          - "null"
          description: Detailed explanation of the vulnerability and conditions.
          readOnly: true
          maxLength: 8192
        firstPublishedAt:
          type:
          - string
          - "null"
          format: date-time
          description: When this advisory was first published. Used for tracking advisory age and SLA compliance. Immutable.
          readOnly: true
        headline:
          type:
          - string
          - "null"
          description: Brief headline describing the vulnerability.
          readOnly: true
          maxLength: 1024
        lastRevisedAt:
          type:
          - string
          - "null"
          format: date-time
          description: When this advisory was last updated. Revisions may change severity, affected product lists, or remediation guidance.
          readOnly: true
        products:
          $ref: "#/components/schemas/product.AdvisoryProductNavigation"
          description: Products named by the advisory.
          readOnly: true
          examples:
          - href: /api/product/v1/securityAdvisories/d2210fd4-6098-8f7c-a9aa-e305d442acf1/products
          x-relationship-targets:
          - product.AdvisoryProduct
        publisherCategory:
          description: Category of the organization that published this advisory.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/product.PublisherCategory"
          - type: "null"
        publisherName:
          type:
          - string
          - "null"
          description: Name of the organization that published this advisory.
          readOnly: true
          maxLength: 256
        publisherNamespace:
          description: URI namespace of the publishing organization.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.Url"
          - type: "null"
        references:
          type:
          - array
          - "null"
          description: Related advisory and supporting URLs.
          readOnly: true
          uniqueItems: true
          items:
            $ref: "#/components/schemas/product.BulletinReference"
        revisionHistory:
          type:
          - array
          - "null"
          description: Ordered list of advisory revision history entries.
          readOnly: true
          items:
            $ref: "#/components/schemas/product.AdvisoryRevision"
        severity:
          description: Severity classification based on CVSS v3 base score when assigned. Null when the source advisory does not provide a severity.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/product.AdvisorySeverity"
          - type: "null"
        status:
          description: Publication lifecycle state of the advisory. INTERIM advisories are under active investigation and may change substantially.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/product.AdvisoryStatus"
          - type: "null"
        summary:
          type:
          - string
          - "null"
          description: Summary of the vulnerability and its impact.
          readOnly: true
          maxLength: 8192
        sys:
          type: object
          description: System metadata for provisioning state.
          readOnly: true
          properties:
            createdAt:
              type: string
              format: date-time
              description: When this entity was created. Set automatically by the server and never updated after that. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
            ownership:
              $ref: "#/components/schemas/std.Ownership"
              description: Who owns this instance. SYSTEM instances require an explicit platform role exception for updates by account principals and cannot be deleted by them. CUSTOM instances are created by an account.
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              description: When this entity was last modified. Updated automatically on every write operation. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
        title:
          $ref: "#/components/schemas/std.Title"
          description: Brief summary of the vulnerability. Used in notification emails, reports, and dashboard displays.
          readOnly: true
        vulnerabilities:
          $ref: "#/components/schemas/product.AdvisoryVulnerabilityNavigation"
          description: Vulnerabilities described by the advisory.
          readOnly: true
          examples:
          - href: /api/product/v1/securityAdvisories/d2210fd4-6098-8f7c-a9aa-e305d442acf1/vulnerabilities
          x-relationship-targets:
          - product.AdvisoryVulnerability
    product.SecurityAdvisoryInlineMember:
      type: string
      enum:
      - products
      - vulnerabilities
    product.SecurityAdvisoryListResponse:
      type: object
      description: Collection response containing one page of securityAdvisory resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources matching the request, ignoring pagination. Present only when `?count=true` was requested and the request had no pagination cursor.
        items:
          type: array
          description: Array of securityAdvisory resources in this paginated response.
          items:
            $ref: "#/components/schemas/product.SecurityAdvisory"
      required:
      - items
    product.SoftwareEndOfLifeBulletin:
      type: object
      description: "A software end-of-life bulletin for one set of releases in a published announcement. Each set has its own resource. The bulletin is scoped by software type and major version and narrowed by release train, product family, platform, or module, so resolving a running version against it means honoring every scoping field that is set: `isVersionPattern` decides whether the major version is matched as a prefix or compared for equality, a null maintenance version means every maintenance release of the train is covered rather than that the release is unknown, and `exemptProductFamilies` must be subtracted from whatever the bulletin otherwise covers."
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - product.softwareEndOfLifeBulletin
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        bulletinNumber:
          description: Number of the published announcement. One announcement can cover several release sets, so this number can be shared by several bulletin resources. Null until announcement details are available.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/product.BulletinNumber"
          - type: "null"
        bulletinUrl:
          description: Link to the published bulletin, which carries the upgrade guidance and any conditions attached to the milestone dates. Null when no bulletin link is available.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.Url"
          - type: "null"
        exemptProductFamilies:
          type:
          - array
          - "null"
          description: Hardware families explicitly excluded from the retirement. Subtracted from the covered set, so a consumer that ignores it will retire families the bulletin does not cover. Null where the source names no exemptions.
          readOnly: true
          items:
            type: string
        isVersionPattern:
          type: boolean
          description: Whether `majorSoftwareVersion` is a prefix to match rather than a version to compare. Set on resources that retire a whole numbering line, such as every release beginning '12.'. A consumer that tests for equality without honoring this will silently miss every resource it is set on.
          readOnly: true
        maintenanceVersion:
          type:
          - string
          - "null"
          description: Maintenance release this resource retires within its train, such as the '52' in IOS 12.2(52)SE. Null on most resources, where the retirement is published against the whole train. In that case every maintenance release of the train is covered, so a null must be read as 'any' rather than as 'unknown'.
          readOnly: true
          maxLength: 64
          examples:
          - "52"
          - "7"
        majorSoftwareVersion:
          type:
          - string
          - "null"
          description: Major version being retired, such as '12.2'. Second component of the version a consumer resolves against. Holds a version prefix rather than a version where `isVersionPattern` is set, so it cannot be compared for equality without checking that flag first. Null where the resource is scoped by family or platform alone.
          readOnly: true
          maxLength: 64
          examples:
          - "12.2"
          - "15.1"
          - "12."
        milestones:
          description: Dated lifecycle milestones for the covered releases. Null until lifecycle dates are available.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/product.EndOfLifeSchedule"
          - type: "null"
        moduleProductIds:
          type:
          - array
          - "null"
          description: Modules the retirement applies to, identified by product identifier. Present where a release is retired for a card or service module rather than for a whole platform. Null where the resource names no modules.
          readOnly: true
          items:
            $ref: "#/components/schemas/std.ProductId"
        platformProductIds:
          type:
          - array
          - "null"
          description: Hardware platforms the retirement applies to, identified by product identifier rather than by name. May be present alongside a named family. Null when the retirement is scoped by family name only.
          readOnly: true
          items:
            $ref: "#/components/schemas/std.ProductId"
        postDate:
          type:
          - string
          - "null"
          format: date
          description: Day the bulletin was posted. Distinct from the external announcement date, and the field that orders competing resources when more than one covers the same release. Null when no posting date is available.
          readOnly: true
        productFamily:
          type:
          - string
          - "null"
          description: Hardware family the retirement applies to. Null where the resource names no family, which does not on its own mean the retirement is universal. It may instead be scoped by `platformProductIds` or `moduleProductIds`, and those must be checked before treating the resource as applying everywhere.
          readOnly: true
          maxLength: 1024
          examples:
          - Catalyst 3750 Series
          - Cisco Catalyst 2960 Series Switches; Cisco Catalyst 3560 Series Switches
        releaseTrain:
          type:
          - string
          - "null"
          description: Release train being retired, such as 'SE' or 'SY'. Holds `*` where the retired releases carry no train suffix, which is a value in its own right rather than a wildcard. A major version commonly has both `*` and named trains retired under separate resources. Null where the source names no train, which is also where `isVersionPattern` is set.
          readOnly: true
          maxLength: 64
          examples:
          - SE
          - SY
          - "*"
        softwareType:
          description: Software product line being retired. First component of the version a consumer resolves against. Null until the software scope is available.
          readOnly: true
          examples:
          - IOS
          - IOS-XE
          - CATOS
          anyOf:
          - $ref: "#/components/schemas/std.SoftwareType"
          - type: "null"
        sourceRecordId:
          type: string
          description: Source record identifier assigned to this product. Immutable.
          readOnly: true
          minLength: 1
          maxLength: 128
        sys:
          type: object
          description: System metadata for provisioning state.
          readOnly: true
          properties:
            createdAt:
              type: string
              format: date-time
              description: When this entity was created. Set automatically by the server and never updated after that. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
            ownership:
              $ref: "#/components/schemas/std.Ownership"
              description: Who owns this instance. SYSTEM instances require an explicit platform role exception for updates by account principals and cannot be deleted by them. CUSTOM instances are created by an account.
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              description: When this entity was last modified. Updated automatically on every write operation. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
        title:
          description: Published announcement headline. Shared by bulletin resources for the release sets covered by that announcement. Null until the headline is available.
          readOnly: true
          examples:
          - End-of-Sale and End-of-Life Announcement for Cisco IOS 12.2
          anyOf:
          - $ref: "#/components/schemas/std.Title"
          - type: "null"
    product.SoftwareEndOfLifeBulletinListResponse:
      type: object
      description: Collection response containing one page of softwareEndOfLifeBulletin resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources matching the request, ignoring pagination. Present only when `?count=true` was requested and the request had no pagination cursor.
        items:
          type: array
          description: Array of softwareEndOfLifeBulletin resources in this paginated response.
          items:
            $ref: "#/components/schemas/product.SoftwareEndOfLifeBulletin"
      required:
      - items
    product.ThreatCategory:
      type: string
      enum:
      - EXPLOIT_STATUS
      - IMPACT
      - TARGET_SET
      description: Type of threat intelligence associated with a vulnerability.
    product.VulnerabilityProductStatus:
      type: object
      description: Product status within an advisory vulnerability.
      properties:
        productId:
          type: string
          description: Opaque product identifier referencing an advisory product within the same advisory.
          maxLength: 256
        status:
          $ref: "#/components/schemas/product.ProductVulnerabilityStatus"
          description: Vulnerability status of this product.
    product.VulnerabilityScore:
      type: object
      description: CVSS score for an advisory vulnerability.
      properties:
        cvssBaseScore:
          $ref: "#/components/schemas/std.CvssScore"
          description: "Computed CVSS v3 base score derived from the vector string. Range: 0.0-10.0."
        cvssVector:
          $ref: "#/components/schemas/std.CvssVectorString"
          description: Full CVSS v3.x vector string encoding the metrics that produce the base score.
        productId:
          type:
          - string
          - "null"
          description: Advisory product identifier. Null when the score applies to all products in the advisory.
          maxLength: 256
    std.AdvisoryId:
      type: string
      description: "Security advisory identifier issued by a vendor or coordination body. Cisco PSIRT advisories use the format 'cisco-sa-<descriptive-slug>' (current) or 'cisco-sa-YYYYMMDD-<slug>' (earlier format). Other organizations use their own schemes: CISA issues ICS advisories as 'ICSA-YY-NNN-NN', ANSSI/CERT-FR publishes 'CERTFR-YYYY-AVI-NNNN', and Germany's BSI uses 'WID-SEC-YYYY-NNNN'. Globally unique within the security advisory database. Used for cross-referencing across security tooling and notification systems."
      maxLength: 128
      examples:
      - cisco-sa-iosxe-webui-privesc-j22SaA4z
      - cisco-sa-apache-log4j-qRuKNEbd
      - cisco-sa-20170629-snmp
      - CERTFR-2023-AVI-0878
      - WID-SEC-W-2023-2658
    std.BugId:
      type: string
      pattern: "^CSC[a-z]{2}\\d{4,7}$"
      description: "Cisco-assigned bug identifier. Format: 'CSC' prefix followed by two lowercase letters and four to seven digits (for example, 'CSCwx12345'). Published in the Cisco Bug Search Tool (BST) at https://bst.cloudapps.cisco.com/bugsearch. Used to cross-reference a bug across advisories, support cases, and release notes."
      maxLength: 32
      examples:
      - CSCwx12345
      - CSCvy98765
    std.BugType:
      type: string
      enum:
      - PRIORITY_BUG
      description: Kind of Cisco bug a record represents. Priority bugs are the initial category loaded into IQ; other categories will be added as additional ingestion pipelines come online.
    std.ConcreteType:
      type: string
      pattern: "^[a-z][a-z0-9-]*\\.[a-z][A-Za-z0-9]*$"
      description: "Namespace-qualified name of a concrete, instantiable model type, either an entity or a value type. Uniquely identifies the concrete type of a polymorphic payload using the format 'namespace.typeName'. Use [entityType](#/components/schemas/std.entityType) when the reference is restricted to entities, and [qualifiedName](#/components/schemas/std.qualifiedName) for any data-model type including interfaces, enums, and scalars."
      maxLength: 128
      examples:
      - asset.asset
      - std.schemaVersionedSys
      - iam.account
      - std.geoCoordinates
    std.CveId:
      type: string
      pattern: "^CVE-\\d{4}-\\d{4,}$"
      description: "Common Vulnerabilities and Exposures (CVE) identifier. Format: 'CVE-' followed by a 4-digit year and a sequence number of 4 or more digits (e.g., 'CVE-2024-20301'). Assigned by CVE Numbering Authorities. Used to cross-reference vulnerabilities across advisory databases."
      maxLength: 32
      examples:
      - CVE-2023-20198
      - CVE-2021-44228
      - CVE-2023-44487
    std.CvssScore:
      type: number
      format: float
      description: Common Vulnerability Scoring System v3 base score from 0.0 to 10.0.
      minimum: 0
      maximum: 10
      examples:
      - 9.8
      - 7.5
      - 4.3
      - 0.0
    std.CvssVectorString:
      type: string
      pattern: "^CVSS:3\\.[01]/"
      description: CVSS v3.x vector string encoding score metrics.
      maxLength: 128
      examples:
      - CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
      - CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H
    std.CweId:
      type: string
      pattern: "^CWE-\\d+$"
      description: Common Weakness Enumeration identifier for a vulnerability weakness category.
      maxLength: 16
      examples:
      - CWE-420
      - CWE-77
      - CWE-502
    std.EntityRef:
      type: string
      format: uri-reference
      pattern: "^/[a-z][a-z0-9-]*/v[0-9]+/[a-z][a-zA-Z0-9]*/([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|by-[a-zA-Z][a-zA-Z0-9]*(/[^\\s/]+)+)$"
      description: API-relative URI reference pointing to a related resource. Addresses the target either by its server-assigned id or by one of the target's declared identity schemes.
      examples:
      - /asset/v1/assets/4ecc4f86-891e-4816-a4e0-d8138be01865
      - /iam/v1/users/a3b2c1d0-e5f6-4a7b-8c9d-0e1f2a3b4c5d
      - /product/v1/products/by-productId/isr4331
      - /asset/v1/assets/by-serial/cisco/isr4331/FDO12345678
    std.ErrorCode:
      type: string
      enum:
      - ALREADY_EXISTS
      - BAD_USER_INPUT
      - CONFLICT
      - DATA_FETCH_ERROR
      - FORBIDDEN
      - GONE
      - GRAPHQL_PARSE_FAILED
      - GRAPHQL_VALIDATION_FAILED
      - INTERNAL_SERVER_ERROR
      - INVALID_FORMAT
      - METHOD_NOT_ALLOWED
      - NOT_ACCEPTABLE
      - NOT_FOUND
      - NOT_IMPLEMENTED
      - PAYLOAD_TOO_LARGE
      - PRECONDITION_FAILED
      - RATE_LIMITED
      - REQUIRED_FIELD
      - SERVICE_UNAVAILABLE
      - TIMEOUT
      - UNAUTHENTICATED
      - UNSUPPORTED_MEDIA_TYPE
      - VALIDATION_FAILED
      description: Machine-readable code that classifies an API error.
    std.ErrorDetail:
      type: object
      description: Describes a specific error in an API response. Use the code, message, description, and field to identify and resolve the issue.
      properties:
        code:
          $ref: "#/components/schemas/std.ErrorCode"
          description: Machine-readable code that classifies the error.
          examples:
          - REQUIRED_FIELD
          - INVALID_FORMAT
        description:
          type:
          - string
          - "null"
          description: Detailed explanation with hints for resolution.
          examples:
          - Provide a non-empty value for the name field.
          - "Ensure the email follows the format: user@domain.com"
        field:
          type:
          - string
          - "null"
          description: Path to the field that caused the error, using dot-notation (e.g., "address.postalCode", "items[0].quantity"). Null for errors not associated with a specific field.
          examples:
          - name
          - address.postalCode
          - items[0].quantity
        message:
          type: string
          description: Human-readable error message suitable for display.
          examples:
          - The 'name' field is required.
          - Email address format is invalid.
    std.FieldNoticeId:
      type: string
      pattern: "^FN-\\d{4,6}$"
      description: "Field notice identifier. Format: 'FN-' prefix followed by a 4–6 digit number (e.g., 'FN-72502'). Published in the field notice database. Used for cross-referencing field issues across documentation and support cases."
      maxLength: 16
      examples:
      - FN-72502
      - FN-64302
      - FN-70489
    std.Ownership:
      type: string
      enum:
      - CUSTOM
      - SYSTEM
      description: Identifies who owns and manages an instance, determining its editability and visibility.
    std.ProblemDetail:
      type: object
      description: Describes an HTTP API error. Use the type, title, status, detail, and errors fields to diagnose the problem and determine next steps.
      properties:
        detail:
          type:
          - string
          - "null"
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
          - Asset with ID 'asset-12345' not found in the system.
          - The field 'name' must not be empty.
        errors:
          type:
          - array
          - "null"
          description: Field-level validation errors. Each entry identifies the specific field and error condition.
          items:
            $ref: "#/components/schemas/std.ErrorDetail"
        instance:
          description: A URI reference identifying the specific occurrence of the problem. May or may not be dereferenceable.
          examples:
          - /api/assets/asset-12345
          - /assets?filter=invalid
          anyOf:
          - $ref: "#/components/schemas/std.Uri"
          - type: "null"
        status:
          type:
          - integer
          - "null"
          format: int32
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          examples:
          - 404
          - 400
        title:
          type:
          - string
          - "null"
          description: A short, human-readable summary of the problem type. Should not change from occurrence to occurrence of the same problem.
          examples:
          - Not Found
          - Validation Failed
        type:
          description: URI that identifies the problem type and may link to documentation that helps resolve it.
          examples:
          - https://iq.cisco.com/api/problems/not-found
          - https://iq.cisco.com/api/problems/validation-failed
          anyOf:
          - $ref: "#/components/schemas/std.Uri"
          - type: "null"
    std.ProductId:
      type: string
      description: Product identifier (PID). A structured SKU code that uniquely identifies a hardware model or software product in a vendor's catalog (e.g., 'C9300-48P-A', 'N9K-C93180YC-FX'). Format varies but consists of alphanumeric characters and hyphens.
      maxLength: 64
      examples:
      - C9300-48P-A
      - N9K-C93180YC-FX
      - ISR4451-X/K9
      - AIR-AP3802I-B-K9
    std.SoftwareType:
      type: string
      description: Network operating system type identifier. Categorizes the software platform running on a device or supported by a product. Determines which advisory databases, end-of-life bulletins, and software compatibility rules apply. Values are vendor-defined uppercase strings (e.g., 'IOS-XE' for Cisco IOS XE).
      minLength: 1
      maxLength: 64
      examples:
      - IOS-XE
      - NX-OS
      - IOS-XR
      - FXOS
      - ASA
    std.Title:
      type: string
      description: Short human-readable heading for a document, advisory, bulletin, or other content item. Suitable for display in lists, dashboards, and notification subjects. It is not a searchable identifier. Use named.name for that purpose.
      maxLength: 512
      examples:
      - End-of-Sale Announcement for the Catalyst 3650 Series
      - Cisco IOS XE Software Web UI Privilege Escalation Vulnerability
      - Clock Signal Component Issue on Various Products
    std.Uri:
      type: string
      format: uri
      pattern: "^[a-zA-Z][a-zA-Z0-9+\\-.]*:[^\\s]*$"
      description: "Uniform Resource Identifier matching the RFC 3986 URI syntax rule: scheme ':' hier-part [ '?' query ] [ '#' fragment ]. Must include a scheme such as https:, mailto:, or urn:, and may also include a query or fragment. A Uri identifies a resource but does not, by itself, imply that the resource is dereferenceable or retrievable. Use [[UriReference]] when a field must also accept relative references such as /ui/dashboard, ../reports/summary, //cdn.example.com/assets/app.js, or #section-2. Use Uri for scheme-based identifiers such as XML namespace URIs, OIDC issuer identifiers, RDF subject URIs, and other absolute references. Use [[Url]] only when the field specifically means a dereferenceable locator. Use [[Urn]] only when the field must use the urn scheme and URN namespace rules. Conforms to RFC 3986, with usage guidance updated by RFC 8820."
      maxLength: 2048
      examples:
      - https://api.example.com/users/42
      - urn:isbn:978-0-306-40615-7
      - mailto:user@example.com
      - urn:uuid:6e8bc430-9c3a-11d9-9669-0800200c9a66
    std.Url:
      type: string
      format: uri
      pattern: "^[a-zA-Z][a-zA-Z0-9+\\-.]*://\\S+$"
      description: "Uniform Resource Locator in the common locator-focused sense from RFC 3986 §1.1.3. RFC 3986 recommends the general term URI for most specifications, but this scalar is for fields that specifically carry a dereferenceable network address. Must use a scheme followed by \"://\" and therefore includes an authority component, such as https://, http://, or ftp://. Use Url for external links, API endpoints, documentation pages, and downloadable resources whose primary purpose is retrieval. Do not use Url for generic scheme-based identifiers such as mailto: or urn:..., and do not use it when relative references are allowed; use [[Uri]] or [[UriReference]] instead. Aligns with RFC 3986 URL subset terminology and RFC 8820 guidance to avoid inventing ad hoc URI structure outside scheme or owner control."
      maxLength: 2048
      examples:
      - https://iq.cisco.com/api/v1/auth/refresh
      - https://api.example.com/users/42
      - ftp://files.example.com/report.pdf
  parameters:
    If-Match:
      name: If-Match
      in: header
      summary: Optimistic-concurrency precondition
      description: ETag value from the most recent GET response for this resource. The server rejects the mutation with 412 Precondition Failed if the resource has changed since then, preventing a write against stale state. Use the verbatim value returned in the ETag response header (RFC 9110 §13.1.1).
      schema:
        type: string
    If-Modified-Since:
      name: If-Modified-Since
      in: header
      summary: Conditional retrieval date
      description: Supply the verbatim value from the Last-Modified response header. The server returns 304 Not Modified if nothing has changed since that date; otherwise it returns the current response. The comparison is against the resource's own last-modification timestamp. Prefer If-None-Match when ETag is available (RFC 9110 §13.1.3).
      schema:
        type: string
    If-None-Match:
      name: If-None-Match
      in: header
      summary: Conditional retrieval validator
      description: ETag value from the most recent GET response for this resource. Returns the resource only if its current ETag differs; otherwise returns 304 Not Modified, allowing the client to reuse its cached copy. Supply the verbatim value returned in the ETag response header (RFC 9110 §13.1.2).
      schema:
        type: string
    If-Unmodified-Since:
      name: If-Unmodified-Since
      in: header
      summary: Date-based concurrency precondition
      description: Last-Modified date from the most recent GET response for this resource. The server rejects the mutation with 412 Precondition Failed if the resource has been modified since then, preventing a write against stale state. Use when ETag is unavailable. If the request also carries If-Match, the server evaluates If-Match and ignores this header (RFC 9110 §13.1.4).
      schema:
        type: string
    after:
      name: after
      in: query
      summary: Pagination cursor
      description: Opaque cursor from a previous response's Link header. Continue from the next page without interpreting or modifying the token.
      schema:
        type: string
    count:
      name: count
      in: query
      summary: Include total count
      description: When true, includes a `count` field in the response equal to the total number of matching rows, regardless of page size. Cannot be combined with a pagination cursor (`after`); only valid on the first page.
      schema:
        type: boolean
    filter:
      name: filter
      in: query
      summary: Filter expression
      description: "Filter expression applied to the collection before pagination. UUID fields and to-one reference comparisons require UUID literals, not resource paths; invalid UUID literals return HTTP 400 BAD_USER_INPUT before execution. Supported: field equality (`status == \"ACTIVE\"`, where the value must match the field's declared enum value), `tier != 0`, nullable stored relationship checks (`account == null`, `account != null`), ordered comparison (`<`, `<=`, `>`, `>=`), boolean combination (`&&`, `||`, `!`) with parentheses for grouping, case-sensitive substring match (`name.contains(\"acme\")`), case-insensitive substring, prefix, and suffix match (`name.icontains(\"ACME\")`, `name.istartsWith(\"ac\")`, `name.iendsWith(\"me\")`), element membership in array fields (`3 in flags`, `\"prod\" in scopes`), key existence in map fields (`\"env\" in tags`), constant string-key lookup (`tags[\"地域 / 環境\"] == \"本番\"`, with single- or double-quoted keys), literal string-list membership for scalar string-compatible fields and tag entries (`product.productId in [\"A\", \"B\"]`, `tags.env in [\"prod\", \"stage\"]`), nested value-type field access (`address.city == \"x\"`), array value-type sub-field predicates (`tags.value == \"x\"`), and many-to-one or one-to-one (owner-side) relationship traversal using a natural key, including a multi-hop chain and a chain that passes through a polymorphic relationship shared identically by every concrete type (`product.manufacturer.name == \"Cisco\"`, `owner.effectiveEntitlementTier.ordinal >= 3`). Literal string lists follow each field's equality validation, including enum values and UUID syntax. An empty list matches no row but still validates the field and retains referenced target readability checks. A chain longer than the configured hop limit, a polymorphic relationship immediately followed by another polymorphic relationship, one-to-many and many-to-many entity relationships, lists of numbers (`tier in [1, 2, 3]`), nonliteral list elements, lists on whole maps or ordinary map entries, dynamic map keys, numeric indexing, arithmetic, and other functions (such as plain `startsWith`, `endsWith`, and `matches`) are not supported. See https://iq.cisco.com/api/help#filtering. Tag values in `tags`, including relationship paths, reject `contains()`, `icontains()`, `startsWith()`, `istartsWith()`, `endsWith()`, `iendsWith()`, `matches()`. Use == to compare a specific tag key with its complete value, for example `tags.env == \"prod\"`; key existence remains supported. Tag string-search violations return HTTP 422 VALIDATION_FAILED."
      schema:
        type: string
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    inline.count:
      name: inline.count
      in: query
      summary: Include relationship totals
      description: When true, each selected relationship includes its exact authorized total in `count`. Requires `inline`. Omit or use false to return no relationship totals.
      schema:
        type: boolean
        default: false
    inline.max:
      name: inline.max
      in: query
      summary: Inline relationship page size
      description: Maximum references per selected relationship and parent. Requires `inline` and a positive value. To continue, pass the relationship's opaque `next` cursor as `after` to its member endpoint.
      schema:
        type: integer
        default: 25
        minimum: 1
        maximum: 100
    max:
      name: max
      in: query
      summary: Page size
      description: "Caps the number of items returned in one page. Use 0 only with `count=true` to return the exact count and an empty `items` array. Smaller positive values reduce response size. Larger positive values return results in fewer pages. Default: 25."
      schema:
        type: integer
        default: 25
        minimum: 0
        maximum: 50000
    offset:
      name: offset
      in: query
      summary: Pagination offset
      description: Zero-based index of the first item to return. Use with page size for direct page access when offset pagination is enabled.
      schema:
        type: integer
    product.hardwareEndOfLifeBulletin.inline:
      name: inline
      in: query
      summary: Inline relationship references
      description: Comma-separated non-owning collection names. Each selected relationship returns bounded reference `items` with an optional opaque `next` cursor. With `select`, include each inline relationship in the selected fields.
      schema:
        type: array
        minItems: 1
        items:
          $ref: "#/components/schemas/product.HardwareEndOfLifeBulletinInlineMember"
      style: form
      explode: false
    product.securityAdvisory.inline:
      name: inline
      in: query
      summary: Inline relationship references
      description: Comma-separated non-owning collection names. Each selected relationship returns bounded reference `items` with an optional opaque `next` cursor. With `select`, include each inline relationship in the selected fields.
      schema:
        type: array
        minItems: 1
        items:
          $ref: "#/components/schemas/product.SecurityAdvisoryInlineMember"
      style: form
      explode: false
    select:
      name: select
      in: query
      summary: Sparse fieldset
      description: Comma-separated list of field names to include in the response. Omit to return the default field set. The `id` identifier and `_type` type discriminator are always included even when not listed. Unknown field names are rejected.
      schema:
        type: string
    traceparent:
      name: traceparent
      in: header
      summary: Trace context
      description: "Optional W3C Trace Context propagation header (RFC format: `00-{trace-id}-{parent-id}-{flags}`). When present, the server creates a child span within the caller's trace; `parent-id` must identify the caller's current span."
      schema:
        type: string
        pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
  headers:
    Cache-Control:
      summary: Cache directive
      description: Directives that control caching behavior for this response. Authenticated responses carry `no-store` to prevent storage in HTTP caches or shared proxies (RFC 9111).
      schema:
        type: string
    Content-Disposition:
      summary: Export file name
      description: Sent only when the response is a CSV or Excel file. It marks the body as an attachment and gives the file name, which has the form <resource>_<UTC date>_<UTC time> and the file extension.
      schema:
        type: string
    Content-Encoding:
      summary: Content coding
      description: "Content coding that the server applied to the response body: `br` (RFC 7932) or `gzip` (RFC 9110 §8.4.1.3). The server compresses `application/json`, `application/*+json`, `application/yaml`, `application/*+yaml`, `text/csv`, and `text/plain` responses when the request `Accept-Encoding` header accepts `br` or `gzip` (RFC 9110 §12.5.3). It uses the coding with the higher quality value, and `br` wins a tie. A small body is not compressed unless the server streams it. Absent when the body is not compressed. Decode the body before you parse it. The `ETag` identifies the decoded body, so it is the same for every coding."
      schema:
        type: string
        enum:
        - br
        - gzip
    Date:
      summary: Response date
      description: Date and time at which the server generated the response, in IMF-fixdate format (RFC 9110 §6.6.1). Useful for detecting clock skew and correlating audit logs.
      schema:
        type: string
    ETag:
      summary: Entity tag
      description: Opaque identifier for the current state of the resource. Use with `If-None-Match` for conditional GETs and with `If-Match` for optimistic-concurrency on updates (RFC 9110 §8.8.3).
      schema:
        type: string
    Last-Modified:
      summary: Last-modified date
      description: Date and time at which the resource was last modified, in IMF-fixdate format. Send it back in `If-Modified-Since` to revalidate a cache, or in `If-Unmodified-Since` to make a subsequent write conditional (RFC 9110 §8.8.2).
      schema:
        type: string
    RateLimit:
      summary: Rate limit
      description: Current rate-limit quota state for the request, including remaining quota and reset time.
      schema:
        type: string
    RateLimit-Policy:
      summary: Rate-limit policy
      description: Published rate-limit policy describing the quota windows and units that apply to the request.
      schema:
        type: string
    Retry-After:
      summary: Retry delay
      description: Time to wait before retrying the request, expressed as delay-seconds or an HTTP date.
      schema:
        type: string
    Server-Timing:
      summary: Server timing
      description: "Time the server spent on this request, as a comma-separated list of metrics in the form `name;dur=<milliseconds>`, each optionally followed by `;desc=\"<text>\"`. The `total` metric covers the request up to the point the server began sending the response; any other metric names a phase within it. Browsers show these entries in the network timing panel. The set of metrics can change between releases. Read entries by name, not by position. Only `total` is guaranteed: the server drops metrics from the end of the list when the full set would not fit in the header."
      schema:
        type: string
    Vary:
      summary: Vary
      description: Lists the request headers used to select the response representation. Caches must store a separate entry for each combination of their values (RFC 9110 §12.5.5). `Accept-Encoding` and `Sec-Fetch-Site` select the content coding of the body. `Accept-Language` signals that the response body is localized.
      schema:
        type: string
    WWW-Authenticate:
      summary: Authentication challenge
      description: Authentication challenge issued by the server when the request lacks valid credentials (RFC 9110 §11.6.1). For Bearer tokens the value is `Bearer realm="<service>"`.
      schema:
        type: string
    X-Total-Count:
      summary: Export total count
      description: Sent only when the response is a CSV or Excel file. It gives the number of rows that match the read; the file holds at most `max` of them. The file is streamed, so the response has no Content-Length.
      schema:
        type: integer
        minimum: 0
    traceparent:
      summary: Trace context
      description: "W3C Trace Context identifier (RFC format: `00-{trace-id}-{parent-id}-{flags}`) returned with this response. The `trace-id` segment uniquely identifies the distributed trace; `parent-id` identifies the server span that produced this response. Clients can use `trace-id` to correlate log entries and spans across services."
      schema:
        type: string
        pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
  responses:
    BadRequest:
      description: Returned when the server cannot parse the request or when a header, query parameter, path parameter, or request body is missing, malformed, or uses an invalid format.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/std.ProblemDetail"
    Conflict:
      description: Returned when the request conflicts with the current state of the target resource, such as a uniqueness collision, concurrent modification, or invalid state transition.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/std.ProblemDetail"
    DefaultError:
      description: Returned when the server rejects the request with an undocumented error response.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/std.ProblemDetail"
    Forbidden:
      description: Returned when the caller is authenticated but is not allowed to perform this operation on the target resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/std.ProblemDetail"
    InternalServerError:
      description: Returned when the server encounters an unexpected condition while processing the request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/std.ProblemDetail"
    NotAcceptable:
      description: Returned when the client sends an Accept header requesting media types that this operation does not provide.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/std.ProblemDetail"
    NotFound:
      description: Returned when the target resource identified by the request does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/std.ProblemDetail"
    NotModified:
      description: Returned when the resource has not changed since the validator supplied in the conditional request header (If-None-Match or If-Modified-Since). The response body is empty; use the previously cached representation (RFC 9110 §15.4.5).
    PayloadTooLarge:
      description: Returned when the request body is too large or contains too many items. Reduce the request size and try again.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/std.ProblemDetail"
    PreconditionFailed:
      description: Returned when a conditional request precondition (If-Match or If-Unmodified-Since) evaluated to false, indicating the resource was modified after the client last retrieved it. Resubmit with a fresh ETag or Last-Modified value from a new GET request (RFC 9110 §15.5.9).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/std.ProblemDetail"
    ServiceUnavailable:
      description: Returned when the service is temporarily unable to process the request because of overload, maintenance, or a transient dependency failure.
      headers:
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/std.ProblemDetail"
    TooManyRequests:
      description: Returned when the client exceeds a request-rate or quota limit enforced by the service.
      headers:
        RateLimit:
          $ref: "#/components/headers/RateLimit"
        RateLimit-Policy:
          $ref: "#/components/headers/RateLimit-Policy"
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/std.ProblemDetail"
    Unauthorized:
      description: Returned when the request does not include valid authentication credentials, such as a missing, expired, or invalid access token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/std.ProblemDetail"
    UnprocessableEntity:
      description: Returned when the request is well-formed but rejected because the submitted values violate validation rules, business rules, or resource state constraints.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/std.ProblemDetail"
  securitySchemes:
    bearerAuth:
      type: http
      description: Long-lived API key or personal access token (PAT) transmitted as a Bearer token in the Authorization header. Per the OpenAPI 3.x specification, the Authorization header is not listed as an explicit parameter — it is implied by this security scheme.
      scheme: bearer
