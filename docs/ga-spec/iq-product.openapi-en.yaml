components:
  schemas:
    product.AdvisoryProduct:
      type: object
      description: A product entry from a security advisory's product tree. The product identifier is scoped to the parent advisory and is not a global product catalog key.
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - product.advisoryProduct
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        advisory:
          $ref: "#/components/schemas/std.EntityRef"
          description: Advisory that names this product.
          readOnly: true
          examples:
          - /product/v1/securityAdvisories/d2210fd4-6098-8f7c-a9aa-e305d442acf1
          x-relationship-targets:
          - product.SecurityAdvisory
        family:
          type:
          - string
          - "null"
          description: Product family name from the product tree hierarchy.
          readOnly: true
          maxLength: 256
          examples:
          - Cisco IOS XE Software
          - Cisco IOS Software
        name:
          type: string
          description: Product name from the product tree hierarchy.
          readOnly: true
          maxLength: 256
          examples:
          - Cisco IOS XE Software 17.6.1
          - Cisco IOS XE Software
        productId:
          type: string
          description: Product identifier assigned within the advisory's product tree. Referenced by vulnerability status and score entries.
          readOnly: true
          minLength: 1
          maxLength: 256
        sys:
          type: object
          description: System metadata for provisioning state.
          readOnly: true
          properties:
            createdAt:
              type: string
              format: date-time
              description: When this entity was created. Set automatically by the server and never updated after that. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
            ownership:
              $ref: "#/components/schemas/std.Ownership"
              description: Who owns this instance. SYSTEM instances require an explicit platform role exception for updates by account principals and cannot be deleted by them. CUSTOM instances are created by an account.
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              description: When this entity was last modified. Updated automatically on every write operation. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
        vendor:
          type:
          - string
          - "null"
          description: Vendor name from the product tree hierarchy.
          readOnly: true
          maxLength: 256
          examples:
          - Cisco
          - Red Hat
        version:
          type:
          - string
          - "null"
          description: Product version from the product tree hierarchy.
          readOnly: true
          maxLength: 128
          examples:
          - 17.6.1
          - 17.3.4a
    product.AdvisoryProductListResponse:
      type: object
      description: Collection response containing one page of advisoryProduct resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources matching the request, ignoring pagination. Present only when `?count=true` was requested and the request had no pagination cursor.
        items:
          type: array
          description: Array of advisoryProduct resources in this paginated response.
          items:
            $ref: "#/components/schemas/product.AdvisoryProduct"
      required:
      - items
    product.AdvisoryProductNavigation:
      anyOf:
      - $ref: "#/components/schemas/product.AdvisoryProductNavigationPage"
      - $ref: "#/components/schemas/product.AdvisoryProductRefListResponse"
    product.AdvisoryProductNavigationPage:
      type: object
      description: Link to the relationship endpoint, with an optional expanded page of advisoryProduct resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources this member holds, independent of how many items are present in this response. Present only when the request asked for a total.
        href:
          type: string
          format: uri-reference
          description: URL of the relationship endpoint for the containing resource.
        items:
          type: array
          description: Array of advisoryProduct resources in this paginated response.
          items:
            $ref: "#/components/schemas/product.AdvisoryProduct"
        next:
          type: string
          format: uri-reference
          description: Opaque cursor to pass as `after` to the member endpoint to resume after the last element in items. Absent when items holds the whole member.
      required:
      - href
      additionalProperties: false
    product.AdvisoryProductRefListResponse:
      type: object
      description: A to-many relationship member, holding a bounded set of references to advisoryProduct resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources this member holds, independent of how many items are present in this response. Present only when the request asked for a total.
        items:
          type: array
          description: References to the advisoryProduct resources in this member. A bounded preview of the member when next is present.
          items:
            $ref: "#/components/schemas/std.EntityRef"
            x-relationship-targets:
            - product.AdvisoryProduct
        next:
          type: string
          format: uri-reference
          description: Opaque cursor to pass as `after` to the member endpoint to resume after the last element in items. Absent when items holds the whole member.
      required:
      - items
    product.AdvisoryRemediation:
      type: object
      description: Remediation guidance for a vulnerability in a security advisory.
      properties:
        category:
          $ref: "#/components/schemas/product.RemediationCategory"
          description: Type of remediation guidance.
        date:
          type:
          - string
          - "null"
          format: date-time
          description: When the remediation was published or updated.
        details:
          type: string
          description: Instructions or details for applying the remediation.
          maxLength: 4096
        productIds:
          type:
          - array
          - "null"
          description: Advisory product identifiers the remediation applies to.
          uniqueItems: true
          items:
            type: string
        restartRequired:
          description: Restart scope required to apply the remediation.
          anyOf:
          - $ref: "#/components/schemas/product.RestartRequiredCategory"
          - type: "null"
        url:
          description: URL to the remediation resource when available.
          anyOf:
          - $ref: "#/components/schemas/std.Url"
          - type: "null"
    product.AdvisoryRevision:
      type: object
      description: Security advisory revision history entry.
      properties:
        date:
          type: string
          format: date-time
          description: When this revision was published.
        summary:
          type: string
          description: Human-readable description of what changed in this revision.
          maxLength: 1024
          examples:
          - Initial public release.
          - Updated affected product list and CVSS score.
        version:
          type: string
          description: Version string for this revision (for example, '1.0' or '2.1').
          maxLength: 32
          examples:
          - "1.0"
          - "1.1"
          - "2.0"
    product.AdvisorySeverity:
      type: string
      enum:
      - CRITICAL
      - HIGH
      - INFORMATIONAL
      - LOW
      - MEDIUM
      description: Severity classification of a security advisory based on its CVSS base score.
    product.AdvisoryStatus:
      type: string
      enum:
      - FINAL
      - INTERIM
      description: Publication lifecycle state of a security advisory.
    product.AdvisoryThreat:
      type: object
      description: Threat intelligence for an advisory vulnerability.
      properties:
        category:
          $ref: "#/components/schemas/product.ThreatCategory"
          description: Type of threat intelligence, such as exploit status, impact, or target set.
        date:
          type:
          - string
          - "null"
          format: date-time
          description: When this threat information was published or last updated.
        details:
          type: string
          description: Human-readable description of the threat observation.
          maxLength: 4096
        productIds:
          type:
          - array
          - "null"
          description: Advisory product identifiers to which this threat observation applies. Null when it applies to all products.
          uniqueItems: true
          items:
            type: string
    product.AdvisoryVulnerability:
      type: object
      description: A single vulnerability entry within a security advisory. Carries identifiers, scoring, product status, and remediation guidance.
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - product.advisoryVulnerability
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        advisory:
          $ref: "#/components/schemas/std.EntityRef"
          description: Advisory containing this vulnerability.
          readOnly: true
          examples:
          - /product/v1/securityAdvisories/d2210fd4-6098-8f7c-a9aa-e305d442acf1
          x-relationship-targets:
          - product.SecurityAdvisory
        bugs:
          $ref: "#/components/schemas/product.BugRefListResponse"
          description: Cisco bugs identified by this vulnerability, including bugs whose details are not yet known. Empty when the vulnerability identifies no bugs.
          readOnly: true
          examples:
          - items:
            - /product/v1/bugs/75f85f3a-88ed-886e-be07-bb84d8fce6d5
          x-relationship-targets:
          - product.Bug
        cve:
          description: CVE identifier for this vulnerability, when assigned.
          readOnly: true
          examples:
          - CVE-2024-20301
          - CVE-2021-44228
          anyOf:
          - $ref: "#/components/schemas/std.CveId"
          - type: "null"
        cwe:
          description: CWE identifier classifying the root-cause weakness, when assigned.
          readOnly: true
          examples:
          - CWE-420
          - CWE-77
          - CWE-502
          anyOf:
          - $ref: "#/components/schemas/std.CweId"
          - type: "null"
        details:
          type:
          - string
          - "null"
          description: Detailed explanation of the vulnerability and its conditions.
          readOnly: true
          maxLength: 8192
        discoveredAt:
          type:
          - string
          - "null"
          format: date-time
          description: When the vulnerability was first discovered, when known.
          readOnly: true
        productStatuses:
          type:
          - array
          - "null"
          description: Per-product vulnerability status entries.
          readOnly: true
          items:
            $ref: "#/components/schemas/product.VulnerabilityProductStatus"
        releasedAt:
          type:
          - string
          - "null"
          format: date-time
          description: When the vulnerability information was first publicly released.
          readOnly: true
        remediations:
          type:
          - array
          - "null"
          description: Remediation guidance entries for this vulnerability.
          readOnly: true
          items:
            $ref: "#/components/schemas/product.AdvisoryRemediation"
        scores:
          type:
          - array
          - "null"
          description: Per-product CVSS scoring entries.
          readOnly: true
          items:
            $ref: "#/components/schemas/product.VulnerabilityScore"
        summary:
          type:
          - string
          - "null"
          description: Human-readable summary of the vulnerability and its impact.
          readOnly: true
          maxLength: 8192
        sys:
          type: object
          description: System metadata for provisioning state.
          readOnly: true
          properties:
            createdAt:
              type: string
              format: date-time
              description: When this entity was created. Set automatically by the server and never updated after that. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
            ownership:
              $ref: "#/components/schemas/std.Ownership"
              description: Who owns this instance. SYSTEM instances require an explicit platform role exception for updates by account principals and cannot be deleted by them. CUSTOM instances are created by an account.
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              description: When this entity was last modified. Updated automatically on every write operation. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
        threats:
          type:
          - array
          - "null"
          description: Threat intelligence entries for this vulnerability.
          readOnly: true
          items:
            $ref: "#/components/schemas/product.AdvisoryThreat"
        title:
          $ref: "#/components/schemas/std.Title"
          description: Brief human-readable title describing the vulnerability.
          readOnly: true
          examples:
          - Cisco IOS XE Software Web UI Privilege Escalation Vulnerability
        vulnerabilityId:
          type: string
          description: Stable identifier for this vulnerability within the advisory. It may be derived from the advisory identifier and CVE when no source identifier is provided.
          readOnly: true
          minLength: 1
          maxLength: 128
    product.AdvisoryVulnerabilityListResponse:
      type: object
      description: Collection response containing one page of advisoryVulnerability resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources matching the request, ignoring pagination. Present only when `?count=true` was requested and the request had no pagination cursor.
        items:
          type: array
          description: Array of advisoryVulnerability resources in this paginated response.
          items:
            $ref: "#/components/schemas/product.AdvisoryVulnerability"
      required:
      - items
    product.AdvisoryVulnerabilityNavigation:
      anyOf:
      - $ref: "#/components/schemas/product.AdvisoryVulnerabilityNavigationPage"
      - $ref: "#/components/schemas/product.AdvisoryVulnerabilityRefListResponse"
    product.AdvisoryVulnerabilityNavigationPage:
      type: object
      description: Link to the relationship endpoint, with an optional expanded page of advisoryVulnerability resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources this member holds, independent of how many items are present in this response. Present only when the request asked for a total.
        href:
          type: string
          format: uri-reference
          description: URL of the relationship endpoint for the containing resource.
        items:
          type: array
          description: Array of advisoryVulnerability resources in this paginated response.
          items:
            $ref: "#/components/schemas/product.AdvisoryVulnerability"
        next:
          type: string
          format: uri-reference
          description: Opaque cursor to pass as `after` to the member endpoint to resume after the last element in items. Absent when items holds the whole member.
      required:
      - href
      additionalProperties: false
    product.AdvisoryVulnerabilityRefListResponse:
      type: object
      description: A to-many relationship member, holding a bounded set of references to advisoryVulnerability resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources this member holds, independent of how many items are present in this response. Present only when the request asked for a total.
        items:
          type: array
          description: References to the advisoryVulnerability resources in this member. A bounded preview of the member when next is present.
          items:
            $ref: "#/components/schemas/std.EntityRef"
            x-relationship-targets:
            - product.AdvisoryVulnerability
        next:
          type: string
          format: uri-reference
          description: Opaque cursor to pass as `after` to the member endpoint to resume after the last element in items. Absent when items holds the whole member.
      required:
      - items
    product.Bug:
      type: object
      description: A globally-referenced Cisco bug. Records the Cisco bug identifier, severity, symptom, affected products and releases, and rollup metrics such as the support case count. Populated from the Cisco Bug Search Tool (BST) through ingestion. The bugType field indicates which category of bug the record represents; priority bugs are the first category loaded. A referenced bug may contain only its identifier until its source details are available. Null details mean unknown, not an assigned severity, status, or category.
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - product.bug
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        bugId:
          $ref: "#/components/schemas/std.BugId"
          description: Cisco bug number. Published in the Cisco Bug Search Tool (BST). Immutable.
          readOnly: true
          minLength: 1
        bugType:
          description: Category that classifies this Cisco bug in IQ. Priority bugs are the initial category loaded.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.BugType"
          - type: "null"
        conditions:
          type:
          - string
          - "null"
          description: Conditions under which the bug is reproducible.
          readOnly: true
          maxLength: 4096
        createdAt:
          type:
          - string
          - "null"
          format: date-time
          description: When this bug record was created in the Cisco Bug Search Tool. Distinct from the sys.createdAt audit field, which records when this row was ingested into IQ.
          readOnly: true
        fixedReleases:
          type:
          - array
          - "null"
          description: Software releases that contain the fix for this bug.
          readOnly: true
          items:
            type: string
            maxLength: 64
        furtherProblemDescription:
          type:
          - string
          - "null"
          description: Additional problem description supplied by Cisco engineering.
          readOnly: true
          maxLength: 8192
        modifiedAt:
          type:
          - string
          - "null"
          format: date-time
          description: When this bug record was last modified in the Cisco Bug Search Tool. Distinct from the sys.updatedAt audit field, which records when this row was last updated in IQ.
          readOnly: true
        osType:
          type:
          - string
          - "null"
          description: Operating system or platform family that the bug applies to, as reported by the Bug Search Tool (for example, 'IOS-XE').
          readOnly: true
          maxLength: 64
        productsAffected:
          type:
          - array
          - "null"
          description: Product families that this bug affects.
          readOnly: true
          items:
            type: string
            maxLength: 128
        referenceUrl:
          description: Canonical URL to the record for this bug in the Cisco Bug Search Tool.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.Uri"
          - type: "null"
        relatedBugIds:
          type:
          - array
          - "null"
          description: Cisco bug IDs related to this bug (duplicates, dependencies, or related root causes).
          readOnly: true
          uniqueItems: true
          items:
            type: string
            maxLength: 64
        severity:
          description: Cisco-assigned severity level of the bug, from S1 (catastrophic) to S6 (informational).
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/product.BugSeverity"
          - type: "null"
        status:
          description: Customer-facing bug status as published by the Bug Search Tool. Not the internal CDETS defect state.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/product.BugStatus"
          - type: "null"
        supportCaseCount:
          type:
          - integer
          - "null"
          format: int32
          description: Number of open Cisco TAC support cases associated with this bug.
          readOnly: true
          minimum: 0
        symptom:
          type:
          - string
          - "null"
          description: Observed symptom that customers experience when the bug triggers.
          readOnly: true
          maxLength: 4096
        sys:
          type: object
          description: System metadata for provisioning state.
          readOnly: true
          properties:
            createdAt:
              type: string
              format: date-time
              description: When this entity was created. Set automatically by the server and never updated after that. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
            ownership:
              $ref: "#/components/schemas/std.Ownership"
              description: Who owns this instance. SYSTEM instances require an explicit platform role exception for updates by account principals and cannot be deleted by them. CUSTOM instances are created by an account.
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              description: When this entity was last modified. Updated automatically on every write operation. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
        title:
          description: Brief summary of the bug, as published by the Bug Search Tool.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.Title"
          - type: "null"
        versionsAffected:
          type:
          - array
          - "null"
          description: Software versions that this bug affects.
          readOnly: true
          items:
            type: string
            maxLength: 64
        workaround:
          type:
          - string
          - "null"
          description: Documented workaround for the bug, if any.
          readOnly: true
          maxLength: 4096
      required:
      - bugId
    product.BugListResponse:
      type: object
      description: Collection response containing one page of bug resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources matching the request, ignoring pagination. Present only when `?count=true` was requested and the request had no pagination cursor.
        items:
          type: array
          description: Array of bug resources in this paginated response.
          items:
            $ref: "#/components/schemas/product.Bug"
      required:
      - items
    product.BugRefListResponse:
      type: object
      description: A to-many relationship member, holding a bounded set of references to bug resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources this member holds, independent of how many items are present in this response. Present only when the request asked for a total.
        items:
          type: array
          description: References to the bug resources in this member. A bounded preview of the member when next is present.
          items:
            $ref: "#/components/schemas/std.EntityRef"
            x-relationship-targets:
            - product.Bug
        next:
          type: string
          format: uri-reference
          description: Opaque cursor to pass as `after` to the member endpoint to resume after the last element in items. Absent when items holds the whole member.
      required:
      - items
    product.BugSeverity:
      type: string
      enum:
      - S1
      - S2
      - S3
      - S4
      - S5
      - S6
      description: Cisco-standard severity levels that range from S1 (catastrophic) to S6 (informational).
    product.BugStatus:
      type: string
      enum:
      - DUPLICATE
      - FIXED
      - OPEN
      - OTHER
      - TERMINATED
      - UNREPRODUCIBLE
      description: Status of a Cisco bug as reported by the Bug Search Tool (BST). These values mirror the customer-facing status BST exposes to external users. They are not the internal CDETS defect state codes.
    product.BulletinNumber:
      type: string
      description: >-
        Identifier assigned to a published end-of-life announcement. Identifies the announcement rather than any one bulletin resource, so it can repeat across products covered by the same announcement.
        Canonical values are an 'EOL' prefix plus a numeric sequence (e.g. 'EOL14981'). The source feeds also may carry numeric ids, product-bulletin ids, slugs, and legacy ESC strings, so this is not constrained to the EOL form.
      maxLength: 64
      examples:
      - EOL14981
      - EOL15032
      - EOL13452
      - PB3511
    product.BulletinReference:
      type: object
      description: A reference associated with a published field notice or security advisory. References provide supporting information without replacing the primary bulletin URL.
      properties:
        category:
          type:
          - string
          - "null"
          description: Category of the supporting reference.
          maxLength: 64
          examples:
          - ADVISORY
          - DOCUMENTATION
          - REMEDIATION
          - DOWNLOAD
        title:
          type:
          - string
          - "null"
          description: Human-readable title of the supporting reference.
          maxLength: 512
        url:
          $ref: "#/components/schemas/std.Url"
          description: URL of the supporting reference.
    product.EndOfLifeSchedule:
      type: object
      description: The dated milestones an end-of-life announcement publishes, from the close of ordering through to the last day support is delivered. Only the end-of-sale date is published on every bulletin, so every other milestone is nullable and a null means the milestone is not available or does not apply. `lastDateOfSupport` is the terminal milestone and the date lifecycle risk reporting counts down to.
      properties:
        endOfBusinessUnitEngineeringSupportDate:
          type:
          - string
          - "null"
          format: date
          description: Last day the business unit's engineering team supports technical assistance escalations. Null when this milestone is not available.
        endOfLastShipDate:
          type:
          - string
          - "null"
          format: date
          description: Last day ordered units are shipped. Falls after the end-of-sale date, covering the backlog built before ordering closed. Null when the this milestone is not available.
        endOfLifeExternalAnnouncementDate:
          type:
          - string
          - "null"
          format: date
          description: Day the retirement was announced publicly. Null when this milestone is not available.
        endOfNewServiceAttachmentDate:
          type:
          - string
          - "null"
          format: date
          description: Last day new service coverage can be attached to a unit that is not already covered. Null when this milestone is not available.
        endOfRoutineFailureAnalysisDate:
          type:
          - string
          - "null"
          format: date
          description: Last day the publisher performs routine failure analysis on returned units. Null when this milestone is not available.
        endOfSaleDate:
          type:
          - string
          - "null"
          format: date
          description: Last day the product or release can be ordered. After this date it is supported but no longer sold. This is the primary anchor for lifecycle reporting.
        endOfSecuritySupportDate:
          type:
          - string
          - "null"
          format: date
          description: Last day security fixes are published. Past this date a newly disclosed vulnerability will not be patched, which makes it the milestone that governs security risk rather than supportability. Null when this milestone is not available.
        endOfServiceContractRenewalDate:
          type:
          - string
          - "null"
          format: date
          description: Last day a service contract covering this product or release can be renewed. Coverage already in force runs to its own end date. Null when this milestone is not available.
        endOfSignatureReleasesDate:
          type:
          - string
          - "null"
          format: date
          description: Last day signature updates are published. Null when no signature updates are provided or this milestone is not available.
        endOfSoftwareAvailabilityDate:
          type:
          - string
          - "null"
          format: date
          description: Last day software images remain available to download. Null when this milestone is not available.
        endOfSoftwareLicenseAvailabilityDate:
          type:
          - string
          - "null"
          format: date
          description: Last day new licenses can be purchased. Null when this milestone is not available.
        endOfSoftwareMaintenanceDate:
          type:
          - string
          - "null"
          format: date
          description: Last day maintenance and bug-fix releases are published. Security fixes may continue past this date. Null when this milestone is not available.
        lastDateOfSupport:
          type:
          - string
          - "null"
          format: date
          description: Terminal milestone. The last day any support is delivered; the product or release is obsolete thereafter. This is the date lifecycle risk reporting counts down to. Null when this milestone is not available.
    product.FieldNotice:
      type: object
      description: A published field notice describing a non-security issue with a product, typically hardware defects, firmware bugs, or manufacturing issues that may require corrective action such as hardware replacement or firmware updates. Less urgent than security advisories.
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - product.fieldNotice
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        affectedPhysicalTypes:
          type: array
          description: Physical component types affected by the field notice.
          readOnly: true
          uniqueItems: true
          items:
            type: string
        affectedProducts:
          $ref: "#/components/schemas/product.ProductRefListResponse"
          description: Catalog products affected by this field notice, identified by their product identifiers.
          readOnly: true
          examples:
          - items:
            - /product/v1/products/7de87c3f-0f21-8dbb-953f-0cfa06ecfd52
          x-relationship-targets:
          - product.Product
        background:
          type:
          - string
          - "null"
          description: Background information about the issue.
          readOnly: true
          maxLength: 8192
        bugs:
          $ref: "#/components/schemas/product.BugRefListResponse"
          description: Cisco bugs identified by this field notice, including bugs whose details are not yet known. Empty when the notice identifies no bugs.
          readOnly: true
          examples:
          - items:
            - /product/v1/bugs/75f85f3a-88ed-886e-be07-bb84d8fce6d5
          x-relationship-targets:
          - product.Bug
        bulletinUrl:
          description: URL to the full field notice. Provides workarounds, affected configurations, and replacement or upgrade procedures.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.Url"
          - type: "null"
        caveat:
          type:
          - string
          - "null"
          description: Qualifying note about the field notice or corrective action.
          readOnly: true
          maxLength: 8192
        deviceOs:
          type:
          - array
          - "null"
          description: Device operating systems associated with affected products.
          readOnly: true
          uniqueItems: true
          items:
            type: string
        domain:
          $ref: "#/components/schemas/product.FieldNoticeDomain"
          description: Hardware or software domain covered by the field notice.
          readOnly: true
        fieldNoticeId:
          $ref: "#/components/schemas/std.FieldNoticeId"
          description: Published field notice identifier.
          readOnly: true
          minLength: 1
        fieldNoticeVersion:
          type:
          - string
          - "null"
          description: Version string of the field notice's current revision.
          readOnly: true
          maxLength: 32
        firstPublishedAt:
          type:
          - string
          - "null"
          format: date-time
          description: When this field notice was first published. Immutable.
          readOnly: true
        impactRating:
          $ref: "#/components/schemas/product.FieldNoticeImpactRating"
          description: Impact rating of the field notice.
          readOnly: true
          maxLength: 64
        lastRevisedAt:
          type:
          - string
          - "null"
          format: date-time
          description: When this field notice was last updated with new information, additional affected products, or revised remediation guidance.
          readOnly: true
        problemDescription:
          type:
          - string
          - "null"
          description: Detailed explanation of the issue, affected conditions, and operational impact. May include failure mode details and affected serial number ranges.
          readOnly: true
          maxLength: 8192
        problemSymptoms:
          type:
          - string
          - "null"
          description: Problem symptoms associated with the issue.
          readOnly: true
          maxLength: 32768
        references:
          type:
          - array
          - "null"
          description: Related field notice and supporting URLs.
          readOnly: true
          items:
            $ref: "#/components/schemas/product.BulletinReference"
        sys:
          type: object
          description: System metadata for provisioning state.
          readOnly: true
          properties:
            createdAt:
              type: string
              format: date-time
              description: When this entity was created. Set automatically by the server and never updated after that. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
            ownership:
              $ref: "#/components/schemas/std.Ownership"
              description: Who owns this instance. SYSTEM instances require an explicit platform role exception for updates by account principals and cannot be deleted by them. CUSTOM instances are created by an account.
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              description: When this entity was last modified. Updated automatically on every write operation. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
        title:
          $ref: "#/components/schemas/std.Title"
          description: Brief summary of the issue.
          readOnly: true
        workaround:
          type:
          - string
          - "null"
          description: Workaround or corrective action for the issue.
          readOnly: true
          maxLength: 32768
    product.FieldNoticeDomain:
      type: string
      enum:
      - HARDWARE
      - SOFTWARE
      description: Product domain covered by a field notice.
    product.FieldNoticeImpactRating:
      type: string
      enum:
      - CRITICAL
      - HIGH
      - LOW
      - MEDIUM
      - NOT_RATED
      description: Urgency Cisco assigns to a published field notice, indicating how promptly the described issue calls for action. Ratings have been assigned since 1 August 2024. Use NOT_RATED when a field notice was published and last revised before that date.
    product.FieldNoticeListResponse:
      type: object
      description: Collection response containing one page of fieldNotice resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources matching the request, ignoring pagination. Present only when `?count=true` was requested and the request had no pagination cursor.
        items:
          type: array
          description: Array of fieldNotice resources in this paginated response.
          items:
            $ref: "#/components/schemas/product.FieldNotice"
      required:
      - items
    product.HardwareEndOfLifeBulletin:
      type: object
      description: A hardware end-of-life bulletin for one product in a published announcement. An announcement can cover several products, each with its own resource and the same `bulletinNumber`. The published product and `physicalTypeName` identify the resource because one product identifier can refer to both a chassis and a module. `bulletinPid` is the product identifier in the announcement; `productId` is the matching product in IQ. They can differ when the announcement names a representative or superseded product identifier.
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - product.hardwareEndOfLifeBulletin
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        bulletinNumber:
          description: Number of the published announcement. One announcement can cover several products, so this number can be shared by several bulletin resources. Null until announcement details are available.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/product.BulletinNumber"
          - type: "null"
        bulletinPid:
          $ref: "#/components/schemas/std.ProductId"
          description: Product this resource retires, as named in the published product. Immutable.
          readOnly: true
          minLength: 1
        bulletinUrl:
          description: Link to the published bulletin, which carries the migration guidance and any conditions attached to the milestone dates. Null when no bulletin link is available.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.Url"
          - type: "null"
        migrateToProducts:
          $ref: "#/components/schemas/product.ProductRefListResponse"
          description: Products recommended as migration or replacement targets for the product this resource retires. A resource may recommend several successors, and a successor may be recommended by several resources. Empty when no successor is recommended. A referenced product can have only its identifier until catalog details are available.
          readOnly: true
          examples:
          - items:
            - /product/v1/products/7de87c3f-0f21-8dbb-953f-0cfa06ecfd52
          x-relationship-targets:
          - product.Product
        migrationInfo:
          type:
          - string
          - "null"
          description: Recommended replacement path for the retired product, as published. Carries the successor product identifiers in the form the source serializes them, so a consumer must parse it rather than join on it. `migrateToProducts` is the resolved form. Null when the bulletin names no migration path.
          readOnly: true
          maxLength: 4096
        milestones:
          description: Dated lifecycle milestones for the retired product. Null until lifecycle dates are available.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/product.EndOfLifeSchedule"
          - type: "null"
        notes:
          type:
          - string
          - "null"
          description: Qualification the source attaches to this mapping, exceptions, conditions, or the reasoning behind a non-obvious match. Null where the source attaches none.
          readOnly: true
          maxLength: 4096
        physicalTypeName:
          $ref: "#/components/schemas/product.HardwarePhysicalType"
          description: Class of hardware the retired product represents. Pairs with `bulletinPid` as the resource's identity, so a consumer matching installed hardware must supply both and cannot fall back to the product alone.
          readOnly: true
          minLength: 1
        postDate:
          type:
          - string
          - "null"
          format: date
          description: Day the bulletin was posted. Distinct from the external announcement date, and needed to order successive revisions of a bulletin and to age ones that have not been acknowledged. Null when no posting date is available.
          readOnly: true
        productId:
          description: Product the resource resolves to. Differs from `bulletinPid` where the bulletin was published against a representative or superseded identifier. Null when no matching product is available.
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/std.ProductId"
          - type: "null"
        productRuleId:
          type:
          - string
          - "null"
          description: Identifier for the product mapping used by this resource. Null when no product mapping is available.
          readOnly: true
          maxLength: 64
        products:
          $ref: "#/components/schemas/product.ProductNavigation"
          description: Products covered by this end-of-life product. A bulletin typically covers an entire product family or generation, so several product identifiers share one resource.
          readOnly: true
          examples:
          - href: /api/product/v1/hardwareEndOfLifeBulletins/1ddce58f-8af9-8e90-9217-0a3a8283c30a/products
          x-relationship-targets:
          - product.Product
        sourceRecordId:
          type:
          - string
          - "null"
          description: Source record identifier assigned to this product. Unique, but not the resource's identity. The published product and hardware class are what a consumer matching installed hardware can supply. Null until the source record is available.
          readOnly: true
          maxLength: 128
        sys:
          type: object
          description: System metadata for provisioning state.
          readOnly: true
          properties:
            createdAt:
              type: string
              format: date-time
              description: When this entity was created. Set automatically by the server and never updated after that. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
            ownership:
              $ref: "#/components/schemas/std.Ownership"
              description: Who owns this instance. SYSTEM instances require an explicit platform role exception for updates by account principals and cannot be deleted by them. CUSTOM instances are created by an account.
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              description: When this entity was last modified. Updated automatically on every write operation. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
        title:
          description: Announcement headline. Belongs to the bulletin, so it repeats across every product the bulletin retires. Null until the announcement headline is available.
          readOnly: true
          examples:
          - End-of-Sale and End-of-Life Announcement for the Catalyst 3650 Series Switches
          anyOf:
          - $ref: "#/components/schemas/std.Title"
          - type: "null"
    product.HardwareEndOfLifeBulletinInlineMember:
      type: string
      enum:
      - products
    product.HardwareEndOfLifeBulletinListResponse:
      type: object
      description: Collection response containing one page of hardwareEndOfLifeBulletin resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources matching the request, ignoring pagination. Present only when `?count=true` was requested and the request had no pagination cursor.
        items:
          type: array
          description: Array of hardwareEndOfLifeBulletin resources in this paginated response.
          items:
            $ref: "#/components/schemas/product.HardwareEndOfLifeBulletin"
      required:
      - items
    product.HardwarePhysicalType:
      type: string
      pattern: ^(UNKNOWN|CHASSIS|MODULE|POWER_SUPPLY|FAN|SOFTWARE)$
      description: "Class of hardware a retired product represents. Qualifies how an end-of-life resource is matched against installed hardware: CHASSIS resolves against the enclosure that anchors an asset, MODULE against a card, blade, or transceiver seated within it, and POWER_SUPPLY and FAN against those field-replaceable units. SOFTWARE identifies a software retirement represented by a hardware product. UNKNOWN identifies a bulletin whose physical classification is not specified.\nModeled as a constrained string rather than an enumeration because it forms part of the resource's identity, and identity components must be valid URL path segments."
      maxLength: 16
      examples:
      - CHASSIS
      - MODULE
      - POWER_SUPPLY
      - UNKNOWN
    product.HasSerialNumber:
      type: string
      enum:
      - NOT_SERIAL_NUMBERED
      - SERIAL_NUMBERED
      - SERIAL_NUMBERING_NOT_SPECIFIED
      description: Whether each deployed unit of a product has a serial number.
    product.IsServiceable:
      type: string
      enum:
      - NOT_SERVICEABLE
      - SERVICEABILITY_NOT_SPECIFIED
      - SERVICEABLE
      description: Whether deployed units of a product can be serviced.
    product.PhysicalType:
      type: string
      enum:
      - CABLE
      - CARD
      - CHASSIS
      - FAN
      - MODULE
      - POWER_SUPPLY
      - SOFTWARE
      - UNKNOWN
      description: Physical form of a product, such as software, a chassis, a card, a module, a cable, a power supply, or a fan.
    product.Product:
      type: object
      description: An orderable or installable product identified by its structured product identifier. It describes the product, its family, owning business unit, physical form, and whether deployed units have serial numbers and can be serviced.
      properties:
        _type:
          $ref: "#/components/schemas/std.ConcreteType"
          enum:
          - product.product
          description: Concrete type discriminator in `namespace.typeName` format.
          readOnly: true
        id:
          type: string
          description: Opaque, immutable identifier for this entity. Unique across all accounts. Assigned by the server at creation time. Clients cannot set or modify it.
          readOnly: true
        baseProductId:
          type:
          - string
          - "null"
          description: Product identifier that groups the orderable variants of one base product. Null when this product is not a variant.
          readOnly: true
          maxLength: 64
          examples:
          - C9300-48T
          - C8000V
        businessEntityName:
          type:
          - string
          - "null"
          description: Name of the business unit responsible for the product. Null when no owning business unit is available.
          readOnly: true
          maxLength: 64
          examples:
          - WNBU
          - EN Routing
        description:
          type:
          - string
          - "null"
          description: Detailed description of the product. Null when no description is available.
          readOnly: true
          maxLength: 240
          examples:
          - Catalyst 9300 48-port data only, Base switch
        family:
          type:
          - string
          - "null"
          description: Platform family that groups related products for reporting and installed-base summaries. Null when no product family is available.
          readOnly: true
          maxLength: 128
          examples:
          - Cisco Catalyst 9300 Series Switches
          - Cisco Catalyst 8000V Edge Software
        hardwareEndOfLifeBulletin:
          $ref: "#/components/schemas/std.EntityRef"
          description: End-of-life bulletin for this product's hardware, if one has been published. Announcement details can be unknown until the bulletin is available. Null when no end-of-life announcement applies.
          readOnly: true
          examples:
          - /product/v1/hardwareEndOfLifeBulletins/1ddce58f-8af9-8e90-9217-0a3a8283c30a
          x-relationship-targets:
          - product.HardwareEndOfLifeBulletin
        hasSerialNumber:
          $ref: "#/components/schemas/product.HasSerialNumber"
          description: Whether each deployed unit of this product has a serial number. Defaults to SERIAL_NUMBERING_NOT_SPECIFIED when the information is not available.
          readOnly: true
        inventoryItemId:
          type:
          - string
          - "null"
          description: Identifier used to associate this product with an inventory item. Null when no inventory item identifier is available.
          readOnly: true
          maxLength: 32
          examples:
          - "327231334"
          - "7374355"
        isServiceable:
          $ref: "#/components/schemas/product.IsServiceable"
          description: Whether deployed units of this product can be serviced. Defaults to SERVICEABILITY_NOT_SPECIFIED when the information is not available.
          readOnly: true
        name:
          type:
          - string
          - "null"
          description: Short display name for the product. Null when no display name is available.
          readOnly: true
          maxLength: 240
          examples:
          - Cisco Catalyst 8000V Edge Software
        physicalType:
          $ref: "#/components/schemas/product.PhysicalType"
          description: Physical form of the product. Defaults to UNKNOWN when the physical form is not specified.
          readOnly: true
        productId:
          $ref: "#/components/schemas/std.ProductId"
          description: Structured product identifier that uniquely identifies an orderable or installable product. Immutable.
          readOnly: true
          minLength: 1
          examples:
          - C9300-48T
          - C8000V
          - WS-C2960-24TC-L
        productSubtype:
          type:
          - string
          - "null"
          description: More specific functional grouping within `productType`. Null when no functional subtype is available.
          readOnly: true
          maxLength: 128
          examples:
          - Catalyst 9800 Wireless Controller for Cloud
        productType:
          type:
          - string
          - "null"
          description: Functional classification that describes the primary function of the product. Null when no functional classification is available for the product.
          readOnly: true
          maxLength: 64
          examples:
          - Routers
          - Wireless
          - Switches
        softwareType:
          description: Operating system family supported by the product. Null when no software family is associated with the product.
          readOnly: true
          examples:
          - IOS-XE
          - NX-OS
          - ASA; FTD; FXOS
          anyOf:
          - $ref: "#/components/schemas/std.SoftwareType"
          - type: "null"
        sys:
          type: object
          description: System metadata for provisioning state.
          readOnly: true
          properties:
            createdAt:
              type: string
              format: date-time
              description: When this entity was created. Set automatically by the server and never updated after that. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
            ownership:
              $ref: "#/components/schemas/std.Ownership"
              description: Who owns this instance. SYSTEM instances require an explicit platform role exception for updates by account principals and cannot be deleted by them. CUSTOM instances are created by an account.
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              description: When this entity was last modified. Updated automatically on every write operation. Always UTC.
              readOnly: true
              examples:
              - "2024-01-15T10:30:00Z"
    product.ProductListResponse:
      type: object
      description: Collection response containing one page of product resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources matching the request, ignoring pagination. Present only when `?count=true` was requested and the request had no pagination cursor.
        items:
          type: array
          description: Array of product resources in this paginated response.
          items:
            $ref: "#/components/schemas/product.Product"
      required:
      - items
    product.ProductNavigation:
      anyOf:
      - $ref: "#/components/schemas/product.ProductNavigationPage"
      - $ref: "#/components/schemas/product.ProductRefListResponse"
    product.ProductNavigationPage:
      type: object
      description: Link to the relationship endpoint, with an optional expanded page of product resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources this member holds, independent of how many items are present in this response. Present only when the request asked for a total.
        href:
          type: string
          format: uri-reference
          description: URL of the relationship endpoint for the containing resource.
        items:
          type: array
          description: Array of product resources in this paginated response.
          items:
            $ref: "#/components/schemas/product.Product"
        next:
          type: string
          format: uri-reference
          description: Opaque cursor to pass as `after` to the member endpoint to resume after the last element in items. Absent when items holds the whole member.
      required:
      - href
      additionalProperties: false
    product.ProductRefListResponse:
      type: object
      description: A to-many relationship member, holding a bounded set of references to product resources.
      properties:
        count:
          type: integer
          format: int64
          description: Total number of resources this member holds, independent of how many items are present in this response. Present only when the request asked for a total.
        items:
          type: array
          description: References to the product resources in this member. A bounded preview of the member when next is present.
          items:
            $ref: "#/components/schemas/std.EntityRef"
            x-relationship-targets:
            - product.Product
        next:
          type: string
          format: uri-reference
          description: Opaque cursor to pass as `after` to the member endpoint to resume after the last element in items. Absent when items holds the whole member.
      required:
      - items
    product.ProductVulnerabilityStatus:
      type: string
      enum:
