openapi: 3.2.0
$self: https://iq.cisco.com/api/product/openapi/iq-product.openapi-en.yaml
info:
  title: Product API
  summary: Product reference data, field notices, security advisories, and priority bugs.
  description: Global reference data about Cisco products, including priority bugs from the Cisco bug tracking system and product bulletins such as field notices and security advisories, with affected products, vulnerability details, and source publication metadata.
  termsOfService: https://www.cisco.com/c/en/us/about/legal/cloud-and-software.html
  contact:
    name: Cisco IQ Team
    url: https://iq.cisco.com
  license:
    name: Cisco Proprietary
    url: https://www.cisco.com/c/en/us/about/legal.html
  version: 0.1.0
servers:
- url: https://iq.cisco.com/api/product
  name: cisco-iq
  description: >-
    Global entry point for the Cisco IQ API.
- url: https://us-east-1.iq.cisco.com/api/product
  name: cisco-iq-us-east-1
  description: >-
    Cisco IQ API hosted in the United States (us-east-1).
- url: https://eu-frankfurt-1.iq.cisco.com/api/product
  name: cisco-iq-eu-frankfurt-1
  description: >-
    Cisco IQ API hosted in Europe (eu-frankfurt-1).
security:
- bearerAuth: []
tags:
- name: Bugs
  kind: nav
- name: End of Life
  kind: nav
- name: Field Notices
  kind: nav
- name: Products
  kind: nav
- name: Security Advisories
  kind: nav
- name: deprecated
  description: Deprecated — scheduled for removal in a future release.
  kind: badge
- name: preview
  description: Preview API — subject to breaking changes without notice.
  kind: badge
paths:
  /v1/advisoryProducts:
    summary: Advisory Product collection
    description: Collection endpoint for listing Advisory Products and creating new Advisory Product resources.
    get:
      operationId: listProductAdvisoryProducts
      summary: List advisory products
      description: Retrieves advisory products.
      tags:
      - Security Advisories
      x-actions:
      - list:product.advisoryProduct
      parameters:
      - $ref: "#/components/parameters/max"
      - $ref: "#/components/parameters/after"
      - name: orderby
        in: query
        summary: Order by
        description: "Comma-separated list of field names to order results by, each optionally suffixed with \" desc\" for descending order (ascending is the default). Example: name,createdAt desc. Choose a stable field for predictable pagination."
        schema:
          type: string
      - $ref: "#/components/parameters/filter"
      - $ref: "#/components/parameters/select"
      - $ref: "#/components/parameters/count"
      - $ref: "#/components/parameters/traceparent"
      responses:
        "200":
          description: Successfully retrieved list of Advisory Products.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
            Content-Disposition:
              $ref: "#/components/headers/Content-Disposition"
            Content-Encoding:
              $ref: "#/components/headers/Content-Encoding"
            Date:
              $ref: "#/components/headers/Date"
            Link:
              summary: Pagination links
              description: RFC 5988 navigation links for the current collection page. Relations may include next, prev, first, and last when those pages exist.
              schema:
                type: string
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
            Server-Timing:
              $ref: "#/components/headers/Server-Timing"
            Vary:
              $ref: "#/components/headers/Vary"
            X-Total-Count:
              $ref: "#/components/headers/X-Total-Count"
            traceparent:
              $ref: "#/components/headers/traceparent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/product.AdvisoryProductListResponse"
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              description: The result as an Excel workbook. The header row holds the field labels.
              schema:
                type: string
                format: binary
            text/csv:
